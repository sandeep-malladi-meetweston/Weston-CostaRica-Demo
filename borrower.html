       * mortgage team and nothing of the bank's internals (§7). The text is data,
       * stored verbatim and escaped once by the renderer.
       *
       * Stamped on arrival, not with the clock it was written by — the mirror
       * of the same fix on the lender's own `bridgeAbsorb` (§7): the desk's
       * narrative runs a day after hers, so keeping its timestamp would file a
       * reply that just landed as though it arrived a day after the message
       * it answers, jumping her own thread forward a full day mid-conversation.
       * `beatTimestamp` is already how every one of her own beats — sent or
       * scripted — gets its instant; an arrival is simply the next one. Each
       * entry in the batch a second later than the one before it, so a batch
       * keeps its order without every message claiming the same minute.
       */
      function bridgeAbsorb(viewState, options) {
        var fresh = bridgeIncoming(options);
        if (!fresh.length) {
          return { changed: false, viewState: viewState, absorbed: [], announcement: null };
        }
        var state = viewState.state;
        var received = Date.parse(beatTimestamp(SCRIPT.length + viewState.thread.length + 1));
        fresh.forEach(function (entry, index) {
          /* Filed on the document it actually answers, the same way the desk
             files her messages — so a reply written from a document's own
             review page arrives back on that document, not just in the
             WhatsApp thread everyone sees regardless of which document they
             asked about. */
          var documentId =
            workspace.DOCUMENT_IDS.indexOf(entry.documentId) === -1
              ? workspace.DOCUMENT_IDS[0]
              : entry.documentId;
          var stamp = new Date(received + index * 1000).toISOString();
          state = workspace.sendLenderMessage(state, documentId, entry.text, stamp);
          /* A decision made on the desk is not actually closed until her own
             checklist agrees — otherwise a document the lender just accepted
             keeps reading whatever her last upload left it at. Applied only to
             the document the entry actually names, never the "somewhere" the
             message above falls back to: a verdict is not a note that merely
             wants a home, and guessing one for it would land someone's
             decision on the wrong document. */
          if (
            typeof entry.verdict === "string" &&
            workspace.VERDICTS.indexOf(entry.verdict) !== -1 &&
            workspace.DOCUMENT_IDS.indexOf(entry.documentId) !== -1
          ) {
            state = workspace.setVerdict(
              state,
              entry.documentId,
              entry.verdict,
              { condition: entry.condition || "" },
              stamp
            );
            state = workspace.settleConditionsFor(state, entry.documentId, stamp);
          }
        });
        var arriving = fresh.map(function (entry) {
          return { author: "assistant", text: entry.text };
        });
        return {
          changed: true,
          viewState: fork(viewState, { state: state, thread: viewState.thread.concat(arriving) }),
          absorbed: fresh,
          announcement: { key: "borrower.chat.received", params: { count: fresh.length } }
        };
      }

      /* ==================================================== the demo controls */

      function setPaused(viewState, paused) {
        return fork(viewState, { paused: Boolean(paused) });
      }

      function setSpeed(viewState, speed) {
        if (SPEEDS.indexOf(speed) === -1) return viewState;
        return fork(viewState, { speed: speed });
      }

      /**
       * Back to the beginning, honestly (§7). The shared thread is empty on both
       * sides afterwards — the bridge is not merely forgotten on this side, it is
       * emptied and its run moved on, so nothing a previous run wrote can reappear
       * on the lender board. The case is re-seeded with the opening state rather
       * than left behind, so a lender tab reading storage next sees a case that has
       * not started rather than the finished one — including one that is already
       * open: the fresh run number is written to CASE_RESET_KEY too, which is
       * what tells an open lender tab to drop its own copy of the conversation
       * rather than wait for a message that will now never arrive.
       */
      function restart(options) {
        var settings = options || {};
        var bridge = settings.storage === undefined ? bridgeStorage() : settings.storage;
        var forCase =
          settings.caseStorage === undefined
            ? settings.storage === undefined
              ? caseStorage()
              : settings.storage
            : settings.caseStorage;
        bridgeClear(bridge);
        writeRaw(bridge, CASE_RESET_KEY, String(bridgeRun));
        var opening = initialViewState();
        /* A storage that refuses is not a reason to refuse the restart: the demo
           carries on in memory and the page says so once. */
        saveCase(forCase, opening.state);
        clearView(forCase);
        pendingBeat = null;
        return opening;
      }

      /* ======================================================== the composer */

      /**
       * Javiera writing into the thread for real. Her text is stored verbatim —
       * escaping is the renderer's job, once, at the boundary — and the engine
       * raises exactly one item for it, which is what reaches the lender board.
       *
       * `options.storage` is the bridge: given one, the message is also put on it so
       * a lender tab open beside this one hears her within a second (§7). Omitted —
       * which is how the suite drives the composer — the message stays local.
       */
      /**
       * What the assistant says back, decided by the document she is asking
       * about. Pure and total: same state, same reply, every run — a demo that
       * answers differently on the second take is worse than one that says
       * nothing. The assistant explains and hands off; it never claims to have
       * decided anything, because it has not.
       */
      function assistantReplyKey(viewState, documentId) {
        var record = viewState.state.documents[documentId];
        var verdict = record ? record.verdict : "not-uploaded";
        if (documentId === "title-certificate" && verdict === "under-review") {
          return "borrower.assistant.reply-specialist";
        }
        if (verdict === "rejected") return "borrower.assistant.reply-rejected";
        if (workspace.READY_VERDICTS.indexOf(verdict) !== -1) {
          return "borrower.assistant.reply-accepted";
        }
        if (viewState.escalated) return "borrower.assistant.reply-escalated";
        return "borrower.assistant.reply-ack";
      }

      /**
       * The assistant's answer, applied. It goes three places at once: her
       * thread so she sees it, the shared case state so the lender's desk shows
       * the same conversation, and the bridge so it lands in the other tab
       * without a reload. Recorded as an assistant message, which raises no
       * review item — nobody is being asked for anything.
       */
      function assistantReplies(viewState, documentId, options) {
        var key = assistantReplyKey(viewState, documentId);
        var body = t(key);
        var timestamp = beatTimestamp(SCRIPT.length + viewState.thread.length + 1);
        var state = workspace.sendAssistantMessage(viewState.state, documentId, body, timestamp);
        if (options && options.storage !== undefined) {
          bridgeSend(options.storage, {
            from: "assistant",
            text: body,
            timestamp: timestamp,
            documentId: documentId
          });
        }
        return fork(viewState, {
          state: state,
          thread: viewState.thread.concat([{ author: "assistant", key: key }])
        });
      }

      function sendBorrowerMessage(viewState, raw, options) {
        var body = String(raw === null || raw === undefined ? "" : raw).trim();
        if (!body) {
          return {
            changed: false,
            viewState: viewState,
            bridged: null,
            announcement: { key: "borrower.chat.blank" }
          };
        }
        var documentId = viewState.currentDocumentId || workspace.DOCUMENT_IDS[0];
        var timestamp = beatTimestamp(SCRIPT.length + viewState.thread.length + 1);
        var state = workspace.sendBorrowerMessage(viewState.state, documentId, body, timestamp);
        var bridged = null;
        if (options && options.storage !== undefined) {
          bridged = bridgeSend(options.storage, {
            from: BRIDGE_ROLE,
            text: body,
            timestamp: timestamp,
            documentId: documentId
          }).ok;
        }
        var sent = fork(viewState, {
          state: state,
          thread: viewState.thread.concat([{ author: "borrower", text: body }])
        });

        /* The assistant answers a beat later, on its own. Scheduled through the
           same `later` seam the narrative uses, so a test decides when it lands
           and nothing here waits on a real clock. `readState` lets the caller
           feed the reply the state as it is when the beat arrives, rather than
           the one captured here — she may have sent two messages in the gap. */
        if (options && typeof options.later === "function") {
          options.later(ASSISTANT_REPLY_MS, function () {
            var current =
              typeof options.readState === "function" ? options.readState() : sent;
            var replied = assistantReplies(current, documentId, options);
            if (typeof options.onReply === "function") options.onReply(replied);
          });
        }

        return {
          changed: true,
          viewState: sent,
          bridged: bridged,
          announcement: { key: "borrower.chat.sent" }
        };
      }

      /**
       * Her half of the loan assistant on a document's own review page: filed
       * against that one document, not the WhatsApp thread on the documents
       * page, so it raises the same review item on the desk that a message
       * from the main thread would. No scripted reply follows it — the desk's
       * answer is a real one, written back through `commitReply` or the
       * conversation box on the case, and it arrives here over the bridge.
       */
      function sendDrawerMessage(viewState, documentId, raw, options) {
        var body = String(raw === null || raw === undefined ? "" : raw).trim();
        if (!body) {
          return {
            changed: false,
            viewState: viewState,
            bridged: null,
            announcement: { key: "borrower.chat.blank" }
          };
        }
        var timestamp = beatTimestamp(SCRIPT.length + viewState.thread.length + 1);
        var state = workspace.sendBorrowerMessage(viewState.state, documentId, body, timestamp);
        var bridged = null;
        if (options && options.storage !== undefined) {
          bridged = bridgeSend(options.storage, {
            from: BRIDGE_ROLE,
            text: body,
            timestamp: timestamp,
            documentId: documentId
          }).ok;
        }
        return {
          changed: true,
          viewState: fork(viewState, { state: state }),
          bridged: bridged,
          announcement: { key: "borrower.chat.sent" }
        };
      }

      /* =========================================================== the drawer */

      var DRAWER_TABS = ["review", "assistant", "document", "history"];

      /* Nine documents, and the fields the review compared on each — the same
         field sets the lender's document records show, because it is the same
         review. */
      var CHECK_FIELDS = {
        "national-id": ["full-name", "id-number", "date-of-birth", "validity"],
        payslips: ["stated-income", "periods", "employer", "payment-to-income"],
        "employment-tenure": ["tenure", "contract-type", "employer"],
        "pension-contributions": ["months", "continuity", "file-source"],
        "tax-folder": ["taxpayer-id-number", "purpose", "periods", "issue-date"],
        "down-payment-proof": ["amount-required", "ownership", "source-of-funds"],
        "purchase-promise": ["signature-date", "price", "buyer", "condition"],
        "first-home-affidavit": ["signature", "previous-subsidy", "debtors-registry"],
        "title-certificate": ["encumbrances", "owner", "tax-roll", "validity"]
      };

      var CHECK_GLYPHS = { verified: "✓", mismatch: "⚠", missing: "✕", note: "·" };

      /**
       * The scanned page behind each document, as fields rather than an image:
       * a row is `[field, mismatched?]`, resolved through copy at render time so
       * the facsimile is translatable like everything else. She is looking at a
       * picture of her own paperwork, which is what makes the review legible —
       * a list of findings with no document attached asks her to take the
       * bank's word for it.
       *
       * The shape of the page is `FalabellaWorkspace.SCAN_ROWS`, and the one
       * document whose page changes — the tax folder's first scan cropped the
       * right margin, so its ID number is short a digit until she re-sends it — is
       * `SCAN_OVERRIDES`. Both live in the shared module because the lender's
       * case record shows the same facsimile, and the desk and the borrower
       * must not be looking at two different pages.
       */
      var scanRowsFor = workspace.scanRowsFor;
      var scanOverrideFor = workspace.scanOverrideFor;

      function openDocument(viewState, documentId) {
        var record = viewState.state.documents[documentId];
        /* Nothing has been compared on a document that never arrived, so there
           is no review to open. */
        if (!record || record.verdict === "not-uploaded") {
          return fork(viewState, { openDocumentId: null, drawerTab: "review" });
        }
        return fork(viewState, { openDocumentId: documentId, drawerTab: "review" });
      }

      function closeDocument(viewState) {
        return fork(viewState, { openDocumentId: null, drawerTab: "review" });
      }

      /* From a notification straight to the page it is about, rather than the
         review that was written on it — the drawer's "document" tab, closing
         the tray behind it. */
      function openDocumentPreview(viewState, documentId) {
        var record = viewState.state.documents[documentId];
        if (!record || record.verdict === "not-uploaded") return viewState;
        return fork(viewState, {
          openDocumentId: documentId,
          drawerTab: "document",
          notificationsOpen: false
        });
      }

      function setDrawerTab(viewState, tab) {
        if (DRAWER_TABS.indexOf(tab) === -1) return viewState;
        return fork(viewState, { drawerTab: tab });
      }

      /**
       * Move her to a phase. The three phases are three pages of one flow, so
       * arriving at a new one puts her at the top of it rather than wherever the
       * last page happened to be scrolled to — the same thing the Spanish
       * original does. An unknown phase is refused, and staying put is not a
       * page change, so neither asks for a scroll.
       */
      function goToPhase(viewState, phase) {
        if (PHASES.indexOf(phase) === -1) return viewState;
        if (viewState.phase === phase) return fork(viewState, { scrollTop: false });
        return fork(viewState, { phase: phase, scrollTop: true });
      }

      function check(documentId, field, status, stated, found) {
        return {
          labelKey: "lender.check." + documentId + "." + field,
          status: status,
          stated: stated === undefined ? null : stated,
          found: found === undefined ? null : found
        };
      }

      function statusForVerdict(verdict) {
        if (workspace.READY_VERDICTS.indexOf(verdict) !== -1) return "verified";
        if (verdict === "rejected") return "missing";
        return "note";
      }

      /**
       * What the review found on one document, in the borrower's own view. Two
       * documents are special because the story turns on them: the title
       * certificate carries the field-by-field comparison with the encumbrance
       * row mismatched and the registration cited, and the tax folder names the
       * single field she can fix herself.
       */
      function reviewChecksFor(documentId, record) {
        var verdict = record ? record.verdict : "not-uploaded";
        var fields = CHECK_FIELDS[documentId] || [];

        if (documentId === "title-certificate") {
          return [
            check(
              documentId,
              "encumbrances",
              "mismatch",
              t("lender.documents.encumbrance-stated"),
              t("lender.documents.encumbrance-found")
            ),
            check(documentId, "owner", "verified"),
            check(documentId, "tax-roll", "verified"),
            check(documentId, "validity", "verified")
          ];
        }

        if (documentId === "tax-folder" && verdict === "rejected") {
          return fields.map(function (field) {
            return check(documentId, field, field === "taxpayer-id-number" ? "missing" : "verified");
          });
        }

        var status = statusForVerdict(verdict);
        return fields.map(function (field) {
          return check(documentId, field, status);
        });
      }

      /* What she is told about the document, and whether anything is being asked
         of her. Document 9 is the one that says: a specialist has it, sit tight. */
      function bannerFor(documentId, record, checks) {
        var verdict = record ? record.verdict : "not-uploaded";
        if (documentId === "title-certificate") {
          return { key: "borrower.banner.review", tone: "attention", params: null };
        }
        if (documentId === "tax-folder" && verdict === "rejected") {
          return { key: "borrower.banner.incomplete", tone: "attention", params: null };
        }
        if (workspace.READY_VERDICTS.indexOf(verdict) !== -1) {
          return { key: "borrower.banner.accepted", tone: "calm", params: null };
        }
        if (verdict === "rejected") {
          var discrepancies = checks.filter(function (item) {
            return item.status !== "verified";
          }).length;
          return { key: "borrower.banner.rejected", tone: "attention", params: { count: discrepancies } };
        }
        return { key: "borrower.banner.analysing", tone: "calm", params: null };
      }

      /* =============================================================== render */

      function documentNumber(documentId) {
        return workspace.DOCUMENT_IDS.indexOf(documentId) + 1;
      }

      function receivedCount(state) {
        return workspace.DOCUMENT_IDS.filter(function (documentId) {
          return workspace.READY_VERDICTS.indexOf(state.documents[documentId].verdict) !== -1;
        }).length;
      }

      function renderPhaseRail(viewState) {
        var here = PHASES.indexOf(viewState.phase);
        return (
          '<nav class="phase-rail" aria-label="' +
          text("borrower.portal.title") +
          '">' +
          PHASES.map(function (phase, index) {
            var state = index < here ? "done" : index === here ? "current" : "todo";
            return (
              '<button type="button" class="phase-step" data-phase="' +
              escapeHtml(phase) +
              '" data-state="' +
              escapeHtml(state) +
              '"' +
              (state === "current" ? ' aria-current="step"' : "") +
              '><span class="phase-index" aria-hidden="true">' +
              (index + 1) +
              "</span><span>" +
              text("borrower.phase." + phase) +
              "</span></button>"
            );
          }).join("") +
          '<span class="rail-meta">' +
          renderCaseMeta(viewState) +
          renderLiveState(viewState) +
          "</span></nav>"
        );
      }

      /* The rail says what the demo is doing to itself: playing, paused, over.
         The dot pulses only while something is actually about to happen. */
      function renderLiveState(viewState) {
        var state = !viewState.started
          ? "idle"
          : viewState.finished
            ? "finished"
            : viewState.paused
              ? "paused"
              : "playing";
        return (
          '<span class="rail-live" data-state="' +
          state +
          '"><span class="live-dot" aria-hidden="true"></span>' +
          text("borrower.control." + state) +
          "</span>"
        );
      }

      function renderDemoControls(viewState) {
        var playPauseKey = viewState.paused ? "borrower.control.play" : "borrower.control.pause";
        return (
          '<div class="demo-controls">' +
          '<div class="control-group">' +
          /* The one control that starts anything. Nothing plays until it, or
             Play, is pressed — the page opens on an empty form. */
          '<button type="button" class="primary" data-demo-action="demo-data" aria-label="' +
          text("borrower.control.demo-data-aria") +
          '">' +
          icon("sparkle") +
          "<span>" +
          text("borrower.control.demo-data") +
          "</span></button>" +
          '<button type="button" data-demo-action="play-pause" aria-pressed="' +
          (viewState.paused ? "false" : "true") +
          '">' +
          text(playPauseKey) +
          "</button>" +
          '<button type="button" data-demo-action="restart">' +
          text("borrower.control.restart") +
          "</button>" +
          "</div>" +
          /* One control rather than three buttons: the speeds are a single
             choice, and a select says that in a quarter of the width. */
          '<div class="control-group">' +
          '<label class="control-legend" for="speed-select">' +
          text("borrower.control.speed") +
          "</label>" +
          '<select id="speed-select" data-speed-select>' +
          SPEEDS.map(function (speed) {
            return (
              '<option value="' +
              speed +
              '"' +
              (viewState.speed === speed ? " selected" : "") +
              ">" +
              text("borrower.control.speed-" + speed + "x") +
              "</option>"
            );
          }).join("") +
          "</select></div>" +
          /* ---- what language, what unit ----
           *
           * The same two switches the other portal carries, and now the same
           * control. Here they were two legended groups — one for the language,
           * one for the unit — spelling out the section names and both language
           * names in full, which cost about a third of the bar and pushed the
           * whole row onto a second line that overlapped the page beneath.
           *
           * Worse, they sat among the transport controls, which said they were
           * part of the demo rigging. They are not: they are what the audience
           * reads in. One frame around both, a hairline between them, set apart
           * from the buttons that drive the timeline.
           *
           * The two-letter codes rather than the language names, for the same
           * reason the other portal uses them: the pair is the label, and each
           * button still carries the full name in its `title`. Both remain
           * `aria-pressed` groups with their own `aria-label`, so the state is
           * audible as well as visible (§9).
           */
          '<div class="control-cluster">' +
          '<div class="switch-pair" role="group" aria-label="' +
          text("borrower.control.language") +
          '">' +
          copy.LOCALES.map(function (locale) {
            return (
              '<button type="button" class="locale-button" data-locale="' +
              escapeHtml(locale) +
              '" aria-pressed="' +
              (activeLocaleId() === locale ? "true" : "false") +
              /* The full language name, which the button no longer has room to
                 show, is exactly what the tooltip should say. */
              '" title="' +
              text("borrower.control.language-" + locale) +
              '">' +
              escapeHtml(locale.toUpperCase()) +
              "</button>"
            );
          }).join("") +
          "</div>" +
          '<div class="control-divider" aria-hidden="true"></div>' +
          '<div class="switch-pair" role="group" aria-label="' +
          text("borrower.control.money") +
          '">' +
          MONEY_UNITS.map(function (unit) {
            return (
              '<button type="button" class="locale-button" data-money-unit="' +
              unit +
              '" aria-pressed="' +
              (viewState.moneyUnit === unit ? "true" : "false") +
              '" title="' +
              text("borrower.control.money-" + unit.toLowerCase() + "-title") +
              '">' +
              text("borrower.control.money-" + unit.toLowerCase()) +
              "</button>"
            );
          }).join("") +
          "</div></div></div>"
        );
      }

      /* Whether the assistant is shown composing a reply. Presentation only: the
         view state is the narrative's, and a typing indicator is not part of it. */
      var assistantTyping = false;

      /* ------------------------------------------------------------- icons */

      /* Line icons, inline so the demo survives with no network, decorative in
         every case: each one sits beside a word that already says what it means. */
      var ICON_PATHS = {
        house: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
        building:
          '<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
        check: '<path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>',
        cross: '<path d="M6 6l12 12M18 6 6 18"/>',
        clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
        alert: '<path d="M12 4.5 21 19.5H3z"/><path d="M12 10v4"/><path d="M12 16.6v.4"/>',
        file: '<path d="M14 3H7.5A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V7z"/><path d="M14 3v4.5H18"/>',
        send: '<path d="M2 21 23 12 2 3v7l15 2-15 2z"/>',
        sparkle: '<path d="M12 3.5 13.9 9l5.6 2-5.6 2-1.9 5.5L10.1 13 4.5 11l5.6-2z"/>',
        bell:
          '<path d="M18 15.5V11a6 6 0 1 0-12 0v4.5L4.5 18h15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/>',
        eye:
          '<path d="M2.5 12S6.5 5.5 12 5.5 21.5 12 21.5 12 17.5 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'
      };

      function icon(name, options) {
        var settings = options || {};
        return (
          '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="' +
          (settings.fill ? "currentColor" : "none") +
          '" stroke="' +
          (settings.fill ? "none" : "currentColor") +
          '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
          ICON_PATHS[name] +
          "</svg>"
        );
      }

      /* The tile at the head of a checklist row: the document's number until
         something has been said about it, then the shape of that verdict. */
      var VERDICT_ICONS = {
        accepted: "check",
        "accepted-with-condition": "check",
        rejected: "cross",
        "under-review": "clock"
      };

      /* The bell, its count, and the panel it opens — one unit, so the panel is
         positioned by the control that owns it rather than by the bar. */
      function renderNotificationBell(viewState) {
        var unseen = unseenNotifications(viewState).length;
        return (
          '<div class="notification-bell">' +
          '<button type="button" class="bell-button" data-notifications="toggle"' +
          ' aria-expanded="' +
          (viewState.notificationsOpen ? "true" : "false") +
          '" aria-controls="notification-panel" aria-label="' +
          text("borrower.notifications.open", { count: unseen }) +
          '">' +
          icon("bell") +
          (unseen
            ? '<span class="bell-count" aria-hidden="true">' + unseen + "</span>"
            : "") +
          "</button>" +
          renderNotifications(viewState) +
          "</div>"
        );
      }

      function renderTopbar(viewState) {
        return (
          '<header class="topbar">' +
          '<span class="topbar-logo topbar-wordmark">' +
          text("common.brand-name") +
          "</span>" +
          '<span class="portal-label">' +
          text("borrower.title") +
          "</span>" +
          renderDemoControls(viewState) +
          renderNotificationBell(viewState) +
          /* Names the case in the query, so the desk opens straight on it —
             the same overview, notifications and snapshot the officer would
             have been looking at — rather than the bare board every switch
             used to land on regardless of which case anyone was showing. */
          '<a class="demo-role-switch" href="lender.html?case=' +
          encodeURIComponent(CASE_ID) +
          '" aria-label="' +
          text("borrower.switch-to-lender-aria") +
          '">' +
          text("borrower.switch-to-lender") +
          "</a></header>"
        );
      }

      function figureRow(labelKey, value, options) {
        var settings = options || {};
        return (
          '<div class="figure-row' +
          (settings.className ? " " + settings.className : "") +
          '"><span>' +
          text(labelKey, settings.labelParams) +
          "</span><strong>" +
          escapeHtml(value) +
          "</strong></div>"
        );
      }

      function detailRow(labelKey, value) {
        return "<div><dt>" + text(labelKey) + "</dt><dd>" + escapeHtml(value) + "</dd></div>";
      }

      /* A section heading with the lime rule beside it, as in the Spanish demo. */
      function sectionTitle(labelKey) {
        return (
          '<h3 class="sect-title"><span class="sect-bar" aria-hidden="true"></span>' +
          text(labelKey) +
          "</h3>"
        );
      }

      /* One question, and a real control to answer it with. The field is hers to
         type into; everything to the right of it recomputes as she does. */
      function simField(field, labelKey, value, options) {
        var settings = options || {};
        return (
          '<div class="sim-field"><label class="sim-label" for="field-' +
          escapeHtml(field) +
          '">' +
          text(labelKey) +
          '</label><span class="sim-value' +
          (value ? " filled" : "") +
          '">' +
          (settings.prefix
            ? '<span class="sim-prefix" aria-hidden="true">' + escapeHtml(settings.prefix) + "</span>"
            : "") +
          '<input id="field-' +
          escapeHtml(field) +
          '" type="text" inputmode="' +
          (settings.numeric ? "numeric" : "text") +
          '" autocomplete="off" data-form-input="' +
          escapeHtml(field) +
          '" value="' +
          escapeHtml(value) +
          '">' +
          (settings.suffix
            ? '<span class="sim-prefix" aria-hidden="true">' + escapeHtml(settings.suffix) + "</span>"
            : "") +
          (settings.note ? '<span class="sim-note">' + escapeHtml(settings.note) + "</span>" : "") +
          "</span></div>"
        );
      }

      /* The choice tiles: real buttons, one pressed. */
      function simTiles(field, labelKey, options) {
        return (
          '<div class="sim-field"><span class="sim-label" id="label-' +
          escapeHtml(field) +
          '">' +
          text(labelKey) +
          '</span><div class="tiles" role="group" aria-labelledby="label-' +
          escapeHtml(field) +
          '">' +
          options
            .map(function (option) {
              return (
                /* An id so the paint can hand focus back to the same tile: it is
                   replaced, not updated, the moment it is pressed. */
                '<button type="button" id="tile-' +
                escapeHtml(field) +
                "-" +
                escapeHtml(option.value) +
                '" class="tile' +
                (option.on ? " on" : "") +
                (option.small ? " small" : "") +
                '" data-form-field="' +
                escapeHtml(field) +
                '" data-form-value="' +
                escapeHtml(option.value) +
                '" aria-pressed="' +
                (option.on ? "true" : "false") +
                '">' +
                (option.icon ? icon(option.icon) : "") +
                "<span>" +
                (option.labelKey ? text(option.labelKey) : escapeHtml(option.label)) +
                "</span></button>"
              );
            })
            .join("") +
          "</div></div>"
        );
      }

      function summaryRow(labelKey, value, labelParams) {
        return (
          '<div class="summary-row"><span>' +
          text(labelKey, labelParams) +
          "</span><strong>" +
          escapeHtml(value) +
          "</strong></div>"
        );
      }

      var CR_PROVINCES = [
        "San José",
        "Alajuela",
        "Cartago",
        "Heredia",
        "Guanacaste",
        "Puntarenas",
        "Limón"
      ];

      /* The property's address, and a mocked "Verify address" check. This is a
         demo stand-in: a real integration would call Google Maps/Places from
         the server to confirm the address exists before the case moves on. */
      function renderAddressFields(form, viewState) {
        var provinceOptions = CR_PROVINCES.map(function (province) {
          return (
            '<option value="' +
            escapeHtml(province) +
            '"' +
            (form.provincia === province ? " selected" : "") +
            ">" +
            escapeHtml(province) +
            "</option>"
          );
        }).join("");
        return (
          simField("streetAddress", "borrower.sim.street-address", form.streetAddress) +
          '<div class="sim-field"><label class="sim-label" for="field-provincia">' +
          text("borrower.sim.provincia") +
          '</label><span class="sim-value' +
          (form.provincia ? " filled" : "") +
          '"><select id="field-provincia" data-form-input="provincia">' +
          '<option value="">' +
          text("borrower.sim.provincia-placeholder") +
          "</option>" +
          provinceOptions +
          "</select></span></div>" +
          simField("canton", "borrower.sim.canton", form.canton) +
          simField("distrito", "borrower.sim.distrito", form.distrito) +
          '<div class="sim-actions">' +
          '<button type="button" class="secondary" data-verify-address' +
          (viewState && viewState.addressVerifying ? " disabled" : "") +
          ">" +
          text(
            viewState && viewState.addressVerifying
              ? "borrower.sim.verify-address-checking"
              : "borrower.sim.verify-address"
          ) +
          "</button>" +
          (viewState && viewState.addressVerified
            ? '<span class="footnote address-verified">' + text("borrower.sim.address-verified") + "</span>"
            : "") +
          "</div>"
        );
      }

      /* The simulation. Every figure below is FalabellaCredit's; this function
         only decides where they sit on the page — the form on the left as she
         answered it, and what the bank made of it on the right, checking itself
         as the narrative plays. */
      function renderSimulator(viewState) {
        var f = figures(viewState);
        var form = viewState.form || emptyForm();
        /* The button is the end of the verification, not the start of it: it
           lights only once the form is complete *and* all nine sources have
           answered. */
        var ready = formReady(form) && allChecksDone(viewState, f);
        var propertyUF = typedNumber(form.propertyUF);
        var downPct = typedNumber(form.downPct);
        return (
          '<div class="sim-layout">' +
          '<section class="panel-card" data-panel="simulator" aria-labelledby="sim-title">' +
          '<span class="eyebrow">' +
          text("borrower.phase.simulate") +
          "</span>" +
          '<h1 id="sim-title">' +
          text("borrower.sim.title") +
          "</h1>" +
          '<p class="panel-lead">' +
          text("borrower.sim.subtitle") +
          "</p>" +
          sectionTitle("borrower.sim.section-property") +
          simTiles("propertyType", "borrower.sim.property-type", [
            {
              value: "house",
              icon: "house",
              labelKey: "borrower.sim.house",
              on: form.propertyType === "house"
            },
            {
              value: "apartment",
              icon: "building",
              labelKey: "borrower.sim.apartment",
              on: form.propertyType === "apartment"
            }
          ]) +
          simTiles("condition", "borrower.sim.condition", [
            {
              value: "new",
              labelKey: "borrower.sim.new",
              on: form.condition === "new",
              small: true
            },
            {
              value: "used",
              labelKey: "borrower.sim.used",
              on: form.condition === "used",
              small: true
            }
          ]) +
          simField("propertyUF", "borrower.sim.property-value", form.propertyUF, {
            prefix: "$",
            numeric: true,
            note: propertyUF ? credit.formatUSD(f.propertyUSD) : ""
          }) +
          simField("downPct", "borrower.sim.down-payment", form.downPct, {
            suffix: "%",
            numeric: true,
            note: downPct ? credit.formatUSD(f.downPaymentUSD) : ""
          }) +
          sectionTitle("borrower.sim.section-details") +
          simField("idNumber", "borrower.sim.id-number", form.idNumber) +
          simField("dateOfBirth", "borrower.sim.date-of-birth", form.dateOfBirth) +
          simField("incomeCLP", "borrower.sim.income", form.incomeCLP, {
            prefix: "$",
            numeric: true,
            note: statedIncome(form) ? credit.formatUSD(f.incomeUSD) : ""
          }) +
          sectionTitle("borrower.sim.section-address") +
          renderAddressFields(form, viewState) +
          sectionTitle("borrower.sim.section-loan") +
          simTiles(
            "termYears",
            "borrower.sim.term",
            [15, 20, credit.TERM_YEARS].map(function (years) {
              return {
                value: String(years),
                label: years + " " + t("borrower.sim.years"),
                on: typedNumber(form.termYears) === years,
                small: true
              };
            })
          ) +
          sectionTitle("borrower.sim.section-verification") +
          '<p class="panel-lead">' +
          text("borrower.sim.verify-intro") +
          "</p>" +
          renderVerifyChecks(viewState, f) +
          '<div class="sim-actions">' +
          '<button type="button" class="cta" id="sim-submit" data-phase="pre-approval"' +
          (ready ? "" : " disabled") +
          ">" +
          text("borrower.sim.submit") +
          "</button>" +
          '<span class="footnote">' +
          text("borrower.sim.footnote") +
          "</span></div></section>" +
          renderSimulationSummary(viewState, f) +
          "</div>"
        );
      }

      /* The rail beside the form: what she has told the bank so far, what the
         bank can lend against it, and whether the state guarantee applies. */
      function renderSimulationSummary(viewState, f) {
        var form = viewState.form || emptyForm();
        var ratioPct = f.dti.ratio * 100;
        var capPct = f.dti.cap * 100;
        var fill = Math.min(100, (f.dti.ratio / f.dti.cap) * 100);
        /* A figure she has not given us yet is a dash, not the reference case's
           answer: the rail must never quote numbers she never typed. */
        var hasProperty = Boolean(typedNumber(form.propertyUF));
        var hasDown = Boolean(typedNumber(form.downPct));
        var hasTerm = Boolean(typedNumber(form.termYears));
        var hasIncome = Boolean(statedIncome(form));
        var priced = hasProperty && hasIncome;
        var known = function (present, value) {
          return present ? value : "—";
        };
        return (
          '<aside class="summary-rail" aria-labelledby="summary-title">' +
          '<h2 id="summary-title">' +
          text("borrower.sim.summary") +
          "</h2>" +
          '<div class="summary-group"><span class="summary-group-title">' +
          text("borrower.sim.group-property") +
          "</span>" +
          summaryRow("borrower.sim.field-value", known(hasProperty, money(f.propertyUSD))) +
          summaryRow(
            "borrower.sim.down-payment",
            known(hasProperty && hasDown, money(f.downPaymentUSD))
          ) +
          "</div>" +
          '<div class="summary-group"><span class="summary-group-title">' +
          text("borrower.sim.group-loan") +
          "</span>" +
          summaryRow("borrower.sim.field-amount", known(hasProperty, money(f.loanUSD))) +
          summaryRow(
            "borrower.sim.term",
            known(hasTerm, f.termYears + " " + t("borrower.sim.years"))
          ) +
          summaryRow("borrower.result.rate", credit.formatPct(f.annualRate * 100, 2)) +
          summaryRow("borrower.sim.field-insurance", t("borrower.sim.insurance-value")) +
          "</div>" +
          /* Affordability, computed from the income she stated and never asked
             about: the payment, the cap it is measured against, and the room
             left over — with the bar turning red if it were ever over. */
          '<div class="cap-panel"><div class="cap-head">' +
          text("borrower.sim.affordability") +
          '<span class="cap-state">' +
          escapeHtml(known(priced, credit.formatPct(ratioPct))) +
          "</span></div>" +
          '<div class="cap-body">' +
          summaryRow(
            "borrower.sim.simulated-payment",
            known(hasProperty, credit.formatUSD(f.paymentUSD))
          ) +
          '<div class="load-bar"><span class="load-bar-fill' +
          (priced && f.dti.overCap ? " over-cap" : "") +
          '" style="width:' +
          (priced ? fill.toFixed(1) : "0") +
          '%"></span></div>' +
          summaryRow("borrower.sim.stated-income", known(hasIncome, credit.formatUSD(f.incomeUSD))) +
          summaryRow(
            "borrower.sim.max-payment",
            known(hasIncome, credit.formatUSD(f.incomeUSD * f.dti.cap)),
            { cap: credit.formatPct(capPct) }
          ) +
          summaryRow(
            "borrower.check.affordability.label",
            known(priced, credit.formatPct(ratioPct))
          ) +
          summaryRow("borrower.sim.headroom", known(priced, credit.formatUSD(f.dti.headroomUSD))) +
          "</div></div>" +
          "</aside>"
        );
      }

      /* The three figures the check lines quote back at her. */
      function checkParams(f) {
        return {
          value: money(f.propertyUSD),
          cap: credit.formatPct(f.dti.cap * 100),
          ratio: credit.formatPct(f.dti.ratio * 100)
        };
      }

      /* What a row says on its right-hand side, in the state it is in. Shared
         with the in-place painter, so the two can never drift apart. */
      function checkResult(checkId, state, params) {
        if (state === "done") return t("borrower.check." + checkId + ".result", params);
        return t(state === "waiting" ? "borrower.sim.checking-item" : "borrower.sim.not-checked");
      }

      /* Nine checks, ticking as the narrative plays them. Never colour alone:
         each row carries its result as words and its source in mono. */
      function renderVerifyChecks(viewState, f) {
        var states = verifyRowStates(viewState, f);
        var params = checkParams(f);
        return (
          '<ul class="source-checks" id="verification-list">' +
          VERIFY_CHECKS.map(function (checkId, position) {
            var state = states[position];
            return (
              '<li data-check-id="' +
              escapeHtml(checkId) +
              '" data-state="' +
              state +
              '"><span class="check-mark" aria-hidden="true">' +
              (state === "done" ? "✓" : "") +
              '</span><span class="check-label"><strong>' +
              text("borrower.check." + checkId + ".label") +
              '</strong><span class="check-source">' +
              text("borrower.check." + checkId + ".source", params) +
              '</span></span><span class="check-result">' +
              escapeHtml(checkResult(checkId, state, params)) +
              "</span></li>"
            );
          }).join("") +
          "</ul>"
        );
      }

      /* The answer: a single set of approval terms. The demo used to compare a
         guaranteed offer against a standard one; this product only ever prices
         one loan, so the result is the one set of terms rather than two
         columns to reconcile. */
      function renderPreApproval(viewState) {
        var f = figures(viewState);
        return (
          '<section class="panel-card" data-panel="pre-approval" aria-labelledby="result-title">' +
          '<span class="eyebrow">' +
          text("borrower.phase.pre-approval") +
          "</span>" +
          '<h2 id="result-title">' +
          text("borrower.result.title") +
          "</h2>" +
          '<p class="badge-approved"><span aria-hidden="true">★</span> ' +
          text("borrower.result.pre-approved") +
          "</p>" +
          '<div class="result-columns">' +
          '<div class="result-column chosen"><span class="eyebrow">' +
          text("borrower.result.financing") +
          '</span><span class="result-amount">' +
          escapeHtml(credit.formatUSD(f.paymentUSD)) +
          "</span>" +
          figureRow("borrower.result.loan", money(f.loanUSD)) +
          figureRow("borrower.result.rate", credit.formatPct(f.annualRate * 100, 2)) +
          figureRow(
            "borrower.result.down-payment",
            t("borrower.result.with-financing", { amount: credit.formatUSD(f.downPaymentUSD) })
          ) +
          figureRow(
            "borrower.sim.term",
            f.termYears + " " + t("borrower.sim.years")
          ) +
          "</div></div>" +
          '<div class="sim-actions">' +
          '<button type="button" class="cta" data-phase="intro-call">' +
          text("borrower.intro-call.schedule") +
          "</button></div>" +
          '<p class="footnote">' +
          text("borrower.result.note") +
          "</p></section>"
        );
      }

      /* Which case this is, and where it stands. It used to be a masthead over
         the documents phase, which cost a screenful of height to say two things
         that never change; it belongs in the rail beside the phase it describes. */
      /* The status pill names the same open work the bell already lists, so
         it opens the same tray rather than a second way of showing it — one
         click from wherever she reads "2 open items", not just from the
         bell. */
      function renderCaseMeta(viewState) {
        if (viewState.phase !== "documents") return "";
        var openItems = workspace.openReviewItems(viewState.state);
        return (
          '<span class="rail-case"><b>' +
          text("borrower.portal.application", { case: CASE_ID }) +
          "</b>" +
          '<span class="rail-property">' +
          text("borrower.portal.property") +
          "</span></span>" +
          '<button type="button" class="status-pill" data-notifications="toggle" aria-expanded="' +
          (viewState.notificationsOpen ? "true" : "false") +
          '" aria-controls="notification-panel">' +
          text(viewState.statusKey, { count: openItems.length }) +
          "</button>"
        );
      }

      /* ------------------------------------------------------- notifications
       *
       * The same events that put a notice on the page put a line in the bell, so
       * she can find out what happened without being on the phase it happened
       * on. They are derived from the case rather than accumulated: a
       * notification is a fact about the state, not a message queue, which is why
       * nothing has to be pushed anywhere for one to appear.
       */
      function notificationsFor(viewState) {
        var notifications = [];
        if (!viewState) return notifications;
        var state = viewState.state;

        if (viewState.escalated) {
          notifications.push({
            id: "escalated",
            documentId: "title-certificate",
            titleKey: "borrower.notice.escalated-title",
            bodyKey: "borrower.notice.escalated-body",
            tone: "attention",
            at: lastMovedAt(state, "title-certificate")
          });
        }

        /* Anything still waiting on her — today that is the tax folder's missing
           page, and it is the only kind of item she can act on herself. */
        workspace.DOCUMENT_IDS.forEach(function (documentId) {
          var record = state && state.documents ? state.documents[documentId] : null;
          if (!record || record.verdict !== "rejected") return;
          notifications.push({
            id: "rejected-" + documentId,
            documentId: documentId,
            titleKey: "borrower.banner.incomplete.title",
            bodyKey: "borrower.banner.incomplete.body",
            tone: "attention",
            at: lastMovedAt(state, documentId)
          });
        });

        return notifications;
      }

      /* When the case last said something about a document. */
      function lastMovedAt(state, documentId) {
        var record = state && state.documents ? state.documents[documentId] : null;
        if (!record || !record.history || !record.history.length) return null;
        return record.history[record.history.length - 1].timestamp || null;
      }

      function unseenNotifications(viewState) {
        var seen = (viewState && viewState.seenNotifications) || [];
        return notificationsFor(viewState).filter(function (notification) {
          return seen.indexOf(notification.id) === -1;
        });
      }

      /* Opening the panel is what marks them read — the bell is not a badge that
         clears itself for being looked at from across the page. */
      function toggleNotifications(viewState, open) {
        var next = open === undefined ? !viewState.notificationsOpen : Boolean(open);
        if (!next) return fork(viewState, { notificationsOpen: false });
        return fork(viewState, {
          notificationsOpen: true,
          seenNotifications: notificationsFor(viewState).map(function (notification) {
            return notification.id;
          })
        });
      }

      function renderNotifications(viewState) {
        if (!viewState.notificationsOpen) return "";
        var notifications = notificationsFor(viewState);
        return (
          '<div class="notification-panel" id="notification-panel" role="region" aria-labelledby="notification-title">' +
          '<div class="notification-head"><h2 id="notification-title">' +
          text("borrower.notifications.title") +
          "</h2></div>" +
          (notifications.length
            ? '<ul class="notification-list">' +
              notifications
                .slice()
                .reverse()
                .map(function (notification) {
                  var at = notification.at ? clockTime(notification.at) : "";
                  var documentName = t("doc." + notification.documentId + ".name");
                  return (
                    '<li data-tone="' +
                    escapeHtml(notification.tone) +
                    '"><div class="notification-row"><strong>' +
                    text(notification.titleKey) +
                    "</strong>" +
                    '<span class="notification-meta">' +
                    (at ? '<span class="notification-time">' + escapeHtml(at) + "</span>" : "") +
                    '<button type="button" class="notification-preview" data-preview-document="' +
                    escapeHtml(notification.documentId) +
                    '" aria-label="' +
                    text("borrower.notifications.preview-aria", { document: documentName }) +
                    '">' +
                    icon("eye") +
                    "</button></span></div>" +
                    /* Which document it is about, said before what it says: a
                       notice about "one field" is useless without the file. */
                    '<span class="notification-doc">' +
                    escapeHtml(documentName) +
                    "</span><p>" +
                    text(notification.bodyKey) +
                    "</p></li>"
                  );
                })
                .join("") +
              "</ul>"
            : '<p class="notification-empty">' + text("borrower.notifications.empty") + "</p>") +
          "</div>"
        );
      }

      function renderThread(viewState) {
        return (
          '<section class="thread-card" aria-labelledby="thread-title">' +
          '<div class="thread-head">' +
          '<span class="thread-avatar" aria-hidden="true">' +
          icon("house") +
          "</span><div>" +
          '<strong id="thread-title">' +
          text("borrower.chat.assistant-name") +
          '<span class="thread-verified" aria-hidden="true">✓</span>' +
          "</strong><small>" +
          text("borrower.chat.online") +
          "</small></div></div>" +
          '<div class="thread-body" id="thread-body">' +
          '<span class="day-marker">' +
          text("borrower.chat.today") +
          "</span>" +
          viewState.thread.map(renderBubble).join("") +
          /* Purely presentational: the assistant is composing an answer to the
             message she just sent. It is set by the page, never by the state,
             so nothing in the narrative or the tests has to know about it. */
          (assistantTyping
            ? '<div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>'
            : "") +
          "</div>" +
          '<form class="composer" id="composer">' +
          '<label class="sr-only" for="composer-input">' +
          text("borrower.chat.placeholder") +
          "</label>" +
          '<input type="text" id="composer-input" name="message" autocomplete="off" placeholder="' +
          text("borrower.chat.placeholder") +
          '">' +
          '<button type="submit" id="composer-send">' +
          icon("send", { fill: true }) +
          '<span class="sr-only">' +
          text("borrower.chat.send") +
          "</span></button></form></section>"
        );
      }

      /**
       * One bubble. A scripted message is copy, so it may carry the narrative's
       * own emphasis; a message Javiera typed is data, so it is escaped and left
       * exactly as she wrote it — her asterisks are not markup.
       */
      function renderBubble(message) {
        var body = "";
        if (message.key) body = '<p>' + scripted(message.key, message.params) + "</p>";
        else if (message.text) body = "<p>" + escapeHtml(message.text) + "</p>";

        var attachment = message.attachment
          ? '<span class="attachment"><span class="file-glyph" aria-hidden="true">' +
            icon("file") +
            "</span><span>" +
            '<span class="file-name">' +
            text(message.attachment.fileKey) +
            "</span>" +
            (message.attachment.metaKey
              ? '<span class="file-meta">' + text(message.attachment.metaKey) + "</span>"
              : "") +
            "</span></span>"
          : "";

        return (
          '<div class="bubble ' +
          escapeHtml(message.author) +
          '"><span class="bubble-author">' +
          text(message.author === "borrower" ? "borrower.chat.you" : "borrower.chat.team-name") +
          "</span>" +
          body +
          attachment +
          "</div>"
        );
      }

      function renderChecklist(viewState) {
        var state = viewState.state;
        var total = workspace.DOCUMENT_IDS.length;
        var received = receivedCount(state);
        return (
          '<section class="checklist-card" id="borrower-checklist" aria-labelledby="checklist-title">' +
          '<h3 id="checklist-title">' +
          text("borrower.checklist.heading") +
          "</h3>" +
          '<p class="checklist-progress">' +
          text("borrower.checklist.progress", { received: received, total: total }) +
          "</p>" +
          /* The bar is decoration over a sentence that already says the same
             thing, so it is hidden from the reader who is being read to. */
          '<div class="progress-track" aria-hidden="true"><span class="progress-fill" data-progress="' +
          ((received / total) * 100).toFixed(1) +
          '" style="width:' +
          ((received / total) * 100).toFixed(1) +
          '%"></span></div>' +
          '<div class="checklist-scroll"><ul class="checklist">' +
          workspace.DOCUMENT_IDS.map(function (documentId) {
            var record = state.documents[documentId];
            var analysing = viewState.analysing.indexOf(documentId) !== -1;
            var openable = record.verdict !== "not-uploaded";
            var label = analysing
              ? t("borrower.banner.analysing.title")
              : t("verdict." + record.verdict);
            return (
              '<li><button type="button" class="doc-row" data-document-id="' +
              escapeHtml(documentId) +
              '" data-verdict="' +
              escapeHtml(record.verdict) +
              '" data-analysing="' +
              (analysing ? "true" : "false") +
              '" aria-label="' +
              text("borrower.checklist.open-aria", { document: t("doc." + documentId + ".name") }) +
              '"' +
              (openable ? "" : " disabled") +
              '><span class="doc-tile" aria-hidden="true">' +
              (analysing
                ? ""
                : VERDICT_ICONS[record.verdict]
                  ? icon(VERDICT_ICONS[record.verdict])
                  : documentNumber(documentId)) +
              '</span><span class="doc-body">' +
              '<span class="doc-head"><span class="doc-name">' +
              text("doc." + documentId + ".name") +
              '</span><span class="verdict-badge" data-verdict="' +
              escapeHtml(record.verdict) +
              '">' +
              escapeHtml(label) +
              "</span></span>" +
              '<span class="doc-purpose">' +
              text("doc." + documentId + ".purpose") +
              "</span></span></button></li>"
            );
          }).join("") +
          "</ul></div>" +
          "</section>"
        );
      }

      /* The same review the lender sees, told to the person it is about. */
      function renderDrawer(viewState) {
        var documentId = viewState.openDocumentId;
        if (!documentId) return "";
        var record = viewState.state.documents[documentId];
        if (!record) return "";
        var checks = reviewChecksFor(documentId, record);
        var banner = bannerFor(documentId, record, checks);

        return (
          '<div class="drawer-backdrop" data-drawer-action="close"></div>' +
          '<section class="review-drawer" role="dialog" aria-modal="true" aria-labelledby="borrower-drawer-title">' +
          '<div class="drawer-header"><div>' +
          '<span class="eyebrow">' +
          text("borrower.drawer.eyebrow") +
          "</span>" +
          '<h2 id="borrower-drawer-title">' +
          text("doc." + documentId + ".name") +
          "</h2>" +
          '<p><span class="verdict-badge" data-verdict="' +
          escapeHtml(record.verdict) +
          '">' +
          text("verdict." + record.verdict) +
          "</span></p></div>" +
          '<button type="button" class="drawer-close" data-drawer-action="close" aria-label="' +
          text("common.close") +
          '"><span aria-hidden="true">✕</span></button></div>' +
          '<div class="drawer-tabs" role="tablist" aria-label="' +
          text("borrower.drawer.eyebrow") +
          '">' +
          DRAWER_TABS.map(function (tab) {
            var selected = viewState.drawerTab === tab;
            return (
              '<button type="button" role="tab" id="drawer-tab-' +
              escapeHtml(tab) +
              '" aria-selected="' +
              (selected ? "true" : "false") +
              '" aria-controls="drawer-panel" data-drawer-tab="' +
              escapeHtml(tab) +
              '" tabindex="' +
              (selected ? "0" : "-1") +
              '">' +
              text("borrower.drawer.tab-" + tab) +
              "</button>"
            );
          }).join("") +
          "</div>" +
          '<div class="drawer-panel" id="drawer-panel" role="tabpanel" tabindex="0" aria-labelledby="drawer-tab-' +
          escapeHtml(viewState.drawerTab) +
          '">' +
          renderDrawerPanel(viewState, documentId, record, checks, banner) +
          "</div></section>"
        );
      }

      /**
       * A facsimile of page 1: letterhead, title, the fields as the document
       * prints them, and ruled lines standing in for the body nobody needs to
       * read. The row that is wrong is ringed and carries a glyph as well as the
       * colour, because colour alone is not a status (§9).
       */
      function renderScanPage(documentId, record) {
        var rows = scanRowsFor(documentId);
        if (!rows) return "";
        var verdict = record ? record.verdict : "not-uploaded";
        var override = scanOverrideFor(documentId, verdict);
        var base = "borrower.scan." + documentId + ".";

        return (
          '<figure class="scan">' +
          '<div class="scan-page">' +
          '<div class="scan-org">' +
          text(base + "org") +
          "</div>" +
          '<div class="scan-title">' +
          text(base + "title") +
          "</div>" +
          rows
            .map(function (field) {
              var flagged = Boolean(override && override.field === field);
              var suffix = flagged && override.valueSuffix ? override.valueSuffix : "";
              return (
                '<div class="scan-row' +
                (flagged ? " mismatch" : "") +
                '">' +
                '<span class="scan-key">' +
                text(base + "row-" + field) +
                "</span>" +
                '<span class="scan-value">' +
                text(base + "value-" + field + suffix) +
                "</span>" +
                (flagged
                  ? '<span class="scan-mark" aria-hidden="true">' + CHECK_GLYPHS.mismatch + "</span>"
                  : "") +
                "</div>"
              );
            })
            .join("") +
          '<div class="scan-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>' +
          '<figcaption class="scan-stamp">' +
          text("borrower.drawer.scan-stamp") +
          "</figcaption>" +
          "</div></figure>"
        );
      }

      /**
       * The conversation this document actually carries — `record.messages`,
       * the same list the lender's desk reads and replies to, not the WhatsApp
       * thread on the documents page. A message sent here is filed against
       * this document specifically, which is what lets a reply from the desk
       * land back on the one document it was about.
       */
      function renderDrawerAssistant(documentId, record) {
        var messages = record.messages || [];
        return (
          '<p class="panel-lead">' + text("borrower.drawer.assistant-lead") + "</p>" +
          '<div class="drawer-thread">' +
          (messages.length
            ? messages.map(renderBubble).join("")
            : '<p class="panel-lead">' + text("borrower.drawer.assistant-empty") + "</p>") +
          "</div>" +
          '<form class="composer drawer-composer" id="drawer-composer" data-document-id="' +
          escapeHtml(documentId) +
          '">' +
          '<label class="sr-only" for="drawer-composer-input">' +
          text("borrower.drawer.assistant-placeholder") +
          "</label>" +
          '<input type="text" id="drawer-composer-input" name="message" autocomplete="off" placeholder="' +
          text("borrower.drawer.assistant-placeholder") +
          '">' +
          '<button type="submit" id="drawer-composer-send">' +
          icon("send", { fill: true }) +
          '<span class="sr-only">' +
          text("borrower.chat.send") +
          "</span></button></form>"
        );
      }

      function renderDrawerPanel(viewState, documentId, record, checks, banner) {
        if (viewState.drawerTab === "assistant") {
          return renderDrawerAssistant(documentId, record);
        }
        if (viewState.drawerTab === "document") {
          return (
            renderScanPage(documentId, record) +
            '<dl class="field-grid">' +
            detailRow("borrower.sim.field-name", record.currentFilename) +
            detailRow("borrower.drawer.tab-document", t("doc." + documentId + ".purpose")) +
            "</dl>"
          );
        }

        if (viewState.drawerTab === "history") {
          if (!record.history.length) {
            return '<p class="panel-lead">' + text("borrower.drawer.no-history") + "</p>";
          }
          return record.history
            .map(function (entry) {
              return (
                '<div class="history-row"><span>' +
                escapeHtml(entry.filename || record.currentFilename) +
                '</span><span class="verdict-badge" data-verdict="' +
                escapeHtml(entry.verdict) +
                '">' +
                text("verdict." + entry.verdict) +
                "</span></div>"
              );
            })
            .join("");
        }

        var registration =
          documentId === "title-certificate"
            ? '<p class="registration">' + text("lender.documents.folio") + "</p>"
            : "";

        return (
          '<div class="review-banner" data-tone="' +
          escapeHtml(banner.tone) +
          '"><h3>' +
          text(banner.key + ".title", banner.params) +
          "</h3><p>" +
          text(banner.key + ".body", banner.params) +
          "</p></div>" +
          /* The page first, then what we made of it — she should see the
             document before she reads the verdict on it. */
          renderScanPage(documentId, record) +
          registration +
          renderReviewChecks(checks)
        );
      }

      function renderReviewChecks(checks) {
        return (
          '<ul class="review-checks">' +
          checks
            .map(function (item) {
              var comparison =
                item.stated === null && item.found === null
                  ? ""
                  : '<div class="comparison"><p><span>' +
                    text("borrower.drawer.stated") +
                    "</span><strong>" +
                    escapeHtml(item.stated) +
                    "</strong></p><p><span>" +
                    text("borrower.drawer.found") +
                    "</span><strong>" +
                    escapeHtml(item.found) +
                    "</strong></p></div>";
              return (
                '<li data-check-status="' +
                escapeHtml(item.status) +
                '"><div><strong>' +
                text(item.labelKey) +
                '</strong><span class="check-tag"><span aria-hidden="true">' +
                CHECK_GLYPHS[item.status] +
                "</span> " +
                text("borrower.tag." + item.status) +
                "</span></div>" +
                comparison +
                "</li>"
              );
            })
            .join("") +
          "</ul>"
        );
      }

      /* One phase, one page. The three used to stack in a single column, which
         put the WhatsApp thread — the point of the page — below the fold for the
         whole of the documents phase, and made the rail look decorative because
         clicking it changed nothing you could see. Exactly one panel is visible
         now, as in the Spanish original. */
      function phasePanel(viewState, phase, contents) {
        return (
          '<div class="phase-panel" data-phase="' +
          escapeHtml(phase) +
          '"' +
          (viewState.phase === phase ? "" : " hidden") +
          ">" +
          contents +
          "</div>"
        );
      }

      /* A loan officer call, scheduled with a click rather than a real
         calendar integration: three preset slots and a confirmation once one
         is picked. */
      function renderIntroCall(viewState) {
        var slot = viewState.introCallSlot;
        return (
          '<section class="panel-card" data-panel="intro-call" aria-labelledby="intro-call-title">' +
          '<span class="eyebrow">' +
          text("borrower.phase.intro-call") +
          "</span>" +
          '<h2 id="intro-call-title">' +
          text("borrower.intro-call.title") +
          "</h2>" +
          '<p class="panel-lead">' +
          text("borrower.intro-call.subtitle") +
          "</p>" +
          '<div class="tiles" role="group" aria-label="' +
          text("borrower.intro-call.title") +
          '">' +
          INTRO_CALL_SLOTS.map(function (option) {
            return (
              '<button type="button" class="tile' +
              (slot === option ? " on" : "") +
              '" data-intro-call-slot="' +
              escapeHtml(option) +
              '" aria-pressed="' +
              (slot === option ? "true" : "false") +
              '">' +
              text("borrower.intro-call.slot-" + option) +
              "</button>"
            );
          }).join("") +
          "</div>" +
          (slot
            ? '<p class="footnote address-verified">' +
              text("borrower.intro-call.confirmed", { slot: t("borrower.intro-call.slot-" + slot) }) +
              "</p>"
            : "") +
          '<div class="sim-actions">' +
          '<button type="button" class="cta" data-phase="documents"' +
          (slot ? "" : " disabled") +
          ">" +
          text("borrower.intro-call.continue") +
          "</button>" +
          "</div></section>"
        );
      }

      function renderPage(viewState) {
        return (
          renderTopbar(viewState) +
          renderPhaseRail(viewState) +
          '<main class="portal-main" id="borrower-main">' +
          phasePanel(viewState, "simulate", renderSimulator(viewState)) +
          phasePanel(viewState, "pre-approval", renderPreApproval(viewState)) +
          phasePanel(viewState, "intro-call", renderIntroCall(viewState)) +
          phasePanel(
            viewState,
            "documents",
            '<div class="documents-layout">' +
              renderThread(viewState) +
              renderChecklist(viewState) +
              "</div>"
          ) +
          "</main>" +
          renderDrawer(viewState)
        );
      }

      /* ============================================================ the keyboard */

      /* The same contract as the lender's drawer (§9), stated separately because
         the two surfaces share no script: Tab wraps inside the dialog, Escape
         closes it, and the arrows walk the tab strip. */
      var DRAWER_FOCUSABLE =
        'button:not([disabled]):not([tabindex="-1"]),a[href]:not([tabindex="-1"]),' +
        'input:not([disabled]):not([tabindex="-1"]),select:not([disabled]):not([tabindex="-1"]),' +
        'textarea:not([disabled]):not([tabindex="-1"]),[tabindex]:not([tabindex="-1"])';

      /* Tab and Shift+Tab wrap inside the dialog, and focus that has escaped it is
         pulled back in. The active element is an argument rather than a global, so
         the trap is testable without a browser. Returns true when it moved focus. */
      function trapFocus(event, container, activeElement) {
        if (!event || event.key !== "Tab" || !container) return false;
        var controls = [].slice.call(container.querySelectorAll(DRAWER_FOCUSABLE)).filter(
          function (control) {
            return !control.hidden;
          }
        );
        if (!controls.length) return false;
        var first = controls[0];
        var last = controls[controls.length - 1];
        var outside = controls.indexOf(activeElement) === -1;
        var target = null;
        if (event.shiftKey && (activeElement === first || outside)) target = last;
        else if (!event.shiftKey && (activeElement === last || outside)) target = first;
        if (!target) return false;
        event.preventDefault();
        target.focus();
        return true;
      }

      var TAB_KEYS = ["ArrowLeft", "ArrowRight", "Home", "End"];

      /* Escape closes; Tab is trapped; the arrows, Home and End move between the
         drawer's tabs when the key came from one (§9). The context is injected. */
      function handleDrawerKeydown(event, drawerContext) {
        var ctx = drawerContext || {};
        if (!ctx.isOpen || !ctx.container) return;
        if (event.key === "Escape") {
          event.preventDefault();
          if (typeof ctx.close === "function") ctx.close();
          return;
        }
        if (trapFocus(event, ctx.container, ctx.activeElement)) return;
        var current = event.target && event.target.closest ? event.target.closest('[role="tab"]') : null;
        if (!current || TAB_KEYS.indexOf(event.key) === -1) return;
        event.preventDefault();
        var tabs = [].slice.call(ctx.container.querySelectorAll('[role="tab"]'));
        var index = tabs.indexOf(current);
        var next =
          event.key === "Home"
            ? 0
            : event.key === "End"
              ? tabs.length - 1
              : event.key === "ArrowRight"
                ? (index + 1) % tabs.length
                : (index - 1 + tabs.length) % tabs.length;
        if (tabs[next]) tabs[next].click();
      }

      /* ================================================================= init */

      var loadedView = loadView(caseStorage());
      var view = loadedView.view;
      /* Restored alongside the view it was saved with, so a page that is
         genuinely resuming does not re-absorb a reply already folded into
         that view (§ her place on the page). A fresh page starts this at its
         own defaults, which is what `bridgeClear` below then confirms. */
      applyBridgeMemory(loadedView);
      var restoreFocusTo = null;

      function announce(key, params) {
        var region = document.getElementById("borrower-status");
        if (region) region.textContent = t(key, params);
      }

      /* Storage refused: keep working in memory and say so once, into the same
         role="status" region every other change is announced into (§7). */
      function announceViewOnly() {
        var notice = viewOnlyAnnouncement();
        if (notice) announce(notice.key, notice.params);
      }

      /* The case is seeded on load and re-seeded after every change, so switching
         to the lender view in this tab hands over the story as it stands. Her
         own place in the page — which phase, whether the narrative has
         finished, what she has read — is saved the same way, so reopening
         this tab, or switching views and back, resumes exactly here rather
         than dropping her on the simulator (§7). Only `restart` empties it. */
      function persist() {
        var caseOk = saveCase(caseStorage(), view.state);
        var viewOk = saveView(caseStorage(), view);
        if (!caseOk || !viewOk) announceViewOnly();
      }

      function statusAnnouncementKey() {
        if (view.finished) return "borrower.control.finished";
        if (!view.started) return "borrower.control.idle";
        return view.paused ? "borrower.control.paused" : "borrower.control.playing";
      }

      /* ------------------------------------------------------- what moved
       *
       * The page repaints itself whole on every beat, which is what keeps the
       * render functions pure — but an animation declared in CSS would then
       * replay on every bubble at every beat, and the thread would flicker
       * rather than flow. So the paint remembers what it drew last time and
       * animates only the difference: the messages that are new, the verdicts
       * that just changed, the phase that just opened. Everything else is
       * painted already in its resting state.
       */
      var painted = { bubbles: 0, phase: null, verdicts: {}, progress: null };

      function markFreshBubbles() {
        var bubbles = [].slice.call(document.querySelectorAll(".thread-body .bubble"));
        for (var index = painted.bubbles; index < bubbles.length; index += 1) {
          bubbles[index].classList.add("enter");
        }
        painted.bubbles = bubbles.length;
      }

      function markChangedVerdicts() {
        var next = {};
        var moved = null;
        [].slice.call(document.querySelectorAll(".doc-row")).forEach(function (row) {
          var id = row.dataset.documentId;
          var verdict = row.dataset.verdict + "/" + row.dataset.analysing;
          next[id] = verdict;
          var before = painted.verdicts[id];
          if (before !== undefined && before !== verdict) {
            moved = row;
            row.classList.add("flash");
            later(1100, function () {
              if (row.isConnected) row.classList.remove("flash");
            });
          }
        });
        painted.verdicts = next;
        if (moved) revealRow(moved);
      }

      /* Scroll the list, never the page: the row being talked about is brought
         into its own frame, and only when it is not already there. */
      function revealRow(row) {
        var list = row.closest ? row.closest(".checklist-scroll") : null;
        if (!list) return;
        var top = row.offsetTop;
        var bottom = top + row.offsetHeight;
        if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) {
          list.scrollTop = Math.max(0, top - (list.clientHeight - row.offsetHeight) / 2);
        }
      }

      /* The bar is drawn where it was and then moved, so its width transitions
         instead of appearing already full on a brand new element. */
      function easeProgress() {
        var fill = document.querySelector(".progress-fill");
        if (!fill) {
          painted.progress = null;
          return;
        }
        var target = fill.dataset.progress;
        if (painted.progress !== null && painted.progress !== target) {
          fill.style.width = painted.progress + "%";
          /* Two frames: one to accept the old width, one to animate off it. */
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              if (fill.isConnected) fill.style.width = target + "%";
            });
          });
        }
        painted.progress = target;
      }

      function markPhaseChange() {
