<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BancoWeston</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    /* The same design system as lender.html — identical tokens, type scale,
       radii and shadows — spent differently. The lender page is dense because
       twelve loans are being compared side by side; this page is airy because
       Javiera is told one thing at a time. Local font fallbacks are mandatory: the
       demo must survive being opened with no network. */
    :root{
      /* BancoWeston brand tokens */
      --brand:#007a33;--brand-lime:#c3d600;--brand-deep:#154734;--brand-wash:#eff8f2;--brand-rule:#bfe0cc;
      /* Silver Hill structural neutrals — verbatim */
      --ink:#18212b;--slate:#52606d;--muted:#7b8794;--paper:#fff;--shell:#f3f5f7;--rule:#dbe1e7;--ok:#137a4a;--danger:#b42318;--warn:#8a5a00;
      --display:Archivo,"Segoe UI",Arial,sans-serif;--body:"Public Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
      /* Shape, borrowed from the Spanish demo so the two read as one product:
         a soft 14px radius and a shadow with a green cast rather than a grey one. */
      --radius:14px;--shadow:0 1px 2px rgba(21,71,52,.06),0 8px 24px rgba(21,71,52,.07)
    }
    *{box-sizing:border-box}body{margin:0;background:var(--shell);color:var(--ink);font:14px/1.5 var(--body)}button,input,select,textarea{font:inherit}button{cursor:pointer}[inert]{pointer-events:none;user-select:none}
    .skip-link{position:absolute;left:-999px}.skip-link:focus{left:12px;top:12px;z-index:100;background:#fff;padding:8px}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
    button:disabled{cursor:not-allowed;opacity:.52}
    #borrower-status{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

    /* ---- chrome ----
       A dark green bar with pill controls, as in the Spanish demo: the chrome is
       the bank's, the paper below it is the applicant's. */
    .topbar{position:sticky;top:0;z-index:12;min-height:56px;display:flex;align-items:center;gap:15px;padding:9px 20px;background:var(--brand-deep);color:#fff}
    .topbar-logo{width:138px;height:auto;display:block}
    .topbar-wordmark{width:auto;font:700 20px var(--display);color:#fff;letter-spacing:-.02em;white-space:nowrap}
    .portal-label{padding-left:16px;border-left:1px solid rgba(255,255,255,.22);color:#cfe0d7;font-family:var(--display);font-size:12.5px;font-weight:600}
    .demo-role-switch{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 13px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;text-decoration:none;transition:background .16s,border-color .16s,color .16s}
    .demo-controls button{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:6px 13px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;transition:background .16s,border-color .16s,color .16s}
    .demo-role-switch:hover,.demo-controls button:hover{background:rgba(255,255,255,.2)}
    .demo-controls{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
    .control-group{display:flex;align-items:center;gap:6px}
    /* ---- language and unit, one cluster ----
       The other portal's bar carries the same two switches in the same frame;
       this is that control, translated onto the dark bar. One border round both
       and a hairline between them says "two settings", where two legended groups
       of full-width word buttons said "four more demo controls" and wrapped the
       bar onto a second row. The buttons inside drop the pill styling of the
       transport controls — square-ish, tighter, mono — so the cluster reads as a
       setting rather than as something that drives the timeline. */
    .control-cluster{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;padding:3px;border:1px solid rgba(255,255,255,.24);border-radius:9px;background:rgba(255,255,255,.07)}
    .switch-pair{display:inline-flex;align-items:center;gap:2px}
    .control-divider{flex:0 0 auto;width:1px;height:18px;margin:0 3px;background:rgba(255,255,255,.34)}
    .demo-controls .control-cluster button{min-width:34px;min-height:26px;padding:4px 9px;justify-content:center;border:0;border-radius:6px;background:transparent;color:rgba(255,255,255,.72);font:600 11px var(--mono);letter-spacing:.04em}
    .demo-controls .control-cluster button:hover{background:rgba(255,255,255,.16);color:#fff}
    .demo-controls .control-cluster button[aria-pressed="true"]{background:#fff;color:var(--brand-deep)}
    .control-group>.control-legend{color:rgba(255,255,255,.6);font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
    /* The speed select, dressed as one of the pills beside it. The arrow is drawn
       in the background rather than left to the platform, which paints a light
       one that vanishes on this bar. */
    .demo-controls select{
      min-height:32px;padding:6px 30px 6px 13px;border:1px solid rgba(255,255,255,.22);border-radius:999px;
      background-color:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;
      background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);
      background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;
      appearance:none;-webkit-appearance:none;transition:background-color .16s,border-color .16s
    }
    .demo-controls select:hover{background-color:rgba(255,255,255,.2)}
    /* The list itself is drawn by the platform, which does not inherit the bar. */
    .demo-controls select option{background:#fff;color:var(--ink)}
    .demo-controls button[aria-pressed="true"]{border-color:#fff;background:#fff;color:var(--brand-deep)}
    .demo-controls button.primary{border-color:var(--brand-lime);background:var(--brand-lime);color:#1c2a10}
    .demo-controls button.primary:hover{background:#d3e620}
    /* ---- the bell, and the tray it opens ---- */
    .notification-bell{position:relative;display:flex}
    .bell-button{position:relative;display:grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(255,255,255,.1);color:#fff;transition:background .16s}
    .bell-button:hover{background:rgba(255,255,255,.2)}
    .bell-button[aria-expanded="true"]{background:#fff;color:var(--brand-deep);border-color:#fff}
    .bell-button svg{width:17px;height:17px}
    /* The count sits on the bell rather than beside it, and it is a number, not a
       colour: the panel behind it says the same thing in words. */
    .bell-count{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font:700 10px var(--mono);line-height:17px;text-align:center}
    .notification-panel{
      position:absolute;top:calc(100% + 10px);right:0;z-index:20;width:min(340px,calc(100vw - 32px));
      max-height:min(420px,70vh);overflow-y:auto;padding:6px;border:1px solid var(--rule);border-radius:12px;
      background:var(--paper);color:var(--ink);box-shadow:0 18px 44px rgba(16,20,24,.22);animation:tray-in .18s ease
    }
    @keyframes tray-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
    .notification-head{padding:10px 12px 8px}
    .notification-head h2{margin:0;font:600 13px var(--display)}
    .notification-list{list-style:none;margin:0;padding:0}
    .notification-list>li{padding:11px 12px;border-top:1px solid #eef1f3}
    .notification-list>li[data-tone="attention"]{border-left:3px solid var(--brand-lime);border-radius:0 8px 8px 0;background:var(--brand-wash)}
    .notification-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .notification-row strong{font:600 13px var(--display);color:var(--brand-deep)}
    .notification-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .notification-time{color:var(--muted);font:500 11px var(--mono);white-space:nowrap}
    /* The symbol that takes a notification to the page it is about, styled
       after the drawer's own close button so the two read as one family. */
    .notification-preview{display:grid;place-items:center;min-width:26px;height:26px;padding:0;border:1px solid var(--rule);border-radius:50%;background:#fff;color:var(--muted);transition:border-color .16s,color .16s}
    .notification-preview:hover{border-color:var(--brand);color:var(--brand)}
    .notification-preview svg{width:14px;height:14px}
    .notification-doc{display:block;margin-top:3px;color:var(--brand);font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.05em;overflow-wrap:anywhere}
    .notification-list p{margin:5px 0 0;color:var(--slate);font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}
    .notification-empty{margin:0;padding:4px 12px 14px;color:var(--muted);font-size:12.5px}

    /* Brand green would sit on brand green up here; lime carries the ring instead,
       as a stroke and never as text. */
    .topbar button:focus-visible,.topbar a:focus-visible{outline:3px solid var(--brand-lime);outline-offset:3px}

    /* ---- the phase rail ---- */
    .phase-rail{position:sticky;top:56px;z-index:11;display:flex;align-items:center;gap:7px;padding:9px 20px;background:var(--paper);border-bottom:1px solid var(--rule);overflow-x:auto}
    .phase-step{display:flex;align-items:center;gap:9px;min-width:max-content;padding:7px 14px;border:1px solid var(--rule);border-radius:999px;background:#fff;color:var(--slate);font-size:12.5px;font-weight:600;transition:border-color .18s,background .18s,color .18s}
    .phase-step:hover{border-color:var(--brand);color:var(--brand-deep)}
    .phase-step .phase-index{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--shell);color:var(--slate);font:600 10px var(--mono);transition:background .18s,color .18s}
    .phase-step[data-state="done"]{border-color:var(--brand-rule);background:var(--brand-wash);color:var(--brand-deep)}
    .phase-step[data-state="done"] .phase-index{background:var(--brand-lime);color:#2c3a12}
    .phase-step[aria-current="step"]{border-color:var(--brand);background:var(--brand-wash);color:var(--brand-deep)}
    .phase-step[aria-current="step"] .phase-index{background:var(--brand);color:#fff}
    /* The right-hand end of the rail: which case, where it stands, and whether
       the demo is running. The property line is the first thing to go when the
       rail runs out of room — it is the least load-bearing of the three. */
    .rail-meta{display:flex;align-items:center;gap:12px;margin-left:auto;padding-left:16px;min-width:max-content}
    .rail-case{display:flex;align-items:baseline;gap:9px;color:var(--slate);font-size:12px;overflow-wrap:anywhere}
    .rail-case b{color:var(--ink);font:600 11px var(--mono);letter-spacing:.02em;white-space:nowrap}
    .rail-property{color:var(--muted)}
    .rail-live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;white-space:nowrap}
    .rail-live .live-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.4s infinite}
    .rail-live[data-state="paused"] .live-dot,.rail-live[data-state="finished"] .live-dot,.rail-live[data-state="idle"] .live-dot{background:var(--muted);animation:none}
    .rail-live[data-state="idle"] .live-dot{border:1px solid var(--rule);background:#fff}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

    /* ---- the airy main column ---- */
    .portal-main{max-width:1360px;margin:0 auto;padding:30px 22px 64px}
    /* The simulator is a form and a summary; it reads better narrower than the
       three-column documents desk it shares a main with. */
    .phase-panel[data-phase="simulate"] .sim-layout,
    .phase-panel[data-phase="pre-approval"] .panel-card{max-width:1120px;margin-inline:auto}
    .phase-panel{margin-bottom:34px}
    .phase-panel[hidden]{display:none}
    /* Only a phase change animates — the class is put on by the paint, so the
       narrative's many small re-renders never re-run it. */
    .phase-panel.enter{animation:panel-in .32s ease both}
    @keyframes panel-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .panel-card{padding:26px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow)}
    .eyebrow{display:block;color:var(--muted);font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}

    /* ---- the simulator: the form she filled, beside what the bank made of it ---- */
    .sim-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.85fr);gap:16px;align-items:start}
    .sect-title{display:flex;align-items:center;gap:9px;margin:26px 0 12px;color:var(--brand-deep);font:700 12px var(--display);text-transform:uppercase;letter-spacing:.1em}
    .sect-bar{width:20px;height:2px;border-radius:2px;background:var(--brand-lime)}
    .sim-field{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid #f0f4f2}
    .sim-label{color:var(--slate);font-size:13px}
    /* A filled field, not an empty one: the underline is the settled colour the
       Spanish demo lands on once a value has been typed and accepted. */
    /* An empty field is a line waiting to be written on; a filled one settles to
       the green rule the Spanish demo uses once a value has been accepted. */
    .sim-value{display:flex;align-items:center;gap:8px;min-height:34px;padding:2px 2px 3px;border-bottom:1.5px solid var(--rule);font-size:15.5px;overflow-wrap:anywhere;transition:border-color .2s}
    .sim-value.filled{border-bottom-color:#cfe0d5}
    .sim-value:focus-within{border-bottom-color:var(--brand)}
    .sim-value input{flex:1;min-width:0;padding:4px 2px;border:0;border-radius:4px;background:transparent;color:var(--ink);font-size:15.5px;font-weight:600}
    /* The province select sits in the same underlined row as every typed
       field, so it is stripped of its platform chrome and given the same
       custom arrow the demo-controls bar draws for its own select — a
       native dropdown here would be the one control on the page still
       wearing the browser's default skin. */
    .sim-value select{
      flex:1;min-width:0;padding:4px 26px 4px 2px;border:0;border-radius:4px;background-color:transparent;
      color:var(--ink);font:600 15.5px inherit;appearance:none;-webkit-appearance:none;cursor:pointer;
      background-image:linear-gradient(45deg,transparent 50%,var(--brand) 50%),linear-gradient(135deg,var(--brand) 50%,transparent 50%);
      background-position:calc(100% - 11px) 10px,calc(100% - 6px) 10px;background-size:5px 5px;background-repeat:no-repeat
    }
    .sim-value select:hover{color:var(--brand-deep)}
    .sim-value select option[value=""]{color:var(--muted);font-weight:500}
    .sim-prefix{color:var(--muted);font-size:14px}
    .sim-note{margin-left:auto;padding:3px 9px;border-radius:7px;background:var(--brand-wash);color:var(--brand-deep);font-size:12px;white-space:nowrap}
    .tiles{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:0;padding:0}
    .tile{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:112px;padding:12px 16px;border:1.5px solid var(--rule);border-radius:12px;background:#fff;color:var(--muted);font-size:13.5px;text-align:center;transition:border-color .2s,background .2s,color .2s}
    .tile.small{min-width:74px;padding:9px 14px;font-size:13px}
    .tile:hover{border-color:#aebac4;color:var(--ink)}
    .tile.on{border-color:var(--brand);background:var(--brand-wash);color:var(--brand-deep);font-weight:600}
    .tile.on:hover{border-color:var(--brand)}
    .tile svg{width:26px;height:26px}
    /* The press the demo performs on your behalf: the same feedback a real one
       would give, so the sequence reads as someone using the page. */
    .tile.pressing{animation:press .32s ease}
    .cta.pressing{animation:press .32s ease}
    @keyframes press{40%{transform:scale(.95)}100%{transform:none}}
    .cta:disabled{background:#c6d3cd;box-shadow:none}
    .cta:disabled:hover{background:#c6d3cd;transform:none}
    .demo-controls button.primary svg{width:14px;height:14px}
    .sim-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
    .cta{padding:12px 28px;border:0;border-radius:999px;background:var(--brand);color:#fff;font-size:14.5px;font-weight:600;box-shadow:0 3px 10px rgba(0,122,51,.24);transition:background .16s,transform .16s}
    .cta:hover{background:#00692c;transform:translateY(-1px)}
    /* A lighter action beside the CTA — "Verify address" asks the page to do
       something, but it is not the thing the page is for, so it is outlined
       rather than filled. */
    button.secondary{padding:11px 20px;border:1.5px solid var(--brand-rule);border-radius:999px;background:#fff;color:var(--brand-deep);font-size:13.5px;font-weight:600;transition:border-color .16s,background .16s}
    button.secondary:hover{border-color:var(--brand);background:var(--brand-wash)}
    button.secondary:disabled{border-color:var(--rule);color:var(--muted);cursor:default}
    .sim-actions .footnote{margin:0}
    /* A confirmation, not a disclaimer: reused for both "address verified" and
       the intro-call slot confirmation, so it takes the same green pill the
       rest of the page uses for a settled state rather than the plain grey
       .footnote it was borrowing. */
    .footnote.address-verified{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--brand-wash);color:var(--brand-deep);font-size:12.5px;font-weight:600}
    .footnote.address-verified::before{content:"✓";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--brand);color:#fff;font-size:9px;font-weight:900}

    .summary-rail{position:sticky;top:120px;padding:20px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow)}
    .summary-rail h2{margin:0;font:600 17px var(--display);color:var(--brand-deep)}
    .summary-rail .footnote{margin:4px 0 0;font-size:11.5px}
    .summary-group{margin-top:15px}
    .summary-group-title{display:block;margin-bottom:4px;color:var(--brand);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.09em}
    .summary-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f2f6f4;font-size:13px}
    .summary-row:last-child{border-bottom:0}
    .summary-row span{color:var(--slate)}
    .summary-row strong{text-align:right;overflow-wrap:anywhere}
    .cap-panel{margin-top:16px;border:1.5px solid var(--brand-lime);border-radius:12px;background:#fdfee9;overflow:hidden}
    .cap-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 13px;background:#f7fbd8;color:#4d5a10;font:700 12px var(--display);text-transform:uppercase;letter-spacing:.05em}
    .cap-state{flex:0 0 auto;color:#5c6b0d;font:700 13px var(--display);letter-spacing:0;white-space:nowrap}
    .cap-body{padding:4px 13px 11px}
    .cap-body .summary-row{border-bottom-color:#eef3d2}
    .cap-body .summary-row span{color:#6c7743}
    .cap-body .summary-row strong{color:#3f4a12}
    .panel-card h1{margin:6px 0 0;font:600 34px/1.05 var(--display);letter-spacing:-.05em}
    .panel-card h2{margin:6px 0 0;font:600 27px/1.1 var(--display);letter-spacing:-.04em}
    .panel-lead{max-width:62ch;margin:12px 0 0;color:var(--slate)}
    .panel-card h3{margin:26px 0 10px;font:600 15px var(--display)}
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
    .field-grid>div{padding:13px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
    dt{color:var(--muted);font:500 10px var(--mono);text-transform:uppercase}
    dd{margin:5px 0 0;font-weight:600;overflow-wrap:anywhere}
    .figure-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #edf0f2}
    .figure-row span{color:var(--slate)}
    .figure-row strong{overflow-wrap:anywhere}
    .figure-row.emphasis strong{font:600 24px var(--display)}
    .load-bar{height:10px;margin:9px 0 5px;border-radius:6px;background:#e6ebee;overflow:hidden}
    .load-bar-fill{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--brand-lime));transition:width .6s ease}
    .load-bar-fill.over-cap{background:var(--danger)}
    .footnote{margin:16px 0 0;color:var(--muted);font-size:12px}
    /* The nine source checks tick over one at a time while the story plays, so
       each row carries a mark in one of three states: an open grey ring for a
       source nobody has asked yet, a spinner on the one question that is out
       right now, a filled green disc once it answers. Only one row is ever
       spinning — nine spinners at once read as a page still loading. */
    .source-checks{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:11px;overflow:hidden}
    .source-checks>li{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid #edf0f2;transition:background .35s}
    .source-checks>li:last-child{border-bottom:0}
    .source-checks>li[data-state="waiting"]{background:#fbfde8}
    .check-mark{flex:0 0 18px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#dde5e1;color:#fff;font-size:10px;font-weight:800;transition:background .25s,border-color .25s}
    .source-checks>li[data-state="done"] .check-mark{background:var(--brand)}
    .source-checks>li[data-state="idle"] .check-mark{background:transparent;border:2px solid #dde5e1}
    .source-checks>li[data-state="waiting"] .check-mark{background:transparent;border:2px solid #cfd9d4;border-top-color:var(--brand);animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .source-checks .check-label{display:grid;gap:3px;min-width:0;flex:1}
    .source-checks .check-source{color:var(--slate);font:400 11px var(--mono);overflow-wrap:anywhere}
    .source-checks .check-result{color:var(--brand-deep);font-size:12px;font-weight:600;text-align:right;white-space:nowrap;transition:color .25s}
    .source-checks>li[data-state="waiting"] .check-result,.source-checks>li[data-state="idle"] .check-result{color:var(--muted);font-weight:400}
    .verdict-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:10px;background:#edf1f4;font-size:11px;font-weight:600;white-space:nowrap}
    .verdict-badge[data-verdict="accepted"],.verdict-badge[data-verdict="accepted-with-condition"]{background:var(--brand-wash);color:var(--ok)}
    .verdict-badge[data-verdict="rejected"]{background:#fdf0ef;color:var(--danger)}
    .verdict-badge[data-verdict="under-review"]{background:#fdf6e8;color:var(--warn)}
    .result-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
    .result-column{padding:18px;border:1px solid var(--rule);border-radius:10px}
    .result-column.chosen{border-color:var(--brand-rule);background:var(--brand-wash)}
    .result-column .result-amount{display:block;margin:8px 0 2px;font:600 27px var(--display);letter-spacing:-.03em}
    .badge-approved{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 11px;border-radius:999px;background:var(--brand);color:#fff;font-size:12px;font-weight:600}
    /* ---- the trade, tabulated ----
       Two offers, two rows, one difference column. The bars this replaced spent
       six stacked lines per row saying what four cells say once, and the eye had
       to travel down a paragraph to compare two figures that belong side by
       side. Columns put the same figure in the same place on every row.

       Figures are mono and tabular so the digits line up down a column — pesos
       run to nine characters and a proportional face makes two similar amounts
       look different lengths. The difference column carries the verdict and its
       colour: green when the programme wins, amber when it costs. Colour is
       never the only carrier — the words say "less" and "more" (§9). */
    .trade{margin-top:22px;padding:20px;border:1px solid var(--rule);border-radius:12px;background:var(--shell)}
    .trade-table-wrap{margin-top:15px;overflow-x:auto}
    .trade-table{width:100%;max-width:760px;border-collapse:collapse;font-size:13px}
    .trade-table th,.trade-table td{padding:11px 14px;text-align:left;vertical-align:baseline}
    .trade-table thead th{padding-bottom:8px;border-bottom:1px solid var(--rule);color:var(--slate);font:600 11px var(--mono);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
    .trade-table thead th:first-child{padding-left:0}
    /* The row heading is the one cell allowed to wrap: "Que reunir el día de la
       compra" is 30 characters and holding it on one line would push the four
       figure columns off the card. The figure columns hug their content
       (`width:1%` on a collapsed table means "as narrow as the content lets
       you"), so the heading column takes whatever slack is left. */
    .trade-table tbody th{min-width:128px;padding-left:0;color:var(--ink);font:600 13px/1.35 var(--display)}
    .trade-table tbody tr+tr th,.trade-table tbody tr+tr td{border-top:1px solid #e3e8ec}
    .trade-table .trade-num{width:1%;text-align:right;font:600 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
    /* The chosen offer, tinted down its whole column so it reads as the same
       card as the green one above rather than as one highlighted cell. */
    .trade-table .ours{background:var(--brand-wash)}
    .trade-table thead th.ours{color:var(--brand-deep)}
    .trade-table tbody td.ours{color:var(--brand-deep)}
    .trade-delta{font-weight:700}
    .trade-delta.win{color:var(--brand-deep)}
    .trade-delta.cost{color:var(--warn)}
    .trade-note{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule);color:var(--slate);font-size:12.5px}
    /* the one figure that really is a saving, said loudly and on its own */
    .rate-callout{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:16px;padding:15px 18px;border:1px solid var(--brand-rule);border-radius:11px;background:var(--brand-wash)}
    .rate-callout b{font:600 26px var(--display);letter-spacing:-.02em;color:var(--brand-deep)}
    .rate-callout span{flex:1;min-width:210px;font-size:13px}
    .rate-callout small{display:block;margin-top:3px;color:var(--slate);font-size:11.5px}
    /* Four columns of figures do not fit a phone. Rather than stack them back
       into the paragraph this replaced, the table scrolls sideways inside its
       own wrapper and the row heading stays pinned, so the reader never loses
       which row they are reading. */
    @media(max-width:560px){.trade-table{font-size:12.5px}.trade-table th,.trade-table td{padding:9px 10px}.trade-table tbody th{position:sticky;left:0;background:var(--shell)}.trade-table thead th:first-child{position:sticky;left:0;background:var(--shell)}}

    /* ---- the case, and the specialist notice ---- */
    .status-pill{padding:5px 12px;border:1px solid var(--brand-rule);border-radius:999px;background:var(--brand-wash);color:var(--brand-deep);font-size:12px;font-weight:600;white-space:nowrap}
    .status-pill:hover{background:#dff0e6}.status-pill:focus-visible{outline:2px solid var(--brand-deep);outline-offset:2px}

    /* ---- thread beside a side rail of cards ---- */
    .documents-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:16px;align-items:start}
    .thread-card{display:flex;flex-direction:column;min-height:520px;max-height:78vh;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
    .thread-head{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--brand-deep);color:#fff}
    .thread-avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--brand)}
    .thread-avatar svg{width:23px;height:23px}
    .thread-head strong{display:flex;align-items:center;gap:6px;font:600 14px var(--display)}
    .thread-head small{display:block;color:#cfe3d6;font-size:11px}
    .thread-verified{display:grid;place-items:center;width:13px;height:13px;border-radius:50%;background:#53bdeb;color:var(--brand-deep);font-size:8px;font-weight:900}
    .thread-body{flex:1;overflow-y:auto;padding:18px;background:#eef1ec;scroll-behavior:smooth}
    .day-marker{display:block;margin:0 auto 16px;width:max-content;padding:4px 11px;border-radius:8px;background:#fff;color:var(--slate);font:600 10px var(--mono);letter-spacing:.06em}
    .bubble{position:relative;max-width:min(78%,52ch);margin:0 0 12px;padding:11px 13px;border-radius:12px;background:#fff;box-shadow:0 1px 1px rgba(24,33,43,.08);overflow-wrap:anywhere}
    .bubble.assistant,.bubble.lender{border-top-left-radius:3px}
    .bubble.borrower{margin-left:auto;background:#dcf3dd;border-top-right-radius:3px}
    /* A message that has just arrived slides in; the ones already read do not
       re-animate, because the paint only marks what is new. */
    .bubble.enter{animation:bubble-in .24s ease both}
    @keyframes bubble-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .bubble p{margin:0}
    .bubble b{font-weight:700}
    .bubble .bubble-author{display:block;margin-bottom:4px;color:var(--brand-deep);font:600 10px var(--mono);text-transform:uppercase}
    /* The assistant is composing: three dots, in the shape of a bubble. */
    .typing{display:flex;gap:4px;width:52px;margin:0 0 12px;padding:12px;border-radius:12px;border-top-left-radius:3px;background:#fff;box-shadow:0 1px 1px rgba(24,33,43,.08)}
    .typing i{width:7px;height:7px;border-radius:50%;background:#b8c6bf;animation:typing 1.1s infinite}
    .typing i:nth-child(2){animation-delay:.18s}
    .typing i:nth-child(3){animation-delay:.36s}
    @keyframes typing{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
    .attachment{display:flex;align-items:center;gap:10px;margin-top:9px;padding:9px 10px;border:1px solid #cbd9cc;border-radius:8px;background:#f6fbf6}
    .attachment .file-glyph{display:grid;place-items:center;width:26px;height:31px;border:1px solid #dfe6e2;border-radius:3px;background:#fff;color:var(--danger)}
    .attachment .file-glyph svg{width:15px;height:15px}
    .attachment .file-name{display:block;font-size:12px;font-weight:600;overflow-wrap:anywhere}
    .attachment .file-meta{display:block;color:var(--slate);font:400 11px var(--mono)}
    .composer{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#fff;border-top:1px solid var(--rule)}
    .composer input{flex:1;min-width:0;height:40px;padding:0 15px;border:1px solid #cbd4dc;border-radius:999px;background:#fff;transition:border-color .16s}
    .composer input:hover{border-color:#a9b8c2}
    .composer button{display:grid;place-items:center;flex:0 0 40px;width:40px;height:40px;padding:0;border:0;border-radius:50%;background:var(--brand);color:#fff;transition:background .16s,transform .16s}
    .composer button:hover{background:#00692c;transform:scale(1.05)}
    .composer button svg{width:17px;height:17px}

    .checklist-card{padding:20px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow)}
    .checklist-card h3{margin:0;font:600 15px var(--display)}
    .checklist-progress{margin:9px 0 0;color:var(--slate);font-size:12.5px}
    .checklist-progress b{color:var(--ink)}
    .progress-track{height:7px;margin:11px 0 15px;border-radius:5px;background:#eef2f0;overflow:hidden}
    .progress-fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--brand-lime));transition:width .55s ease}
    /* Nine rows are taller than the thread beside them, so the list scrolls in
       its own frame and the paint keeps the document being discussed in view. */
    .checklist-scroll{position:relative;max-height:min(46vh,430px);overflow-y:auto;margin:0 -4px;padding:0 4px;scroll-behavior:smooth}
    .checklist{list-style:none;margin:0;padding:0}
    .checklist>li{margin-bottom:7px}
    .checklist>li:last-child{margin-bottom:0}
    /* One row per document: a state tile, the document and why it is wanted, and
       the verdict in words. The tile is what turns nine rows into a glanceable
       list — colour is never carrying the meaning by itself. */
    .doc-row{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr);align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--rule);border-radius:11px;background:#fff;color:var(--ink);text-align:left;transition:border-color .16s,box-shadow .16s,transform .16s,background .45s}
    .doc-row:hover{border-color:#aebac4;box-shadow:0 6px 16px rgba(24,33,43,.08);transform:translateY(-1px)}
    .doc-row[data-verdict="rejected"],.doc-row[data-verdict="under-review"]{border-left:4px solid var(--brand-lime);padding-left:8px}
    .doc-row:disabled{opacity:1;background:var(--shell);color:var(--muted)}
    .doc-row:disabled .doc-name{font-weight:500;color:var(--muted)}
    /* A verdict that has just landed pulses once, so the eye is taken to it. */
    .doc-row.flash{background:#fbfde8}
    .doc-tile{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--shell);color:var(--muted);font:600 11px var(--mono);transition:background .25s,color .25s}
    .doc-tile svg{width:16px;height:16px}
    .doc-row[data-verdict="accepted"] .doc-tile,.doc-row[data-verdict="accepted-with-condition"] .doc-tile{background:#e8f6ee;color:var(--ok)}
    .doc-row[data-verdict="rejected"] .doc-tile{background:#fdf0ef;color:var(--danger)}
    .doc-row[data-verdict="under-review"] .doc-tile{background:#fdf6e8;color:var(--warn)}
    .doc-row[data-analysing="true"] .doc-tile{background:transparent;border:2px solid #cfd9d4;border-top-color:var(--brand);animation:spin .7s linear infinite}
    .doc-body{display:grid;gap:3px;min-width:0}
    .doc-head{display:flex;align-items:baseline;justify-content:space-between;gap:9px}
    .doc-name{min-width:0;font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
    .doc-purpose{color:var(--muted);font-size:11.5px;line-height:1.35;overflow-wrap:anywhere}
    /* Activity is a card of its own in the side rail, never a tail hanging off
       the bottom of the checklist. It scrolls inside itself so a long run of
       events can never push the page taller than the thread beside it. */

    /* ---- the shared review drawer ---- */
    .drawer-backdrop{position:fixed;inset:0;z-index:30;background:rgba(16,20,24,.42);animation:fade .2s ease}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .review-drawer{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(680px,100%);display:flex;flex-direction:column;background:var(--paper);border-left:1px solid var(--rule);box-shadow:-18px 0 45px rgba(16,20,24,.16);animation:drawer-in .28s ease}
    @keyframes drawer-in{from{opacity:.4;transform:translateX(30px)}to{opacity:1;transform:none}}
    .drawer-header{display:flex;justify-content:space-between;gap:18px;padding:22px 24px;border-bottom:1px solid var(--rule)}
    .drawer-header h2{margin:4px 0;font:600 27px var(--display);letter-spacing:-.04em;overflow-wrap:anywhere}
    .drawer-header p{margin:0;color:var(--slate)}
    .drawer-close{min-width:36px;height:36px;border:1px solid var(--rule);border-radius:50%;background:#fff;color:var(--muted);transition:border-color .16s,color .16s}
    .drawer-close:hover{border-color:var(--brand);color:var(--brand)}
    .drawer-tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--rule);overflow-x:auto}
    .drawer-tabs button{min-width:max-content;padding:13px 12px;border:0;border-bottom:3px solid transparent;background:#fff;color:var(--slate);font-weight:600;transition:color .16s,border-color .16s}
    .drawer-tabs button:hover{color:var(--ink)}
    .drawer-tabs button[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--ink)}
    .drawer-panel{flex:1;overflow:auto;padding:22px 24px 40px}
    .drawer-thread{margin-top:14px}
    .drawer-thread .bubble{max-width:100%}
    .composer.drawer-composer{border:1px solid var(--rule);border-radius:10px;margin-top:14px}
    .review-banner{padding:16px;border:1px solid var(--rule);border-radius:10px;background:var(--shell)}
    .review-banner h3{margin:0;font:600 15px var(--display)}
    .review-banner p{margin:6px 0 0;color:var(--slate);max-width:62ch}
    .review-banner[data-tone="attention"]{border-color:var(--brand-rule);border-left:4px solid var(--brand-lime);background:var(--brand-wash)}
    .review-banner[data-tone="attention"] h3,.review-banner[data-tone="attention"] p{color:var(--brand-deep)}
    .registration{margin:14px 0 0;padding:11px 13px;border:1px solid var(--rule);border-radius:8px;background:#fff;font:400 12px var(--mono);overflow-wrap:anywhere}
    .review-checks{list-style:none;margin:18px 0 0;padding:0}
    .review-checks>li{padding:11px 0;border-bottom:1px solid #edf0f2}
    .review-checks>li>div:first-child{display:flex;justify-content:space-between;gap:14px}
    .review-checks [data-check-status="mismatch"],.review-checks [data-check-status="missing"]{color:var(--danger)}
    .check-tag{white-space:nowrap;font-size:12px;font-weight:600}
    .comparison{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
    .comparison p{margin:0;padding:9px;border-radius:7px;background:var(--shell)}
    .comparison span{display:block;color:var(--muted);font-size:10px}
    .comparison strong{overflow-wrap:anywhere}
    /* the scanned page — a facsimile, built from fields rather than an image so
       it stays legible at any width and translates with everything else */
    .scan{margin:0 0 18px;padding:16px;display:flex;justify-content:center;background:#e9eeec;border-radius:10px}
    .scan-page{position:relative;width:100%;max-width:420px;padding:20px 22px 16px;border-radius:3px;background:#fff;background-image:linear-gradient(rgba(0,0,0,.012) 1px,transparent 1px);background-size:100% 3px;box-shadow:0 2px 10px rgba(0,0,0,.16);font-size:11.5px}
    .scan-org{color:#7d8b84;font-size:9px;font-weight:700;letter-spacing:.13em;text-align:center;text-transform:uppercase}
    .scan-title{margin:5px 0 14px;padding-bottom:9px;border-bottom:1px solid #e7ecea;color:#2b3833;font-size:13px;font-weight:700;text-align:center}
    .scan-row{position:relative;display:flex;gap:10px;padding:5px 6px;border-radius:4px}
    .scan-row .scan-key{flex:0 0 40%;color:#7d8b84}
    .scan-row .scan-value{color:#2b3833;font-weight:600;overflow-wrap:anywhere}
    .scan-row.mismatch{background:#fdeeec;outline:1.5px dashed var(--danger);outline-offset:1px}
    .scan-mark{position:absolute;right:-9px;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-weight:800}
    .scan-lines{margin-top:14px;display:grid;gap:6px}
    .scan-lines i{display:block;height:5px;border-radius:3px;background:#eef2f0}
    .scan-lines i:nth-child(2){width:88%}.scan-lines i:nth-child(3){width:72%}.scan-lines i:nth-child(5){width:54%}
    .scan-stamp{margin:14px 0 0;color:#a5b1ab;font:400 9.5px var(--mono);letter-spacing:.05em;text-align:right}
    .history-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid #edf0f2}
    .history-row span{overflow-wrap:anywhere}
    body.drawer-open{overflow:hidden}

    @media(max-width:1180px){
      .rail-property{display:none}
      .summary-rail{position:static}
    }
    @media(max-width:900px){
      .topbar{flex-wrap:wrap;padding:12px 16px}.demo-controls{margin-left:0;width:100%}
      .phase-rail{top:auto;position:static}

      .documents-layout{grid-template-columns:1fr}

    @media(max-width:620px){
      .portal-label{display:none}.topbar-logo{width:130px}

<!-- The skip link is the first focusable thing in the body, and its name is copy
     like any other, so it arrives from copy.js at init (§8). -->
<body>
  <a class="skip-link" href="#borrower-main" data-copy="common.skip-link"></a>
  <div id="borrower-app"></div>
  <div id="borrower-status" role="status" aria-live="polite"></div>
  <script src="assets/copy.js"></script>
  <script src="assets/falabella-credit.js"></script>
  <script src="assets/falabella-workspace.js"></script>
  <script>
    /* BancoWeston English portal — the borrower surface.
     *
     * This is the Spanish demo's narrative, rebuilt. Nothing about the
     * experience changes: it plays itself, it speaks to Javiera in the second
     * person, it explains why it wants each document, and it pauses on document
     * 9 because that pause is the point of the whole demo.
     *
     * What changes is the engineering. The story is one flat SCRIPT array of
     * steps read by one interpreter, so the narrative can be edited without
     * touching the engine. Every number comes from FalabellaCredit, every string
     * from FalabellaCopy, every state change from FalabellaWorkspace, and every
     * delay from the injectable `later` seam — so the suite drives the whole
     * narrative synchronously and never waits on real time.
     *
     * One thing this surface must never do is leak the bank's internals. What
     * happens behind the exception on document 9 belongs to lender.html. Here it
     * is simply: a specialist has it, and nothing is expected from you (§7).
     */
    "use strict";

    (function () {
      var copy = globalThis.FalabellaCopy;
      var credit = globalThis.FalabellaCredit;
      var workspace = globalThis.FalabellaWorkspace;

      var CASE_ID = "H-2026-08415";

      /* One fixed instant for the whole narrative, advanced a minute per beat.
         The engine wants explicit timestamps and the suite wants the same state
         out of every run, so the story carries its own clock rather than
         reaching for the machine's. */
      var NARRATIVE_START_MS = Date.parse("2026-08-05T13:45:00.000Z");

      /* How long the assistant takes to answer her. Long enough to read as a
         reply rather than an echo, short enough that nobody presenting has to
         fill the silence. */
      var ASSISTANT_REPLY_MS = 2600;
      var SUBMITTED_AT = "2026-08-05T13:40:00.000Z";
      var CHECKLIST_STARTED_AT = "2026-08-05T13:45:00.000Z";

      function t(key, params) {
        return copy.t(key, undefined, params);
      }

      /* ============================================================= locale */

      /* The switched-on locale lives in the copy layer, which falabella-credit.js
         also reads for its numbers and dates — so one change moves every string
         and every figure on the page at once. Session storage carries the choice
         across the role switch, so the lender surface opens in the same
         language this one is being read in. */
      var LOCALE_STORAGE_KEY = "bfDemoLocale";

      function localeStorage() {
        try {
          return globalThis.sessionStorage || null;
        } catch (error) {
          return null;
        }
      }

      function loadLocale() {
        var store = localeStorage();
        if (!store) return copy.locale();
        try {
          return copy.setLocale(store.getItem(LOCALE_STORAGE_KEY));
        } catch (error) {
          return copy.locale();
        }
      }

      /* An unregistered locale is refused rather than half-applied. */
      function setLocale(locale) {
        var applied = copy.setLocale(locale);
        var store = localeStorage();
        if (store) {
          try {
            store.setItem(LOCALE_STORAGE_KEY, applied);
          } catch (error) {
            /* Private mode: the switch still works for this page. */
          }
        }
        return applied;
      }

      function activeLocaleId() {
        return copy.locale();
      }

      /* --------------------------------------------------------- the amount
         Every figure is priced and computed in US dollars; colones are a
         display option laid over that, at a fixed demo rate — never a
         second currency the arithmetic runs in. */
      function money(amountUSD) {
        return view.moneyUnit === "CRC"
          ? credit.formatCRC(amountUSD)
          : credit.formatUSD(amountUSD);
      }

      /* ========================================================== escaping */

      var HTML_ENTITIES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };

        var raw = value === null || value === undefined ? "" : String(value);

          return HTML_ENTITIES[character];

      function text(key, params) {
        return escapeHtml(t(key, params));

       * WhatsApp emphasis, applied only to copy the script owns. It runs after
       * escaping, so the only tags that can survive are the ones this function
       * put there — and it is deliberately never applied to anything Javiera
       * typed herself: her asterisks stay her asterisks.
       */
      function scripted(key, params) {
        return text(key, params)
          .replace(/\*([^*\n]+)\*/g, "<b>$1</b>")
          .replace(/\n/g, "<br>");
      }

      /* ======================================================== the figures */

      /* Read at render time rather than cached, so a locale switch reformats
         everything and no figure is ever written down twice (§3.1). */
      /* ---------------------------------------------------------- the form
       *
       * The simulator is a form she fills, not a record she is shown. It starts
       * empty, every field is a real control, and the summary beside it is
       * computed from whatever is in it so far. `Use demo data` fills it with
       * this case's answers and plays the story from there — which is the only
       * thing that starts the narrative. Nothing plays on load.
       */
      var EMPTY_FORM = {
        propertyType: "",
        condition: "",
        propertyUF: "",
        downPct: "",
        termYears: "",
        idNumber: "",
        dateOfBirth: "",
        incomeCLP: "",
        streetAddress: "",
        provincia: "",
        canton: "",
        distrito: ""

      function emptyForm() {
        return {
          propertyType: "",
          condition: "",
          propertyUF: "",
          downPct: "",
          termYears: "",
          idNumber: "",
          dateOfBirth: "",
          incomeCLP: "",
          streetAddress: "",
          provincia: "",
          canton: "",
          distrito: ""

      }

         demo is built on, so loading it leaves the narrative telling the truth. */

        return {
          propertyType: "house",
          condition: "new",
          propertyUF: String(credit.PROPERTY_USD),
          downPct: String(Math.round(credit.DOWN_PCT * 100)),
          termYears: String(credit.TERM_YEARS),

          dateOfBirth: t("borrower.scan.national-id.value-date-of-birth"),

          provincia: "San José",

          distrito: t("borrower.sim.demo-distrito")

      /* The form is data, so it is copied field by field like everything else the
         view state holds — never handed on by reference. */

        var source = form || {};
        var copy = emptyForm();
        FORM_FIELDS.forEach(function (field) {
          if (typeof source[field] === "string") copy[field] = source[field];

        if (!viewState || FORM_FIELDS.indexOf(field) === -1) return viewState;

         plausible, the affordability panel says nothing rather than reporting a
         ratio of several million percent against the first digit she typed. */

      function statedIncome(form) {
        var income = typedNumber((form || emptyForm()).incomeCLP);
        return income && income >= MIN_STATED_INCOME_USD ? income : null;
      }

      function typedNumber(value) {
        if (value === null || value === undefined) return null;
        var digits = String(value).replace(/[^0-9.]/g, "");
        if (!digits) return null;
        var parsed = Number(digits);

      }

         unanswered field falls back to the reference simulation rather than to

      function formOptions(form) {
        var answered = form || emptyForm();
        var options = {};
        var propertyUF = typedNumber(answered.propertyUF);
        var incomeCLP = statedIncome(answered);
        var termYears = typedNumber(answered.termYears);
        var downPct = typedNumber(answered.downPct);
        if (propertyUF) options.propertyUSD = propertyUF;
        if (incomeCLP) options.incomeUSD = incomeCLP;

      function formReady(form) {
        var answered = form || emptyForm();
        return Boolean(

            answered.condition &&
            typedNumber(answered.propertyUF) &&
            typedNumber(answered.downPct) &&

       *
       * A form being filled in by hand answers what it can as it goes — that is
       * the demo's claim about asking the sources rather than the applicant. But
       * once the demo is driving, the checks belong to the run: they tick one at
       * a time, visibly, and deriving them from the form would answer all nine
       * the instant the last digit was typed and show none of it. */
      function checkDone(viewState, checkId, f) {
        if (!viewState) return false;
        if (viewState.verified.indexOf(checkId) !== -1) return true;
        if (viewState.started) return false;
        return formSatisfies(viewState.form, checkId, f);

      function verifyStarted(viewState) {
        if (!viewState) return false;
        if (viewState.started === true) return true;
        if (viewState.verified.length > 0) return true;
        var form = viewState.form || emptyForm();
        return FORM_FIELDS.some(function (field) {

      /**
       * How one row reads: answered, out at the source right now, or not asked
       * yet. Exactly one row is ever `waiting` — the next one the run will

       * while it is still loading, not what nine questions being asked in turn

       */

        var running = verifyStarted(viewState);
        var spun = false;
        return VERIFY_CHECKS.map(function (checkId) {

          if (running && !spun) {

            return "waiting";
          }
          return "idle";
        });

      function allChecksDone(viewState, f) {

         under the bank's income cap. The demo used to check a whole run of
         state-guarantee eligibility rules here; with no guarantee programme in

      function formSatisfies(form, checkId, f) {
        var answered = form || emptyForm();
        if (checkId === "affordability") {

          return !(f || credit.caseFigures(formOptions(answered))).dti.overCap;

         "clear everything" and must not grow one (§4.2). */
      function resolveWorkOn(state, documentId, timestamp) {
        var next = state;

          if (item.documentId !== documentId) return;
          /* Her own upload answers the exception, never the question she asked
             about the same document — that one is waiting on a person (§4.2). */
          if (!workspace.isDocumentWork(item)) return;
          next = workspace.resolveReviewItem(next, item.id, timestamp);

      /* An activity entry carries the beat it happened on, so the card can say
         when as well as what. The clock is the narrative's, never the machine's. */
      function feedEntry(step, timestamp, viewState) {
        return {

          params: paramsFor(step.paramsId, viewState),
          at: timestamp || null
        };
      }

      /* HH:MM in UTC, because the story's timestamps are UTC: reading them in the
         viewer's zone would make the same demo tell a different time in Santiago
         and in Madrid, and the tests would move with the machine. */
      function clockTime(timestamp) {

        if (isNaN(when.getTime())) return "";

        var minutes = String(when.getUTCMinutes());

      }

      /* ======================================================= the interpreter */

      /**
       * One step of the narrative against one view state, pure. Returns the view
       * state it was given, by reference, when the step means nothing — so the
       * caller can tell that nothing happened.

      function applyStep(viewState, step) {

        if (step.documentId) changes.currentDocumentId = step.documentId;

            { author: "assistant", key: step.key, params: paramsFor(step.paramsId, viewState) }

          return fork(viewState, changes);
        }

        if (step.kind === "borrower") {
          var outgoing = {
            author: "borrower",
            key: step.key || null,
            params: paramsFor(step.paramsId, viewState)
          };
          if (step.fileKey) {
            outgoing.attachment = { fileKey: step.fileKey, metaKey: step.metaKey || null };
            /* The file is on its way; nothing is decided until a document step
               says so. The checklist shows it as being looked at. */
            changes.analysing = viewState.analysing.concat([step.documentId]);
          }
          changes.thread = viewState.thread.concat([outgoing]);
          return fork(viewState, changes);
        }

        if (step.kind === "document") {
          var pending = resolveWorkOn(viewState.state, step.documentId, timestamp);
          changes.state = workspace.registerUpload(
            pending,
            step.documentId,
            { filename: t(step.fileKey), verdict: step.verdict },
            timestamp
          );
          /* Her upload settles the condition it answers, in the same state the
             desk then loads — one rule for who moves a condition, wherever the
             document was settled from. */
          changes.state = workspace.settleConditionsFor(
            changes.state,
            step.documentId,
            timestamp
          );
          changes.analysing = without(viewState.analysing, step.documentId);
          if (step.feedKey) {
            changes.feed = viewState.feed.concat([feedEntry(step, timestamp, viewState)]);
          }
          return fork(viewState, changes);
        }

        if (step.kind === "verify") {
          if (viewState.verified.indexOf(step.checkId) === -1) {
            changes.verified = viewState.verified.concat([step.checkId]);
          }
          return fork(viewState, changes);
        }

        if (step.kind === "status") {
          if (step.phase) {
            changes.phase = step.phase;
            /* Autoplay turning the page asks for the top of it, exactly as a
               click on the rail would. Without this the narrative advances to
               the WhatsApp thread while she is still looking at the simulator. */
            if (step.phase !== viewState.phase) changes.scrollTop = true;
          }
          if (step.statusKey) changes.statusKey = step.statusKey;
          return fork(viewState, changes);
        }

        if (step.kind === "escalate") {
          changes.state = workspace.setVerdict(
            viewState.state,
            step.documentId,
            step.verdict,
            null,
            timestamp
          );
          /* The moment the case becomes a person's problem, put what she was told
             into the shared state. Everything before this is her conversation with
             a machine and stays on this page; from here the other side of the
             handoff needs to know what she has already been told, or it would be
             asking her to repeat herself. One line of context, no more. */
          changes.state = workspace.sendAssistantMessage(
            changes.state,
            step.documentId,
            t("borrower.msg.doc9-exception"),
            timestamp
          );
          changes.escalated = true;
          changes.analysing = without(viewState.analysing, step.documentId);
          return fork(viewState, changes);
        }

        changes.finished = true;
        return fork(viewState, changes);
      }

      function advance(viewState) {
        var step = SCRIPT[viewState.cursor];
        if (!step) return viewState;
        var next = applyStep(viewState, step);
        /* A step the interpreter does not recognise must not stall the demo. */
        return next === viewState ? fork(viewState, { cursor: viewState.cursor + 1 }) : next;
      }

      /* The story is the demo applicant's, so playing it from nothing starts
         from her answers: the narrative quotes the form, and an empty form would
         make it quote a case nobody filled in. */
      function runScript(from) {
        var viewState = from || useDemoData(initialViewState());
        while (viewState.cursor < SCRIPT.length) viewState = advance(viewState);
        return viewState;
      }

      /* ============================================================= the seam
         Every delay in the narrative goes through here, so the suite plays the
         whole story in a single tick and never waits on real time. The shape is
         the one lender.html established:
           later(ms, fn)        schedule through the current scheduler
           setLater(schedule)   replace it, returning the one it displaced
           DEFAULT_LATER        the setTimeout-backed default */
      function DEFAULT_LATER(ms, fn) {
        return setTimeout(fn, ms);
      }

      var scheduleLater = DEFAULT_LATER;

      function later(ms, fn) {
        return scheduleLater(ms, fn);
      }

      function setLater(schedule) {
        var previous = scheduleLater;
        scheduleLater = typeof schedule === "function" ? schedule : DEFAULT_LATER;
        return previous;
      }

      function beatDelay(step, speed) {
        var divisor = SPEEDS.indexOf(speed) === -1 ? 1 : speed;
        return Math.round((step && step.delay ? step.delay : 0) / divisor);
      }

      /* The beat currently waiting to play: which step, on which scheduler. Two
         calls asking for the same beat on the same scheduler are the same
         request, so the second one is ignored rather than doubling the story up.
         Clearing it stands the outstanding beat down: a scheduler we handed a
         callback to cannot always take it back, so the callback checks that it is
         still the beat the page is waiting for before it does anything. */
      var pendingBeat = null;

      function stopAutoplay() {
        pendingBeat = null;
      }

      /**
       * Play one beat, then re-arm from the state that beat produced. Autoplay is
       * a chain of single scheduled steps rather than a running timer, which is
       * what lets a test fire the story forward by hand.
       *
       * `options.current` is how a live page keeps the chain honest: the beat
       * plays from whatever view state the page holds *now*, so pressing pause or
       * changing speed between two beats is respected instead of being overwritten
       * by the view the chain happened to capture. Without it — which is how the
       * suite drives it — the beat plays from the view state it was given.
       */
      function play(viewState, options) {
        var settings = options || {};
        var schedule = typeof settings.later === "function" ? settings.later : later;
        if (!playable(viewState)) return null;
        if (pendingBeat && pendingBeat.cursor === viewState.cursor && pendingBeat.schedule === schedule) {
          return null;
        }
        var beat = { cursor: viewState.cursor, schedule: schedule };
        pendingBeat = beat;
        return schedule(beatDelay(SCRIPT[viewState.cursor], viewState.speed), function () {
          if (pendingBeat !== beat) return;
          pendingBeat = null;
          var from = typeof settings.current === "function" ? settings.current() : viewState;
          if (!playable(from)) return;
          var next = advance(from);
          if (typeof settings.onStep === "function") settings.onStep(next);
          play(next, settings);
        });
      }

      function playable(viewState) {
        return Boolean(viewState) && !viewState.paused && !viewState.finished
          && viewState.cursor < SCRIPT.length;
      }

      /* ============================================ the bridge to the other surface
         Spec §7. Both files are opened from disk with no server, so the handoff is
         browser storage plus the `storage` event — the mechanism the Spanish demo
         already proved in solicitante.html and ejecutivo.html, carried over rather
         than invented a second time. Two keys, and they are not interchangeable:

           CASE_STORAGE_KEY    sessionStorage. The version-1 state of the one
                               interactive case. Per tab on purpose: this page
                               seeds it, and switching to the lender view in the
                               same tab carries it across.
           MESSAGE_BRIDGE_KEY  localStorage. The live cross-tab message bridge,
                               capped at the last 200 messages, which is what lets
                               two tabs open side by side hear each other.

         Nothing below trusts what it reads. Unreadable, wrongly shaped or
         future-version payloads all reset to this page's own clean fixture,
         because a parse error must never blank the page. */

      var CASE_STORAGE_KEY = "bfDemoCase:" + CASE_ID;
      var MESSAGE_BRIDGE_KEY = "bfDemoMessages:" + CASE_ID;
      /* localStorage, the same shared area as the message bridge — a restart
         has to reach a lender tab that is already open on its own case data,
         which sessionStorage cannot do (§ her place on the page: it is per
         tab on purpose). The value is the bridge's own run counter, already
         a number that only ever goes up and needs no clock of its own; a
         lender tab treats "the number I last saw is not the number here" as
         its own signal to reload the case fresh rather than trusting
         whatever it already has open. */
      var CASE_RESET_KEY = "bfDemoReset:" + CASE_ID;
      var BRIDGE_VERSION = 1;
      var BRIDGE_LIMIT = 200;
      /* The assistant is a third voice on the bridge: it answers her on her own
         page, and the lender's desk shows the same conversation. */
      var BRIDGE_SENDERS = ["borrower", "lender", "assistant"];
      /* Which side of the bridge this page is. Its own messages are already on its
         own surface, so it never absorbs them back. */
      var BRIDGE_ROLE = "borrower";
      /* Both voices on this page: she types, and the assistant answers here. An
         entry from either is already in this thread and must not come back over
         the bridge as though it were news. */
      var BRIDGE_OWN = ["borrower", "assistant"];

      /* Storage is reached for through these two and never directly: a browser in
         private mode can throw on the property itself, not only on the call. */
      function caseStorage() {
        try {
          return typeof globalThis.sessionStorage === "undefined" ? null : globalThis.sessionStorage;
        } catch (error) {
          return null;
        }
      }

      function bridgeStorage() {
        try {
          return typeof globalThis.localStorage === "undefined" ? null : globalThis.localStorage;
        } catch (error) {
          return null;
        }
      }

      /* Said once. A demo that repeats "state is view-only" after every keystroke
         is worse than one that says it plainly the first time (§7). */
      var viewOnlySaid = false;

      function viewOnlyAnnouncement() {
        if (viewOnlySaid) return null;
        viewOnlySaid = true;
        return { key: "common.view-only", params: null };
      }

      function resetViewOnlyNotice() {
        viewOnlySaid = false;
      }

      function readRaw(storage, key) {
        if (!storage) return { ok: true, value: null };
        try {
          var value = storage.getItem(key);
          return { ok: true, value: typeof value === "string" ? value : null };
        } catch (error) {
          return { ok: false, value: null };
        }
      }

      function writeRaw(storage, key, value) {
        if (!storage) return false;
        try {
          storage.setItem(key, value);
          return true;
        } catch (error) {
          /* Quota, or private mode. The caller keeps working in memory. */
          return false;
        }
      }

      /* -------------------------------------------------------- the case state */

      function cleanCaseState() {
        return initialViewState().state;
      }

      function fallbackCase(reason) {
        return { state: cleanCaseState(), source: "fallback", reason: reason };
      }

      /**
       * The case as storage holds it, or this page's own clean fixture when storage
       * has nothing usable to say. `source` and `reason` are the honest account of
       * which of the two happened, so a caller can announce it rather than guess.
       */
      function loadCase(storage) {
        var store = storage === undefined ? caseStorage() : storage;
        var raw = readRaw(store, CASE_STORAGE_KEY);
        if (!raw.ok) return fallbackCase("unreadable");
        if (!raw.value) return fallbackCase("empty");
        var parsed;
        try {
          parsed = JSON.parse(raw.value);
        } catch (error) {
          return fallbackCase("unreadable");
        }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          return fallbackCase("malformed");
        }
        if (typeof parsed.version !== "number") return fallbackCase("malformed");
        /* A version this build does not know is not repaired into something
           plausible: §7 says it resets. */
        if (parsed.version !== workspace.STATE_VERSION) return fallbackCase("version");
        if (!parsed.documents || typeof parsed.documents !== "object") {
          return fallbackCase("malformed");
        }
        return {
          state: workspace.normalizeState(parsed, {
            submittedAt: SUBMITTED_AT,
            checklistStartedAt: CHECKLIST_STARTED_AT
          }),
          source: "storage",
          reason: null
        };
      }

      /** False when storage refused it; the caller announces view-only, once. */
      function saveCase(storage, state) {
        var store = storage === undefined ? caseStorage() : storage;
        return writeRaw(store, CASE_STORAGE_KEY, JSON.stringify(state));
      }

      /* -------------------------------------------------------- her place on the page
       *
       * The case state alone is not where she left off: it says nothing about
       * which phase she is on, whether the narrative has finished, or what she
       * has already read in the bell. Without it, reopening this tab — or
       * switching to the lender view and back — dropped her back on the
       * simulator, as if she had never started, and only the restart control
       * should ever do that (§7). So her place is written down too, under
       * its own key in the same per-tab sessionStorage, and read back before
       * the first paint.
       *
       * The bridge's own memory of what it has already taken in — `bridgeSeen`
       * and `bridgeRun` — travels with it, for a reason the case state alone
       * does not cover: a reply the desk sent while this tab was closed is
       * still sitting on the bridge, unabsorbed, when the tab reopens. Wiping
       * the bridge on every load (this page's original behaviour, from when
       * every load really was a fresh run) would throw that reply away before
       * it was ever read. Absorbing it needs the memory of what was already
       * folded into the state being resumed, or the same reply would be
       * absorbed a second time on every later reload. `loadView` hands both
       * back so `init` can choose correctly (§7): resuming a real session
       * absorbs the backlog; a genuinely fresh one clears the bridge, exactly
       * as it always did, so a previous demo's leftovers cannot leak into a
       * new run.
       *
       * Malformed, wrongly shaped or future-version storage resets to the
       * clean opening view, the same rule §7 already applies to the case
       * state — a parse error must never blank the page. Each field is taken
       * on its own terms rather than trusted whole, so one corrupted field
       * cannot take the rest of a perfectly good session down with it.
       */
      var VIEW_STORAGE_KEY = "bfDemoBorrowerView:" + CASE_ID;
      var BORROWER_VIEW_VERSION = 1;

      function loadView(storage) {
        var store = storage === undefined ? caseStorage() : storage;
        var clean = initialViewState();
        var fresh = { view: clean, resumed: false, bridgeSeen: {}, bridgeRun: 0 };
        var raw = readRaw(store, VIEW_STORAGE_KEY);
        if (!raw.ok || !raw.value) return fresh;
        var parsed;
        try {
          parsed = JSON.parse(raw.value);
        } catch (error) {
          return fresh;
        }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return fresh;
        if (parsed.version !== BORROWER_VIEW_VERSION) return fresh;
        var seen =
          parsed.bridgeSeen && typeof parsed.bridgeSeen === "object" && !Array.isArray(parsed.bridgeSeen)
            ? parsed.bridgeSeen
            : {};
        return {
          view: {
            cursor: typeof parsed.cursor === "number" && parsed.cursor >= 0 ? parsed.cursor : clean.cursor,
            phase: PHASES.indexOf(parsed.phase) !== -1 ? parsed.phase : clean.phase,
            statusKey: typeof parsed.statusKey === "string" ? parsed.statusKey : clean.statusKey,
            thread: Array.isArray(parsed.thread) ? parsed.thread : clean.thread,
            feed: Array.isArray(parsed.feed) ? parsed.feed : clean.feed,
            analysing: Array.isArray(parsed.analysing) ? parsed.analysing : clean.analysing,
            verified: Array.isArray(parsed.verified) ? parsed.verified : clean.verified,
            escalated: parsed.escalated === true,
            finished: parsed.finished === true,
            /* Autoplay never resumes on its own on a fresh load — only a body
               she is looking at schedules a beat (§ the later seam) — so a run
               that was mid-play reopens paused rather than racing ahead of a
               page she has not seen yet. */
            paused: true,
            started: parsed.started === true,
            form: copyForm(parsed.form),
            speed: SPEEDS.indexOf(parsed.speed) !== -1 ? parsed.speed : clean.speed,
            moneyUnit: MONEY_UNITS.indexOf(parsed.moneyUnit) !== -1 ? parsed.moneyUnit : clean.moneyUnit,
            openDocumentId: typeof parsed.openDocumentId === "string" ? parsed.openDocumentId : null,
            drawerTab: DRAWER_TABS.indexOf(parsed.drawerTab) !== -1 ? parsed.drawerTab : "review",
            notificationsOpen: parsed.notificationsOpen === true,
            seenNotifications: Array.isArray(parsed.seenNotifications) ? parsed.seenNotifications : [],
            scrollTop: false,
            currentDocumentId:
              typeof parsed.currentDocumentId === "string" ? parsed.currentDocumentId : undefined,
            state: workspace.normalizeState(parsed.state, {
              submittedAt: SUBMITTED_AT,
              checklistStartedAt: CHECKLIST_STARTED_AT
            })
          },
          resumed: true,
          bridgeSeen: seen,
          bridgeRun: typeof parsed.bridgeRun === "number" ? parsed.bridgeRun : 0
        };
      }

      function saveView(storage, viewState) {
        var store = storage === undefined ? caseStorage() : storage;
        var payload = {};
        Object.keys(viewState).forEach(function (key) {
          payload[key] = viewState[key];
        });
        payload.version = BORROWER_VIEW_VERSION;
        /* So a reload can tell which bridge entries are already reflected in
           the state it is about to resume, and only ever absorb the rest. */
        payload.bridgeSeen = bridgeSeen;
        payload.bridgeRun = bridgeRun;
        return writeRaw(store, VIEW_STORAGE_KEY, JSON.stringify(payload));
      }

      function clearView(storage) {
        var store = storage === undefined ? caseStorage() : storage;
        if (!store) return;
        try {
          store.removeItem(VIEW_STORAGE_KEY);
        } catch (error) {
          /* Nothing to clear if storage already refuses. */
        }
      }

      /* ------------------------------------------------------------ the bridge */

      function emptyBridge() {
        return { version: BRIDGE_VERSION, run: 1, entries: [] };
      }

      function validBridgeEntry(entry) {
        return (
          Boolean(entry) &&
          typeof entry === "object" &&
          typeof entry.id === "string" &&
          entry.id !== "" &&
          BRIDGE_SENDERS.indexOf(entry.from) !== -1 &&
          typeof entry.text === "string" &&
          entry.text.trim() !== ""
        );
      }

      /** The envelope as storage holds it. Anything unusable reads as no thread. */
      function bridgeRead(storage) {
        var store = storage === undefined ? bridgeStorage() : storage;
        var raw = readRaw(store, MESSAGE_BRIDGE_KEY);
        if (!raw.ok || !raw.value) return emptyBridge();
        var parsed;
        try {
          parsed = JSON.parse(raw.value);
        } catch (error) {
          return emptyBridge();
        }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return emptyBridge();
        if (parsed.version !== BRIDGE_VERSION) return emptyBridge();
        if (!Array.isArray(parsed.entries)) return emptyBridge();
        return {
          version: BRIDGE_VERSION,
          run: Number.isInteger(parsed.run) && parsed.run > 0 ? parsed.run : 1,
          entries: parsed.entries.filter(validBridgeEntry)
        };
      }

      function bridgeWrite(storage, envelope) {
        var store = storage === undefined ? bridgeStorage() : storage;
        return writeRaw(
          store,
          MESSAGE_BRIDGE_KEY,
          JSON.stringify({
            version: BRIDGE_VERSION,
            run: envelope.run,
            /* The cap of §7: the last 200, oldest dropped first. */
            entries: envelope.entries.slice(-BRIDGE_LIMIT)
          })
        );
      }

      /* The sequence continues from the highest the envelope has ever held, so the
         cap dropping the oldest entries can never make an id repeat. */
      function nextBridgeSequence(entries) {
        var highest = 0;
        entries.forEach(function (entry) {
          if (Number.isInteger(entry.seq) && entry.seq > highest) highest = entry.seq;
        });
        return highest + 1;
      }

      /* What this page has already taken in, and the run those ids belonged to. */
      var bridgeSeen = {};
      var bridgeRun = 0;

      function forgetBridge(run) {
        bridgeSeen = {};
        bridgeRun = run;
      }

      /* The other half of what `saveView` writes down: which bridge entries
         this page had already taken in, restored before the first paint so a
         reload does not re-absorb a reply it folded into the state it is
         about to resume. */
      function applyBridgeMemory(snapshot) {
        bridgeSeen =
          snapshot && snapshot.bridgeSeen && typeof snapshot.bridgeSeen === "object"
            ? snapshot.bridgeSeen
            : {};
        bridgeRun = snapshot && typeof snapshot.bridgeRun === "number" ? snapshot.bridgeRun : 0;
      }

      /**
       * One message onto the bridge. The id is `<sender>-<run>-<sequence>`: no
       * clock and no randomness, so two runs of the demo produce the same ids, and
       * still unique across a restart because a restart moves the run on.
       */
      function bridgeSend(storage, message) {
        var input = message || {};
        var body = String(input.text === null || input.text === undefined ? "" : input.text).trim();
        if (BRIDGE_SENDERS.indexOf(input.from) === -1 || !body) {
          return { ok: false, message: null, entries: [] };
        }
        var envelope = bridgeRead(storage);
        var seq = nextBridgeSequence(envelope.entries);
        var entry = {
          id: input.from + "-" + envelope.run + "-" + seq,
          run: envelope.run,
          seq: seq,
          from: input.from,
          text: body,
          timestamp: typeof input.timestamp === "string" ? input.timestamp : "",
          documentId: typeof input.documentId === "string" ? input.documentId : null
        };
        envelope.entries.push(entry);
        var ok = bridgeWrite(storage, envelope);
        /* Mine is already on my own surface. */
        if (bridgeRun !== envelope.run) forgetBridge(envelope.run);
        bridgeSeen[entry.id] = true;
        return { ok: ok, message: entry, entries: envelope.entries };
      }

      /**
       * Empty the shared thread and move the run on, so the first message of the
       * next run cannot be mistaken for one already seen. Called with `null` it
       * forgets this page's memory without writing anywhere.
       */
      function bridgeClear(storage) {
        var envelope = bridgeRead(storage);
        forgetBridge(envelope.run + 1);
        if (storage === null) return true;
        return bridgeWrite(storage, { run: bridgeRun, entries: [] });
      }

      /**
       * The messages this surface has not yet taken in: written by the other side,
       * not already absorbed. Two things keep it honest across a restart — the run
       * counter, and pruning the memory back to what the envelope still holds, so a
       * bridge emptied by any means lets the next message through.
       */
      function bridgeIncoming(options) {
        var settings = options || {};
        var direct = Array.isArray(settings.entries);
        var envelope = direct
          ? { run: bridgeRun, entries: settings.entries.filter(validBridgeEntry) }
          : bridgeRead(settings.storage);
        if (envelope.run !== bridgeRun) forgetBridge(envelope.run);
        if (!direct) {
          /* Storage is the authority on what the thread contains. */
          var present = {};
          envelope.entries.forEach(function (entry) {
            if (bridgeSeen[entry.id]) present[entry.id] = true;
          });
          bridgeSeen = present;
        }
        var fresh = [];
        envelope.entries.forEach(function (entry) {
          if (bridgeSeen[entry.id]) return;
          bridgeSeen[entry.id] = true;
          if (BRIDGE_OWN.indexOf(entry.from) !== -1) return;
          fresh.push(entry);
        });
        return fresh;
      }

      /**
       * A reply written from the lender surface, arriving in her thread. She sees the
