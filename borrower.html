        if (painted.phase === view.phase) return;
        painted.phase = view.phase;
        var panel = document.querySelector('.phase-panel[data-phase="' + view.phase + '"]');
        if (panel) panel.classList.add("enter");
      }

      /* Every scroller on the page is thrown away and rebuilt on each beat, and a
         rebuilt element starts at the top. Left alone, the thread therefore jumps
         to its first message and scrolls the whole way down again on every single
         upload. So the paint reads where each scroller stood, and puts it back
         before the browser gets a chance to paint the top of it. */
      var SCROLLERS = [".thread-body", ".checklist-scroll", ".drawer-panel"];

      /* Whether the thread follows the conversation down as it grows. It stops
         following the moment she scrolls back through it herself and starts again
         when she returns to the newest message — and it is decided by her gesture
         rather than by where the scroller happens to be, because at 4× a beat can
         land while the previous glide is still in the air. */
      var followingThread = true;

      function onThreadGesture(event) {
        var body =
          event.target && event.target.closest ? event.target.closest(".thread-body") : null;
        if (!body) return;
        /* After the gesture has been applied, not before it. */
        requestAnimationFrame(function () {
          if (!body.isConnected) return;
          followingThread = body.scrollHeight - body.scrollTop - body.clientHeight < 48;
        });
      }

      function readScrollPositions() {
        var positions = {};
        SCROLLERS.forEach(function (selector) {
          var node = document.querySelector(selector);
          if (node) positions[selector] = node.scrollTop;
        });
        return positions;
      }

      function restoreScrollPositions(positions) {
        SCROLLERS.forEach(function (selector) {
          var node = document.querySelector(selector);
          if (!node || positions[selector] === undefined) return;
          /* Instantly, and without the smooth behaviour the stylesheet asks for:
             this is not a movement, it is the same view redrawn. */
          var behaviour = node.style.scrollBehavior;
          node.style.scrollBehavior = "auto";
          node.scrollTop = positions[selector];
          node.style.scrollBehavior = behaviour;
        });
      }

      /* The ring on the check that is out at the source is a CSS animation, and
         a CSS animation on a brand new element starts from zero. She fills the
         form a character at a time and every character repaints the page, so
         left alone the ring would be reset ten times a second and sit frozen at
         its first frame — the single thing that makes the section look like it
         is reloading rather than working. So the paint reads how far round the
         ring had got and starts the new one from the same angle. */
      var SPINNER = '.source-checks>li[data-state="waiting"] .check-mark';

      function spinnerAnimation() {
        var mark = document.querySelector(SPINNER);
        if (!mark || typeof mark.getAnimations !== "function") return null;
        return mark.getAnimations()[0] || null;
      }

      function readSpinPhase() {
        var running = spinnerAnimation();
        return running ? running.currentTime : null;
      }

      function restoreSpinPhase(phase) {
        if (phase === null || phase === undefined) return;
        var running = spinnerAnimation();
        if (running) running.currentTime = phase;
      }

      /* Re-rendering the page must not cost her what she was typing, so the
         composer's value and focus survive the swap. */
      function render() {
        var app = document.getElementById("borrower-app");
        if (!app) return;
        var composer = document.getElementById("composer-input");
        var draft = composer ? composer.value : "";
        var hadFocus = composer && document.activeElement === composer;
        var drawerComposer = document.getElementById("drawer-composer-input");
        var drawerDraft = drawerComposer ? drawerComposer.value : "";
        var drawerHadFocus = drawerComposer && document.activeElement === drawerComposer;
        /* Typing into the simulator repaints the page on every keystroke, so the
           control she is typing in has to come back focused, with the caret
           exactly where she left it. */
        var active = document.activeElement;
        var activeId = active && active.id && active !== composer && active !== drawerComposer ? active.id : null;
        var caret = null;
        if (activeId && typeof active.selectionStart === "number") {
          caret = { start: active.selectionStart, end: active.selectionEnd };
        }
        var previousBubbles = painted.bubbles;
        var scrolls = readScrollPositions();
        var spin = readSpinPhase();
        app.innerHTML = renderPage(view);
        restoreScrollPositions(scrolls);
        restoreSpinPhase(spin);
        document.body.classList.toggle("drawer-open", Boolean(view.openDocumentId));
        var next = document.getElementById("composer-input");
        if (next) {
          next.value = draft;
          if (hadFocus) next.focus();
        }
        var nextDrawer = document.getElementById("drawer-composer-input");
        if (nextDrawer) {
          nextDrawer.value = drawerDraft;
          if (drawerHadFocus) nextDrawer.focus();
        }
        if (activeId) {
          var refocus = document.getElementById(activeId);
          if (refocus) {
            refocus.focus();
            if (caret && typeof refocus.setSelectionRange === "function") {
              try {
                refocus.setSelectionRange(caret.start, caret.end);
              } catch (ignored) {
                /* Not every control has a caret to put back. */
              }
            }
          }
        }
        markFreshBubbles();
        markChangedVerdicts();
        easeProgress();
        markPhaseChange();
        var body = document.getElementById("thread-body");
        if (body && followingThread) {
          /* The scroller is already sitting where it was, so this animates the
             height of what just arrived and nothing else. It is instant when the
             thread was rebuilt from nothing — a restart, or the first paint —
             because there is no previous position to travel from. */
          var rebuilt = painted.bubbles < previousBubbles || previousBubbles === 0;
          if (rebuilt) body.style.scrollBehavior = "auto";
          body.scrollTop = body.scrollHeight;
          if (rebuilt) body.style.scrollBehavior = "";
        }
        /* A phase change is a page change. Consume the flag here — it is a
           one-shot request from the state, not a standing condition — and honour
           the reduced-motion contract by not animating the jump when asked. */
        if (view.scrollTop) {
          view = fork(view, { scrollTop: false });
          var smooth =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
              ? "auto"
              : "smooth";
          window.scrollTo({ top: 0, behavior: smooth });
        }
        var drawer = document.querySelector(".review-drawer");
        if (drawer && !drawer.contains(document.activeElement)) {
          var selected = drawer.querySelector('[role="tab"][aria-selected="true"]');
          if (selected) selected.focus();
        }
      }

      /* ------------------------------------------- painting a check in place
       *
       * A source answering changes one row and nothing else. Rebuilding the
       * whole page for it is what makes the section look like it is reloading:
       * the spinner starts over from zero every beat, the row that just
       * answered arrives already green instead of turning green, and every
       * scroller and focused control on the page is torn down and put back.
       * So a beat that is nothing but a check answering is painted onto the
       * rows that are already on screen, and the rest of the page is left
       * alone. It is a strict optimisation of `render()` — when the beat turns
       * out to have changed anything else, the full paint runs instead.
       */

      /* Everything a view carries that is not the checks and not the cursor. A
         beat that leaves all of it alone has changed nothing outside the list. */
      var VIEW_SCALARS = [
        "phase",
        "statusKey",
        "escalated",
        "finished",
        "paused",
        "started",
        "speed",
        "openDocumentId",
        "drawerTab",
        "notificationsOpen",
        "scrollTop",
        "currentDocumentId",
        "state"
      ];

      function onlyChecksChanged(before, after) {
        if (!before || !after) return false;
        /* The list only exists on the simulator. */
        if (before.phase !== "simulate") return false;
        if (before.verified.length === after.verified.length) return false;
        var settled = VIEW_SCALARS.every(function (name) {
          return before[name] === after[name];
        });
        if (!settled) return false;
        /* These only ever grow, so a length is a difference. */
        if (before.thread.length !== after.thread.length) return false;
        if (before.feed.length !== after.feed.length) return false;
        if (before.analysing.length !== after.analysing.length) return false;
        if (before.seenNotifications.length !== after.seenNotifications.length) return false;
        return FORM_FIELDS.every(function (field) {
          return String(before.form[field]) === String(after.form[field]);
        });
      }

      function setText(node, value) {
        if (node && node.textContent !== value) node.textContent = value;
      }

      /**
       * Move the current states onto the rows already on screen. Returns false
       * when the list is not there to paint, or is not the list this state
       * describes — the caller then falls back to a full render.
       */
      function paintChecks(nextView) {
        var list = document.getElementById("verification-list");
        if (!list || list.children.length !== VERIFY_CHECKS.length) return false;
        var f = figures(nextView);
        var states = verifyRowStates(nextView, f);
        var params = checkParams(f);
        var rows = [].slice.call(list.children);
        /* Read the whole list before writing to any of it, so a mismatch is
           found before the page has been half-painted. */
        if (
          !rows.every(function (row, position) {
            return row.dataset.checkId === VERIFY_CHECKS[position];
          })
        ) {
          return false;
        }
        rows.forEach(function (row, position) {
          var state = states[position];
          if (row.dataset.state !== state) row.dataset.state = state;
          setText(row.querySelector(".check-mark"), state === "done" ? "✓" : "");
          setText(
            row.querySelector(".check-result"),
            checkResult(VERIFY_CHECKS[position], state, params)
          );
        });
        /* The panel beside the list reads the same checks. It only moves on the
           ninth answer, and that beat is a full paint. */
        return !allChecksDone(nextView, f);
      }

      function update(nextView) {
        var previous = view;
        view = nextView;
        if (!onlyChecksChanged(previous, nextView) || !paintChecks(nextView)) render();
        persist();
      }

      function autoplay() {
        play(view, {
          current: function () {
            return view;
          },
          onStep: function (next) {
            /* The narrative's own verify beats get the in-place paint too: the
               script asks the nine sources the same way the fill does. */
            update(next);
            if (next.finished) announce("borrower.control.finished");
          }
        });
      }

      /* ==================================================== the demo fills it in
       *
       * `Use demo data` does not paste the answers in. It fills the form the way
       * a person would: it scrolls to the question, picks the tile, types the
       * value a character at a time, and only then presses the button — because
       * the point being demonstrated is that the bank checks each answer at the
       * source *as it is given*, and an instant paste shows none of that.
       *
       * It runs through the same `later` seam as the narrative, so the speed
       * control governs it and pausing stops it where it stands.
       */
      var FILL_SCRIPT = [
        { kind: "pick", field: "propertyType", value: "house", delay: 620 },
        { kind: "pick", field: "condition", value: "new", delay: 560 },
        { kind: "type", field: "propertyUF", charDelay: 95, delay: 620 },
        { kind: "type", field: "downPct", charDelay: 110, delay: 620 },
        { kind: "type", field: "idNumber", charDelay: 62, delay: 640 },
        { kind: "type", field: "dateOfBirth", charDelay: 62, delay: 620 },
        { kind: "type", field: "incomeCLP", charDelay: 68, delay: 760 },
        { kind: "type", field: "streetAddress", charDelay: 55, delay: 620 },
        { kind: "pick", field: "provincia", value: "San José", delay: 500 },
        { kind: "type", field: "canton", charDelay: 62, delay: 560 },
        { kind: "type", field: "distrito", charDelay: 62, delay: 560 },
        { kind: "pick", field: "termYears", value: String(credit.TERM_YEARS), delay: 900 },
        /* The nine sources, asked one at a time and watched answering. This is
           the claim the whole first phase exists to make, so it is given room:
           the button below it stays dark until the last one comes back. */
        { kind: "verify", checkDelay: 700, delay: 1400 },
        { kind: "submit", delay: 5000 },
        { kind: "handover", delay: 0 }
      ];

      var fillCursor = -1;
      /* Where a paused fill will resume from. */
      var pausedFillCursor = -1;
      /* Set while the demo itself is writing into a field, so the input handler
         can tell its own keystrokes from hers. */
      var fillTyping = false;

      function fillRunning() {
        return fillCursor >= 0;
      }

      function stopFill() {
        fillCursor = -1;
      }

      /* Where the narrative should pick the story up once the form is answered:
         the beat that opens the documents phase, found rather than counted. */
      function scriptIndexOfPhase(phase) {
        for (var index = 0; index < SCRIPT.length; index += 1) {
          if (SCRIPT[index].kind === "status" && SCRIPT[index].phase === phase) return index;
        }
        return 0;
      }

      function fillDelay(ms) {
        var speed = SPEEDS.indexOf(view.speed) === -1 ? 1 : view.speed;
        return Math.max(1, Math.round(ms / speed));
      }

      /* Bring the control being answered into view, the way a hand would scroll
         to it, and honour the reduced-motion contract while doing it. */
      function revealControl(id) {
        var node = document.getElementById(id);
        if (!node || typeof node.scrollIntoView !== "function") return node;
        var reduced =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        node.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
        return node;
      }

      function stepFill(index) {
        if (!fillRunning() || fillCursor !== index) return;
        var step = FILL_SCRIPT[index];
        if (!step) {
          stopFill();
          return;
        }

        if (step.kind === "pick") {
          var tile = revealControl("tile-" + step.field + "-" + step.value);
          if (tile) tile.classList.add("pressing");
          update(setFormField(view, step.field, step.value));
          return queueFill(index + 1, step.delay);
        }

        if (step.kind === "type") {
          var target = demoForm()[step.field] || "";
          var input = revealControl("field-" + step.field);
          if (input) input.focus();
          return typeInto(index, step, target, 0);
        }

        if (step.kind === "verify") {
          revealControl("verification-list");
          return verifyNext(index, step, 0);
        }

        if (step.kind === "submit") {
          var cta = revealControl("sim-submit");
          if (cta) cta.classList.add("pressing");
          update(goToPhase(view, "pre-approval"));
          return queueFill(index + 1, step.delay);
        }

        /* Hand the story over: the nine source checks are answered by the form,
           so the narrative starts at the beat that opens the conversation. */
        stopFill();
        update(
          fork(view, {
            cursor: scriptIndexOfPhase("documents"),
            verified: VERIFY_CHECKS.slice(),
            paused: false,
            started: true
          })
        );
        autoplay();
      }

      /* One source, then the next. Each answer lands in `verified`, which is what
         turns its spinner into a green disc. */
      function verifyNext(index, step, position) {
        if (!fillRunning() || fillCursor !== index) return;
        var checkId = VERIFY_CHECKS[position];
        if (!checkId) return queueFill(index + 1, step.delay);
        if (view.verified.indexOf(checkId) === -1) {
          update(fork(view, { verified: view.verified.concat([checkId]) }));
        }
        later(fillDelay(step.checkDelay), function () {
          verifyNext(index, step, position + 1);
        });
      }

      /* One character, then the next: the state changes per keystroke, exactly as
         it would if she were typing, so everything downstream recomputes with it. */
      function typeInto(index, step, target, position) {
        if (!fillRunning() || fillCursor !== index) return;
        var typed = target.slice(0, position + 1);
        fillTyping = true;
        update(setFormField(view, step.field, typed));
        fillTyping = false;
        var input = document.getElementById("field-" + step.field);
        if (input) {
          input.focus();
          if (typeof input.setSelectionRange === "function") {
            try {
              input.setSelectionRange(typed.length, typed.length);
            } catch (ignored) {
              /* Some controls have no caret to place. */
            }
          }
        }
        if (position + 1 >= target.length) return queueFill(index + 1, step.delay);
        later(fillDelay(step.charDelay), function () {
          typeInto(index, step, target, position + 1);
        });
      }

      function queueFill(index, delay) {
        fillCursor = index;
        later(fillDelay(delay), function () {
          stepFill(index);
        });
      }

      function startFill() {
        stopAutoplay();
        assistantTyping = false;
        followingThread = true;
        painted = { bubbles: 0, phase: null, verdicts: {}, progress: null, feed: 0 };
        update(fork(restart(), { started: true, paused: false }));
        queueFill(0, 500);
      }

      function onDemoAction(action) {
        /* Fill the form with this case's answers and play the story from the
           top. It is the demo's front door: everything else on the page works
           without it, and nothing at all happens before it. */
        if (action === "demo-data") {
          startFill();
          announce("borrower.control.playing");
          return;
        }
        if (action === "play-pause") {
          /* "Load demo data" already starts the story playing, so this
             control reads "Pause" from the first frame of the fill — but a
             click aimed at *starting* the demo, landing while she is still
             getting her bearings, hits this same control and pauses what it
             meant to start. FILL_SCRIPT's first few beats (the two property
             tiles and the first typed field) cover the reaction time that
             takes; a click during them is read as "start", not "pause". Once
             she is a few fields in, the story is plainly running and this
             control goes back to meaning pause. */
          if (fillRunning() && !view.paused && fillCursor <= 2) {
            return;
          }
          stopAutoplay();
          /* Pausing mid-fill stops the hand where it is; playing again from a
             half-filled form finishes it rather than starting over. */
          if (fillRunning() && !view.paused) {
            var resumeAt = fillCursor;
            stopFill();
            update(setPaused(view, true));
            announce(statusAnnouncementKey());
            pausedFillCursor = resumeAt;
            return;
          }
          if (pausedFillCursor >= 0 && view.paused) {
            var pickUpAt = pausedFillCursor;
            pausedFillCursor = -1;
            update(fork(setPaused(view, false), { started: true }));
            announce("borrower.control.playing");
            queueFill(pickUpAt, 300);
            return;
          }
          /* Playing the story with an empty form would have it quote figures
             nobody typed, so pressing Play on an unfilled page loads the demo
             applicant's answers first — the same thing the demo button does. */
          var about =
            view.paused && !formReady(view.form) ? useDemoData(view) : view;
          update(fork(setPaused(about, !view.paused), { started: true }));
          announce(statusAnnouncementKey());
          if (!view.paused) autoplay();
          return;
        }
        if (action === "restart") {
          stopAutoplay();
          /* Whatever was being filled in is abandoned; the page starts over. */
          if (fillRunning() || pausedFillCursor >= 0) {
            stopFill();
            pausedFillCursor = -1;
            startFill();
            announce("borrower.control.playing");
            return;
          }
          /* A restart is not a change to animate: the page is being rebuilt from
             nothing, so the paint forgets what it had drawn. */
          assistantTyping = false;
          followingThread = true;
          painted = { bubbles: 0, phase: null, verdicts: {}, progress: null, feed: 0 };
          /* Replays what is loaded rather than emptying the page: the form she
             is working in survives, and the story only runs again if it was
             running in the first place. */
          var wasStarted = view.started;
          update(
            fork(restart(), {
              form: view.form,
              started: wasStarted,
              paused: !wasStarted
            })
          );
          announce(statusAnnouncementKey());
          if (wasStarted) autoplay();
        }
      }

      function onClick(event) {
        var control = event.target.closest("button, a");
        /* A click anywhere that is not the bell or inside its panel closes it —
           the same thing every notification tray does. */
        if (
          view.notificationsOpen &&
          !event.target.closest(".notification-bell")
        ) {
          update(toggleNotifications(view, false));
        }
        if (!control) {
          if (event.target.classList.contains("drawer-backdrop")) closeDrawer();
          return;
        }

        if (control.dataset.notifications) {
          update(toggleNotifications(view));
          var bell = document.querySelector(".bell-button");
          if (bell) bell.focus();
          return;
        }

        if (control.dataset.demoAction) {
          onDemoAction(control.dataset.demoAction);
          return;
        }
        if (control.dataset.locale) {
          if (control.dataset.locale === copy.locale()) return;
          setLocale(control.dataset.locale);
          applyShellCopy();
          render();
          announce("borrower.status.language");
          return;
        }
        if (control.dataset.moneyUnit) {
          if (control.dataset.moneyUnit === view.moneyUnit) return;
          update(fork(view, { moneyUnit: control.dataset.moneyUnit }));
          announce("borrower.status.money-" + control.dataset.moneyUnit.toLowerCase());
          return;
        }
        if (control.dataset.formField) {
          update(setFormField(view, control.dataset.formField, control.dataset.formValue));
          return;
        }
        if (control.dataset.phase) {
          /* She has taken the wheel: the demo stops filling things in. */
          stopFill();
          pausedFillCursor = -1;
          update(goToPhase(view, control.dataset.phase));
          return;
        }
        if (control.dataset.documentId) {
          restoreFocusTo = control;
          update(openDocument(view, control.dataset.documentId));
          return;
        }
        if (control.dataset.previewDocument) {
          restoreFocusTo = document.querySelector(".bell-button") || control;
          update(openDocumentPreview(view, control.dataset.previewDocument));
          return;
        }
        if (control.dataset.drawerTab) {
          update(setDrawerTab(view, control.dataset.drawerTab));
          return;
        }
        if (control.dataset.drawerAction === "close") closeDrawer();
        if (control.dataset.verifyAddress !== undefined) {
          if (view.addressVerifying || view.addressVerified) return;
          update(fork(view, { addressVerifying: true }));
          /* A stand-in for a real address lookup: a real integration would call
             Google Maps/Places from the server before the case moves on. */
          later(700, function () {
            update(fork(view, { addressVerifying: false, addressVerified: true }));
          });
          return;
        }
        if (control.dataset.introCallSlot) {
          update(fork(view, { introCallSlot: control.dataset.introCallSlot }));
          return;
        }
      }

      /* Every keystroke in the simulator is state: the summary, the affordability
         bar and the source checks beside it recompute from it as she types. */
      function onInput(event) {
        var field = event.target && event.target.dataset ? event.target.dataset.formInput : null;
        if (!field) return;
        /* Typing over the demo's shoulder takes the form back from it. */
        if (fillRunning() && !fillTyping) {
          stopFill();
          pausedFillCursor = -1;
        }
        update(setFormField(view, field, event.target.value));
      }

      /* The speed is a select rather than three buttons, so it arrives as a
         change. Focus survives the repaint the same way the composer's does. */
      function onChange(event) {
        var select = event.target;
        if (!select) return;
        if (select.dataset.formInput) {
          update(setFormField(view, select.dataset.formInput, select.value));
          return;
        }
        if (select.dataset.speedSelect === undefined) return;
        update(setSpeed(view, Number(select.value)));
        var again = document.getElementById("speed-select");
        if (again) again.focus();
      }

      function closeDrawer() {
        update(closeDocument(view));
        if (restoreFocusTo && restoreFocusTo.isConnected) restoreFocusTo.focus();
        restoreFocusTo = null;
      }

      function onDrawerSubmit(event) {
        event.preventDefault();
        var documentId = event.target.dataset.documentId;
        var input = document.getElementById("drawer-composer-input");
        var result = sendDrawerMessage(view, documentId, input ? input.value : "", {
          storage: bridgeStorage()
        });
        if (result.changed && input) input.value = "";
        update(result.viewState);
        announce(result.announcement.key, result.announcement.params);
        /* It reached the document's record either way; it may not have reached
           the other tab. */
        if (result.bridged === false) announceViewOnly();
        var refocus = document.getElementById("drawer-composer-input");
        if (refocus) refocus.focus();
      }

      function onSubmit(event) {
        if (event.target && event.target.id === "drawer-composer") {
          onDrawerSubmit(event);
          return;
        }
        if (!event.target || event.target.id !== "composer") return;
        event.preventDefault();
        var input = document.getElementById("composer-input");
        var result = sendBorrowerMessage(view, input ? input.value : "", {
          storage: bridgeStorage(),
          /* The assistant answers her a beat later, on its own — through the
             page's one scheduler, so the demo speed control governs it like
             everything else and a test can drive it without a clock. It reads
             the state as it is when the beat lands, not as it was at the click. */
          later: function (ms, run) {
            return later(Math.round(ms / (SPEEDS.indexOf(view.speed) === -1 ? 1 : view.speed)), run);
          },
          readState: function () {
            return view;
          },
          onReply: function (replied) {
            assistantTyping = false;
            update(replied);
          }
        });
        if (result.changed) assistantTyping = true;
        if (result.changed && input) input.value = "";
        update(result.viewState);
        announce(result.announcement.key, result.announcement.params);
        /* It reached her thread either way; it may not have reached the other tab. */
        if (result.bridged === false) announceViewOnly();
        var refocus = document.getElementById("composer-input");
        if (refocus) refocus.focus();
      }

      function onKeydown(event) {
        /* Escape closes the tray before it reaches the drawer's own handler. */
        if (event.key === "Escape" && view.notificationsOpen && !view.openDocumentId) {
          update(toggleNotifications(view, false));
          var bell = document.querySelector(".bell-button");
          if (bell) bell.focus();
          return;
        }
        handleDrawerKeydown(event, {
          isOpen: Boolean(view.openDocumentId),
          container: document.querySelector(".review-drawer"),
          activeElement: document.activeElement,
          close: closeDrawer
        });
      }

      /* The other tab wrote to the bridge. Absorb what is new and re-render, so a
         lender reply appears in the thread within a second (§7). */
      function onStorage(event) {
        if (!event || event.key !== MESSAGE_BRIDGE_KEY) return;
        var result = bridgeAbsorb(view, { storage: bridgeStorage() });
        if (!result.changed) return;
        update(result.viewState);
        announce(result.announcement.key, result.announcement.params);
      }

      /* The shell's own strings — title, lang, the skip link — sit outside every
         render function, so a language change refreshes them from here. */
      function applyShellCopy() {
        document.title = t("borrower.page-title");
        if (document.documentElement) document.documentElement.lang = copy.locale();
        [].slice.call(document.querySelectorAll("[data-copy]")).forEach(function (node) {
          node.textContent = t(node.getAttribute("data-copy"));
        });
      }

      function init() {
        /* Whatever the other surface was last read in, before anything prints. */
        loadLocale();
        applyShellCopy();
        var app = document.getElementById("borrower-app");
        app.addEventListener("click", onClick);
        app.addEventListener("submit", onSubmit);
        app.addEventListener("change", onChange);
        app.addEventListener("input", onInput);
        /* Captured, because scroll gestures do not bubble and the thread is a
           new element after every beat. */
        app.addEventListener("wheel", onThreadGesture, { passive: true, capture: true });
        app.addEventListener("touchmove", onThreadGesture, { passive: true, capture: true });
        document.addEventListener("keydown", onKeydown);
        if (globalThis.addEventListener) globalThis.addEventListener("storage", onStorage);
        var arrived = null;
        if (loadedView.resumed) {
          /* Resuming a real session: a reply sent while this tab was closed
             is still waiting on the bridge, unabsorbed, and belongs on the
             page she is about to see — not thrown away the way a fresh run's
             bridge is (§ her place on the page). */
          var backlog = bridgeAbsorb(view, { storage: bridgeStorage() });
          if (backlog.changed) {
            view = backlog.viewState;
            arrived = backlog.announcement;
          }
        } else {
          /* A genuinely fresh run: whatever a previous run left on the
             bridge is not this run's thread. */
          bridgeClear(bridgeStorage());
        }
        render();
        persist();
        /* Whichever she should hear first: a reply that arrived while she
           was away, or — the ordinary case — that the page is ready. */
        if (arrived) announce(arrived.key, arrived.params);
        else announce("borrower.control.idle");
      }

      /* ================================================================== api */

      globalThis.FalabellaBorrower = {
        CASE_ID: CASE_ID,
        CASE_STORAGE_KEY: CASE_STORAGE_KEY,
        VIEW_STORAGE_KEY: VIEW_STORAGE_KEY,
        BORROWER_VIEW_VERSION: BORROWER_VIEW_VERSION,
        MESSAGE_BRIDGE_KEY: MESSAGE_BRIDGE_KEY,
        CASE_RESET_KEY: CASE_RESET_KEY,
        BRIDGE_LIMIT: BRIDGE_LIMIT,
        BRIDGE_ROLE: BRIDGE_ROLE,
        PHASES: PHASES,
        money: money,
        SPEEDS: SPEEDS,
        STEP_KINDS: STEP_KINDS,
        VERIFY_CHECKS: VERIFY_CHECKS,
        SCRIPT: SCRIPT,

        initialViewState: initialViewState,
        applyStep: applyStep,
        advance: advance,
        runScript: runScript,

        renderPage: renderPage,
        renderTopbar: renderTopbar,
        renderPhaseRail: renderPhaseRail,
        renderDemoControls: renderDemoControls,
        renderSimulator: renderSimulator,
        renderPreApproval: renderPreApproval,
        renderIntroCall: renderIntroCall,
        renderThread: renderThread,
        renderChecklist: renderChecklist,
        renderDrawer: renderDrawer,
        renderDrawerAssistant: renderDrawerAssistant,

        goToPhase: goToPhase,
        assistantReplyKey: assistantReplyKey,
        assistantReplies: assistantReplies,
        ASSISTANT_REPLY_MS: ASSISTANT_REPLY_MS,
        openDocument: openDocument,
        openDocumentPreview: openDocumentPreview,
        closeDocument: closeDocument,
        setDrawerTab: setDrawerTab,
        toggleNotifications: toggleNotifications,
        trapFocus: trapFocus,
        handleDrawerKeydown: handleDrawerKeydown,
        sendBorrowerMessage: sendBorrowerMessage,
        sendDrawerMessage: sendDrawerMessage,

        emptyForm: emptyForm,
        demoForm: demoForm,
        setFormField: setFormField,
        useDemoData: useDemoData,
        formReady: formReady,
        formSatisfies: formSatisfies,
        verifyStarted: verifyStarted,
        verifyRowStates: verifyRowStates,
        renderVerifyChecks: renderVerifyChecks,
        figures: figures,

        setPaused: setPaused,
        setSpeed: setSpeed,
        setLocale: setLocale,
        restart: restart,

        /* ---------------------------------------------------------- the bridge */
        loadCase: loadCase,
        saveCase: saveCase,
        loadView: loadView,
        saveView: saveView,
        clearView: clearView,
        applyBridgeMemory: applyBridgeMemory,
        bridgeRead: bridgeRead,
        bridgeSend: bridgeSend,
        bridgeAbsorb: bridgeAbsorb,
        bridgeClear: bridgeClear,
        viewOnlyAnnouncement: viewOnlyAnnouncement,
        resetViewOnlyNotice: resetViewOnlyNotice,

        play: play,
        later: later,
        setLater: setLater,
        DEFAULT_LATER: DEFAULT_LATER,

        escapeHtml: escapeHtml,
        t: t
      };

      if (typeof document !== "undefined") init();
    })();
  </script>
</body>
</html>
