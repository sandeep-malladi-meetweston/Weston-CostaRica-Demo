<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The brand name reads the same in every locale; the rest of the title is
       copy, so init() sets it from FalabellaCopy (§8). -->
  <title>BancoBCR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    /* Silver Hill's design system — type scale, spacing, radii, shadows and
       neutrals verbatim — with BancoBCR's accent in place of the orange.
       Local font fallbacks are mandatory: the demo must survive being opened
       with no network. */
    :root{
      /* BancoBCR */
      --brand:#007a33;--brand-lime:#c3d600;--brand-deep:#154734;--brand-wash:#eff8f2;--brand-rule:#bfe0cc;
      /* Silver Hill structural neutrals — verbatim */
      --ink:#18212b;--slate:#52606d;--muted:#7b8794;--paper:#fff;--shell:#f3f5f7;--rule:#dbe1e7;--ok:#137a4a;--danger:#b42318;--warn:#8a5a00;
      --display:Archivo,"Segoe UI",Arial,sans-serif;--body:"Public Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace
    }
    *{box-sizing:border-box}body{margin:0;background:var(--shell);color:var(--ink);font:14px/1.45 var(--body)}button,input,select,textarea{font:inherit}button{cursor:pointer}[inert]{pointer-events:none;user-select:none}.skip-link{position:absolute;left:-999px}.skip-link:focus{left:12px;top:12px;z-index:100;background:#fff;padding:8px}
    .topbar{position:sticky;top:0;z-index:10;height:64px;display:flex;align-items:center;gap:16px;padding:0 22px;background:var(--paper);border-bottom:1px solid var(--rule)}
    .topbar-logo-button{display:inline-flex;align-items:center;padding:0;border:0;border-radius:6px;background:none}.topbar-logo-button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}.topbar-wordmark{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--brand-deep)}.portal-label{padding-left:16px;border-left:1px solid var(--rule);font-family:var(--display);font-weight:600}.global-search{margin-left:auto;width:min(280px,26vw)}.demo-role-switch{border:1px solid var(--brand-rule);border-radius:6px;padding:8px 11px;background:var(--brand-wash);color:var(--brand-deep);font-size:12px;font-weight:600;text-decoration:none}/* Language and unit are one cluster: a single border round both, a hairline
   between them, and the groups inside stripped of their own boxes. Two
   identical bordered pills side by side read as four loose buttons. */
.control-cluster{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;height:36px;padding:3px;border:1px solid var(--rule);border-radius:8px;background:var(--shell)}
.control-divider{flex:0 0 auto;width:1px;height:17px;background:var(--rule)}
.money-toggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:1px;padding:0;border:0;border-radius:0;background:none}
.language-toggle button{min-width:29px;font:600 11px var(--mono);letter-spacing:.03em}
.money-toggle button{min-width:31px;height:28px;padding:0 8px;border:0;border-radius:5px;background:transparent;color:var(--slate);font:600 11.5px var(--display)}
.money-toggle button:hover{color:var(--ink);background:#fff}
.money-toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}
    .portal-layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 64px)}.portfolio-nav{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto;padding:22px 14px;background:var(--paper);border-right:1px solid var(--rule)}.nav-filter{width:100%;display:flex;justify-content:space-between;padding:10px;border:0;border-radius:7px;background:transparent;color:var(--slate);text-align:left}.nav-filter[aria-pressed="true"]{background:var(--ink);color:#fff}.nav-filter.attention{color:var(--brand-deep);font-weight:600}
    .portal-main{min-width:0;padding:28px}.page-heading{display:flex;justify-content:space-between;align-items:end;gap:18px}.page-heading h1{margin:4px 0 0;font:600 34px/1 var(--display);letter-spacing:-.05em}/* ---- the three tiles, sized for dollars ----
       A portfolio total can run to seven figures in US dollars, so a tile fixed
       to a narrow width would clip the number rather than shrink around it —
       the worst of the three possible outcomes: a wrong number that looks like
       a number. The columns grow to their content with a floor instead.
       Tabular figures keep the three totals aligned with each other. */
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(150px,max-content));gap:12px;margin:20px 0}
    .metric{padding:14px;background:var(--paper);border:1px solid var(--rule);border-radius:9px}
    .metric.attention{border-color:var(--brand-rule);background:var(--brand-wash)}
    .metric-label{display:block;color:var(--muted);font:600 10px var(--mono);text-transform:uppercase;white-space:nowrap}
    .metric-value{display:block;margin-top:5px;font:600 24px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
    .board-toolbar{display:flex;align-items:end;gap:10px;margin-bottom:12px}.board-toolbar label{display:grid;gap:4px;color:var(--slate);font-size:11px}.board-toolbar select,.global-search{height:38px;border:1px solid #cbd4dc;border-radius:6px;background:#fff;padding:0 10px}.loan-board{display:grid;grid-template-columns:repeat(7,minmax(172px,1fr));gap:12px;overflow-x:auto;padding-bottom:16px}.stage-column{min-width:180px}.stage-heading{display:flex;justify-content:space-between;min-height:36px;color:var(--slate);font:600 10px var(--mono);text-transform:uppercase}.stage-count{height:max-content;padding:2px 6px;border-radius:9px;background:#e6ebee}
    /* The underwriting corner flag. Absolute in the card's top right, and the
       card gains a right inset while it is there so a long borrower name runs
       under it rather than into it. */
    .loan-card{position:relative}
    .loan-card.has-flag .loan-case,.loan-card.has-flag .loan-borrower{padding-right:104px}
    .pending-flag{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:4px;max-width:100px;padding:3px 6px;border:1px solid #e2c98f;border-radius:10px;background:#fdf6e3;color:#8a6a12;font:600 9.5px/1.25 var(--display);text-align:right}
    .pending-flag[data-pending~="title"][data-pending~="inspection"]{border-color:#e0b3b3;background:#fbf0f0;color:#9a3d3d}
    .loan-card{width:100%;display:block;margin:0 0 9px;padding:12px;border:1px solid #d5dde3;border-radius:8px;background:#fff;color:var(--ink);text-align:left;box-shadow:0 1px 3px rgba(24,33,43,.04)}.loan-card:hover{border-color:#aebac4;box-shadow:0 5px 14px rgba(24,33,43,.08)}.loan-card.needs-review{border-left:4px solid var(--brand-lime);padding-left:9px}.loan-case{display:block;color:var(--muted);font:600 10px var(--mono);text-transform:uppercase}.loan-borrower{display:block;margin-top:3px;font-weight:700}.loan-meta,.loan-substatus,.loan-deed{display:block;margin-top:4px;color:var(--slate);font-size:11px}.review-reason{display:inline-flex;gap:4px;align-items:center;margin-top:8px;padding:3px 6px;border-radius:10px;background:var(--brand-wash);color:var(--brand-deep);font-size:10px;font-weight:600}.loan-borrower,.loan-meta,.review-reason,.record-message p{overflow-wrap:anywhere}
    .empty-column{padding:14px;border:1px dashed #cbd4dc;border-radius:8px;color:var(--muted);font-size:11px;text-align:center}.empty-search{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:#fff}.empty-search button{border:1px solid var(--ink);border-radius:6px;padding:7px 10px;background:var(--ink);color:#fff}button:disabled,textarea:disabled{cursor:not-allowed;opacity:.52}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
    .nav-filter:hover{background:#f1f4f6}.nav-filter[aria-pressed="true"]:hover{background:var(--ink)}.demo-role-switch:hover{background:#dff0e6}.board-toolbar select:hover,.global-search:hover{border-color:#aebac4}
    .workspace-backdrop{position:fixed;inset:0;z-index:30;background:rgba(16,20,24,.42)}.loan-workspace{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(1040px,100%);display:flex;background:var(--paper);border-left:1px solid var(--rule);box-shadow:-18px 0 45px rgba(16,20,24,.16);transition:transform .2s ease}.workspace-main{flex:1;min-width:0;display:flex;flex-direction:column}.loan-workspace.full-screen{left:0;width:100%;border-left:0}/* ---- who this case is, and the controls, in one bar ----
       The header is an identity block and a control block, and only the first of
       them is the reason anyone opened the case. Left unweighted the two shrank
       in proportion to their content, so "Aconcagua project, Maipú" broke over
       two lines and the borrower line broke again — with 600px of empty header
       beside them — because the controls happened to be wider. The identity
       block now takes the slack (`flex:1`) and the controls take exactly what
       they need and no more (`flex:0 0 auto`).

       Spanish is the wider of the two locales, so the row is sized for
       "Requiere revisión", not "Needs review". Below that the controls wrap to
       a second line rather than push the title, which is the right thing to
       give up: a title you cannot read is worse than a control one line lower. */
    .workspace-header{display:flex;justify-content:space-between;gap:14px 18px;padding:22px 24px;border-bottom:1px solid var(--rule)}
    .workspace-header>div:first-child{flex:1 1 auto;min-width:0}
    .workspace-header h2{margin:4px 0;font:600 27px var(--display);letter-spacing:-.04em;overflow-wrap:anywhere}
    .workspace-header p{margin:0;color:var(--slate)}
    .workspace-actions{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end;gap:7px}
    @media(max-width:820px){.workspace-header{flex-wrap:wrap}.workspace-actions{width:100%;justify-content:flex-start}}.workspace-actions button,.back-board,.workspace-drive-link{min-width:36px;height:36px;border:1px solid var(--rule);border-radius:6px;background:#fff}.workspace-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.workspace-chips span{padding:4px 7px;border-radius:10px;background:#edf1f4;font-size:10px}.workspace-chips .attention-chip{background:var(--brand-wash);color:var(--brand-deep)}
    /* The drive link, an icon button beside the notifications alert: same
       square shape as expand/close, so it reads as one row of case actions
       rather than a link dropped in among buttons. */
    .workspace-drive-link{display:inline-flex;align-items:center;justify-content:center;color:var(--slate);text-decoration:none}
    .workspace-drive-link:hover{background:var(--shell);border-color:#aebac4;color:var(--ink)}
    .workspace-drive-link svg{width:15px;height:15px}
    .workspace-tabs{display:flex;padding:0 24px;border-bottom:1px solid var(--rule)}.workspace-tabs button{display:inline-flex;align-items:center;padding:13px 11px;border:0;border-bottom:3px solid transparent;background:#fff;color:var(--slate);font-weight:600}.workspace-tabs button[aria-selected="true"]{border-bottom-color:var(--brand);color:var(--ink)}
    /* A message waiting on a reply, said on the tab that answers it — the same
       small round count a chat app puts on an unread thread, not the amber
       "needs a decision" alert this tab deliberately carries none of. */
    .tab-badge{display:inline-grid;place-items:center;min-width:16px;height:16px;margin-left:6px;padding:0 4px;border-radius:999px;background:var(--brand);color:#fff;font:700 10px var(--mono);line-height:1}/* The last inch of the panel is under the launcher, so the scroll ends above
       it rather than behind it. */
    .workspace-panel{flex:1;overflow:auto;padding:22px 24px 88px}.workspace-body{flex:1;display:flex;min-height:0}.workspace-section{margin-bottom:24px}.workspace-section h3,.record-card h3{margin:0 0 10px;font:600 15px var(--display)}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.review-queue{margin:2px 0 10px;color:var(--slate);font-size:11.5px}.no-action{margin:10px 0;padding:14px;border:1px solid var(--rule);border-radius:9px;background:var(--shell)}.no-action p{margin:6px 0 0;color:var(--slate)}.review-queue-list{border:1px solid var(--brand-rule);border-radius:9px;overflow:hidden;background:var(--brand-wash)}.review-item{margin:0;padding:12px 14px}.review-item+.review-item{border-top:1px solid var(--brand-rule)}.review-item-heading{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 9px;color:var(--brand-deep)}.review-item-heading strong{font:600 13.5px var(--display)}.review-item-where{color:var(--slate);font-size:11.5px;overflow-wrap:anywhere}.review-item-detail{margin:4px 0 0;color:var(--slate);font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}.review-item .review-queue-link{display:block;margin:8px 0 0}.review-item textarea{flex:1;min-width:0;height:34px;min-height:34px;margin:0;padding:7px 9px;border:1px solid #cbd4dc;border-radius:6px;resize:none}.review-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}.review-item .review-actions{align-items:center;justify-content:flex-start;margin-top:9px}/* ---- the decision on an open item ----
       A select and a short button on one line, where two full-width buttons
       used to stack down the rail. The select takes the slack because it is the
       part that carries words; the button is the same size whatever is chosen.
       The condition field sits between the reply box and the decision, visible
       only for the outcome that requires it. */
    .review-condition{margin-top:7px}
    .review-condition input{width:100%;padding:7px 9px;border:1px solid #cbd4dc;border-radius:6px;background:#fff}
    .review-decide{display:flex;align-items:center;gap:7px;margin-top:8px}
    .review-decide select{flex:1 1 auto;min-width:0;height:34px;padding:6px 9px;border:1px solid #cbd4dc;border-radius:6px;background:#fff;font-size:12px}
    .review-decide button{flex:0 0 auto;height:34px;padding:0 14px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
    .review-decide button:hover{background:#000}.review-actions button{flex:0 0 auto;padding:8px 10px;border:1px solid var(--ink);border-radius:6px;background:#fff;font-size:12px;white-space:nowrap}.review-actions button:last-child,.review-actions button.primary{background:var(--ink);color:#fff}.readonly-note{color:var(--muted);font-size:11px}.snapshot-grid,.application-record{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden}.snapshot-grid div,.application-record div{padding:11px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}dt{color:var(--muted);font:500 10px var(--mono);text-transform:uppercase}dd{margin:4px 0 0;font-weight:600}.workspace-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.record-card{padding:14px;border:1px solid var(--rule);border-radius:8px}.record-card p{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.record-card span{color:var(--slate)}/* The status is one or two short words; the label beside it is the long
       side. Left to shrink evenly, "Sin subir" broke into "Sin / subir" while
       the label above it still had room — so the value holds its width and the
       label takes the wrapping. */
    .record-card strong{flex:0 0 auto;text-align:right;white-space:nowrap}
    .record-card strong small{display:block;margin-top:2px;color:var(--muted);font:400 11px var(--mono);white-space:normal}.document-records{display:grid;gap:10px}.document-record{overflow:hidden;border:1px solid var(--rule);border-radius:8px;background:#fff}.document-summary{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:14px;cursor:pointer;list-style:none}.document-summary::-webkit-details-marker{display:none}.document-summary::marker{content:""}.document-summary:hover{background:var(--shell)}.document-record[open] .document-summary{border-bottom:1px solid var(--rule)}.document-title{display:grid;min-width:0}.document-title strong{font:600 15px var(--display)}.document-title small{color:var(--slate);overflow-wrap:anywhere}.document-chevron{color:var(--muted);transition:transform .15s ease}.document-record[open] .document-chevron{transform:rotate(180deg)}.document-record-body{padding:4px 14px 14px}.verdict.accepted,.verdict.accepted-with-condition{color:var(--ok)}.verdict.rejected,.review-checks [data-check-status="mismatch"],.review-checks [data-check-status="missing"]{color:var(--danger)}.verdict.under-review{color:var(--warn)}.review-checks{list-style:none;margin:0;padding:0}.review-checks>li{padding:9px 0;border-bottom:1px solid #edf0f2}.review-checks>li>div:first-child{display:flex;justify-content:space-between;gap:12px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.comparison p{margin:0;padding:8px;border-radius:6px;background:var(--shell)}.comparison strong{overflow-wrap:anywhere}.comparison span{display:block;color:var(--muted);font-size:10px}.activity-row,.history-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0f2}.record-message{margin:8px 0;padding:10px;border-radius:8px;background:var(--shell)}.record-message.borrower{margin-left:12%;background:var(--ink);color:#fff}.audit-list{list-style:none;margin:0;padding:0}.audit-list li{display:grid;grid-template-columns:10px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid #edf0f2}.audit-marker{width:7px;height:7px;margin-top:5px;border-radius:50%;background:var(--brand)}.audit-list li.audit-assistant .audit-marker{background:var(--brand-lime)}.audit-list li.audit-lender .audit-marker{background:var(--ink)}.audit-list li.audit-system .audit-marker{background:#c3ccd4}.audit-list li p{margin:3px 0 0;color:var(--slate);font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}.audit-list li div{overflow-wrap:anywhere}body.workspace-open{overflow:hidden}.workspace-panel,.portal-main,.review-item,.application-record>div,.document-record,.history-row>*,.activity-row>*,.audit-list li>*{min-width:0}.history-row strong{overflow-wrap:anywhere}.loan-card,.nav-filter,.demo-role-switch{transition:border-color .15s ease,background-color .15s ease,box-shadow .15s ease}#lender-status{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    /* Domain additions in the same idiom: the risk tab, the conditions gate, the
       source checks, and the signing sheet the reference has no equivalent of. */
    .risk-bar{height:10px;margin:7px 0 4px;border-radius:6px;background:#e6ebee;overflow:hidden}.risk-bar-fill{display:block;height:100%;border-radius:6px;background:var(--brand)}.risk-bar-fill.over-cap{background:var(--danger)}.risk-row{display:flex;justify-content:space-between;gap:12px;font-size:12px}.risk-note{margin:6px 0 0;color:var(--slate);font-size:12px}.over-cap-label{color:var(--danger);font-weight:600}.policy-list,.condition-list,.source-checks{list-style:none;margin:0;padding:0}.policy-list>li,.condition-list>li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0f2}.condition-list .cleared{color:var(--ok);font-weight:600}.condition-list .open{color:var(--warn);font-weight:600}/* ---- checked at the source ----
       Each row is one fact, its issuing body, and the answer that came back.
       The three were running together on one line, so the fact now sits on its
       own line in the text face and the body underneath it in mono — the same
       label-over-provenance pairing the document checks use. The answer is a
       pill on the right rather than more grey mono, because it is the only part
       of the row a reader is scanning for. Card, not naked rules: the block is
       a closed set of seven and reads as one object. */
    .source-intro{max-width:64ch;margin:0;color:var(--slate);font-size:12.5px;line-height:1.5}
    .source-checks{margin-top:11px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);overflow:hidden}
    .source-checks>li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:11px 13px;border-bottom:1px solid #edf0f2}
    .source-checks>li:last-child{border-bottom:0}
    .source-checks>li>div{flex:1 1 200px;min-width:0}
    .source-checks strong{display:block;color:var(--ink);font:600 13px/1.35 var(--display)}
    .source-checks>li>div>span{display:block;margin-top:3px;color:var(--muted);font:400 11px/1.45 var(--mono);overflow-wrap:anywhere}
    .source-checks .check-result{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--brand-wash);color:var(--ok);font:600 11.5px var(--display);white-space:nowrap}.action-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.action-bar button{padding:9px 12px;border:1px solid var(--ink);border-radius:6px;background:#fff}.action-bar button.primary{background:var(--ink);color:#fff}.signing-sheet,.decision-record,.email-draft{padding:14px;border:1px solid var(--brand-rule);border-radius:9px;background:var(--brand-wash)}.decision-record h3{margin:0 0 8px;font:600 17px var(--display)}.email-draft pre{margin:8px 0 0;font:400 12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
    /* The three ways this case can end, and the reason box either of the two
       hand-taken ones opens. It reads as a record card rather than a toolbar,
       because a decline is not a toolbar gesture. */
    .decision-panel{padding:14px;border:1px solid var(--rule);border-radius:9px;background:var(--shell)}
    .decision-panel>p{margin:0 0 6px;color:var(--slate);font-size:12.5px;line-height:1.5}
    .decision-panel .decision-state{margin:0;padding:9px 11px;border:1px solid var(--brand-rule);border-radius:7px;background:var(--brand-wash);color:var(--brand-deep);font:600 12.5px/1.45 var(--display)}
    .decision-panel .action-bar button[disabled]{border-color:var(--rule);background:#fff;color:var(--muted);cursor:not-allowed}
    .decision-panel .readonly-note{margin:8px 0 0}
    .decision-draft{margin-top:12px;padding:12px;border:1px solid var(--brand-rule);border-radius:8px;background:#fff}
    .decision-draft h4{margin:0 0 6px;font:600 13.5px var(--display)}
    .decision-draft p{margin:0 0 9px;color:var(--slate);font-size:12.5px;line-height:1.5}
    .decision-draft label{display:block;margin-bottom:4px;color:var(--muted);font:500 10px var(--mono);text-transform:uppercase}
    .decision-draft textarea{width:100%;padding:8px 10px;border:1px solid #cbd4dc;border-radius:6px;font:inherit;font-size:12.5px;resize:vertical}
    .decision-record .decision-reason{padding:9px 11px;border-left:3px solid var(--brand-deep);background:#fff;overflow-wrap:anywhere}
    .decision-record.decision-declined{border-color:#e3c7c7;background:#fbf3f3}
    /* The officer's own hand: the block where a person overrules the assistant,
       the numbered queue, the unprompted message, and the marker that says which
       case on this board is the live one. */
    .live-case{margin-left:7px;padding:1px 6px;border-radius:999px;background:var(--brand);color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
    /* ---- the one alert on the open case ----

       every open item — reason, document, finding, "Open the document" — sitting
       two inches from the panel that already carried them, answerable. Two
       inventories of the same work is one inventory too many, and the one you
       cannot reply in is the one to lose. What is left is the *pointer*: a
       button that says how much is waiting and takes you to it.

       It pulses because a count in a header is easy to walk past, and it stops
       pulsing the moment there is nothing to pulse about — the button is absent
       when the case is clear, rather than sitting there in a calm state nobody

    .assistant-launcher-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.16);font-size:14px;line-height:1}

    .analysis-card h3{margin:0;font:600 12.5px var(--display)}

<body>
  <a class="skip-link" href="#loan-board" data-copy="common.skip-link"></a>
  <div id="lender-app"></div>
  <div id="lender-status" role="status" aria-live="polite"></div>
  <script src="assets/copy.js"></script>
  <script src="assets/falabella-credit.js"></script>
  <script src="assets/falabella-workspace.js"></script>
  <script>
    /* BancoBCR English portal — the lender surface.
     *
     * Structure and interaction model come from Silver Hill's lender.html: seven
     * derived stages on one board, three metric tiles, a cross-stage needs-review
     * filter, and a hash-addressable case workspace. The arithmetic comes from
     * FalabellaCredit, the state from FalabellaWorkspace, and every user-visible
     * string from FalabellaCopy — this file holds none of the three itself.
     *
     * Loan 1 (H-2026-08415) is the live case and the only interactive one. The
     * other eleven are read-only fixtures whose only job is to make the board a
     * portfolio: between them they fill all seven columns, so no stage is ever
     * demoed empty.
     */
    "use strict";

    (function () {
      var copy = globalThis.FalabellaCopy;
      var credit = globalThis.FalabellaCredit;
      var workspace = globalThis.FalabellaWorkspace;

      /* The demo's clock. One fixed instant, so the board, the metrics and the

         than invented a second time. Two keys, and they are not interchangeable:

                               interactive case. Per tab on purpose: the borrower
                               page seeds it, and switching to this view in the same
                               tab carries it across.
           MESSAGE_BRIDGE_KEY  localStorage. The live cross-tab message bridge,
                               capped at the last 200 messages, which is what lets
                               two tabs open side by side hear each other.

         future-version payloads all reset to the built-in fixture, which is what
         makes this page demoable on its own: a parse error must never blank the

         conversation that will now never be added to. The value is the

         against the last one this tab acted on, and a higher one means the
         conversation it names is gone and this desk's copy of the primary

         conversation back, not an empty one. */

        if (!parsed.documents || typeof parsed.documents !== "object") {

          checklistStartedAt: data.checklistStartedAt

       * has pressed anything — so merely *looking* at her portal in this tab used
       * to leave the desk reading nine documents as Not uploaded, with the case
       * it seeds for itself overwritten by a blank one.

       * puts a verdict on a record, which is the live handoff this key exists
       * for. What is refused is the handoff of nothing at all.

        if (state.reviewItems.length || state.auditEvents.length) return false;

        });

      function emptyBridge() {

          typeof entry === "object" &&
          typeof entry.id === "string" &&
          entry.id !== "" &&
          BRIDGE_SENDERS.indexOf(entry.from) !== -1 &&
          typeof entry.text === "string" &&
          entry.text.trim() !== ""

      function bridgeRead(storage) {

        var raw = readRaw(store, MESSAGE_BRIDGE_KEY);

        try {

        } catch (error) {
          return emptyBridge();

        if (!Array.isArray(parsed.entries)) return emptyBridge();

          run: envelope.run,

          condition: typeof input.condition === "string" ? input.condition : null

        forgetBridge(envelope.run + 1);

        return bridgeWrite(storage, { run: bridgeRun, entries: [] });

       * counter, and pruning the memory back to what the envelope still holds, so a
       * bridge emptied by any means lets the next message through.

          fresh.push(entry);

       * becomes exactly one `borrower-message` review item through the engine, so it
       * lands in Needs review and in the case's trail like any other work — and
       * unrelated open items are never touched (§4.2). Review work does not move the
       * stage, so her case stays in the column it was in (§4.1).

           would file a message she just sent as a day old and sort it above the
           handoff it answers. What this surface records is when it received it;
           a second apart, so a batch keeps its order. */

             work and must not be announced as any. */

      function parseCaseQuery(search) {
        var raw = typeof search === "string" ? search : "";
        var params = new URLSearchParams(raw.charAt(0) === "?" ? raw.slice(1) : raw);
        var caseId = String(params.get("case") || "").trim();
        return { caseId: caseId === "" ? null : caseId, take: params.get("take") === "1" };
      }

      /**
       * A case named in the query is opened, if it is one this portfolio actually
       * holds; anything else leaves the view state exactly as it was, by reference,
       * so a stale link opens a plain board rather than an empty drawer.
       */
      function applyCaseQuery(viewState, search, knownIds) {
        var query = parseCaseQuery(search);
        if (!query.caseId || !knownIds || !knownIds.has(query.caseId)) {
          return { viewState: viewState, announcement: null };
        }
        return {
          viewState: assign(assign({}, viewState), {
            selectedCaseId: query.caseId,
            panelMode: "drawer",
            activeTab: "overview",
            draft: null
          }),
          announcement: {
            key: query.take ? "lender.status.take-case" : "lender.status.case-opened",
            params: { case: query.caseId }
          }
        };
      }

      /* A live loan, not a fixture — the primary case or the second live case.
         Its substatus, stage and review queue are all read out of the live
         state, so a borrower upload on the
         other surface changes this card without anything here being touched. */
      function createInteractiveLoan(caseData, state) {
        var data = caseData || FALLBACK_CASE;
        var liveState = workspace.normalizeState(state || data.state, {
          submittedAt: data.submittedAt,
          checklistStartedAt: data.checklistStartedAt
        });
        return {
          caseId: data.caseId,
          borrowerName: data.borrower.fullName,
          address: data.property.address,
          requestedUF: data.loan.requestedUSD,
          deedDate: data.loan.deedTargetDate,
          substatusKey: "lender.substatus.documents-progress",
          substatusParams: documentsProgress(liveState),
          stage: workspace.deriveStage(liveState),
          state: liveState,
          reviewItems: liveState.reviewItems,
          readonly: false,
          driveUrl: data.driveUrl || null,
          caseData: data
        };
      }

      /**
       * The board, in its one fixed order. `FIXTURE_LOANS` still lists every
       * read-only case exactly where spec §5.4 put it — including the second
       * live case's entry, so its position on the board never moves. Building
       * the portfolio swaps that one entry for the live loan; nothing else
       * about the array changes.
       *
       * Two call shapes, for one reason: every existing caller already says
       * `buildPortfolio(FALLBACK_CASE, state)` to hand the primary case its
       * live state. That shape is kept exactly as it was. Handing a plain
       * object instead — `{ [caseId]: state }` — sets more than one case's
       * state at once, which only `init()` needs, because it is the only
       * caller carrying more than one.
       */
      function buildPortfolio(caseDataOrStates, state) {
        var overrides = {};
        if (caseDataOrStates && caseDataOrStates.caseId) {
          overrides[caseDataOrStates.caseId] = state !== undefined ? state : caseDataOrStates.state;
        } else if (caseDataOrStates && typeof caseDataOrStates === "object") {
          overrides = caseDataOrStates;
        }
        var liveById = {};
        LIVE_CASES.forEach(function (data) {
          liveById[data.caseId] = createInteractiveLoan(data, overrides[data.caseId]);
        });
        var rest = FIXTURE_LOANS.map(function (fixture) {
          return liveById[fixture.caseId] || fixture;
        });
        return [liveById[CASE_ID]].concat(rest);
      }

      /* =============================================================== metrics */

      /* A message is not a decision waiting on the desk — it is answered from
         the Conversation tab, not settled with a verdict — so counting it
         alongside a document exception is what let a badge or a card say "4"
         when only two of those four were ever hers to decide. Every count of
         "how much needs the desk" reads through this, never straight off
         `openReviewItems`, so a pending message can raise it in the
         Conversation tab's own count (§pendingMessageIds) without also
         raising it here. Filtering by review reason (§filterLoans) is the one
         place a message is deliberately still a reason to find a case by, so
         it reads `openReviewItems` directly instead. */
      function actionableReviewItems(state) {
        return workspace.openReviewItems(state).filter(function (item) {
          return item.type !== "borrower-message";
        });
      }

      function openCount(loan) {
        return actionableReviewItems(loan.state).length;
      }

      function sumRequestedUF(loans) {
        return loans.reduce(function (total, loan) {
          return total + loan.requestedUF;
        }, 0);
      }

      function portfolioMetrics(loans, now) {
        var when = now || DEMO_NOW;
        return {
          activeOriginationUF: sumRequestedUF(
            loans.filter(function (loan) {
              return PIPELINE_STAGES.indexOf(loan.stage) !== -1;
            })
          ),
          /* How many cases have something waiting, regardless of stage. */
          needsReviewCount: loans.filter(function (loan) {
            return openCount(loan) > 0;
          }).length,
          /* How many things are waiting, across all of them. Once the tile is
             labelled Notifications it has to count notifications: "3" under
             that word meaning "three cases" would be read as three items by
             everyone who has ever seen a badge. */
          notificationCount: loans.reduce(function (total, loan) {
            return total + openCount(loan);
          }, 0),
          signingSoonUF: sumRequestedUF(
            loans.filter(function (loan) {
              return isSigningSoon(loan, when);
            })
          )
        };
      }

      /* =============================================== filters, sorts, grouping */

      /* The nav is the seven-stage board, one filter per column, so a click in
         the nav and a glance at the board always agree. `pipeline` is the
         default, unfiltered view — it names no column, so nothing in the nav
         is pressed for it — and an unrecognised view narrows nothing, so a
         stale hash or a typo can never blank the board. */
      function matchesView(loan, view) {
        var isStageView = STAGE_COLUMNS.some(function (column) {
          return column.id === view;
        });
        return isStageView ? loan.stage === view : true;
      }

      function matchesQuery(loan, query) {
        if (!query) return true;
        var haystack = [loan.caseId, loan.borrowerName, loan.address].join(" ").toLowerCase();
        return haystack.indexOf(query) !== -1;
      }

      function filterLoans(loans, criteria) {
        var options = criteria || {};
        var query = String(options.query === undefined || options.query === null ? "" : options.query)
          .trim()
          .toLowerCase();
        return loans.filter(function (loan) {
          if (!matchesView(loan, options.view)) return false;
          if (options.stage && options.stage !== "all" && loan.stage !== options.stage) return false;
          if (options.reviewType && options.reviewType !== "all") {
            var matched = workspace.openReviewItems(loan.state).some(function (item) {
              return item.type === options.reviewType;
            });
            if (!matched) return false;
          }
          return matchesQuery(loan, query);
        });
      }

      function compareDeedDate(a, b) {
        if (!a.deedDate && !b.deedDate) return 0;
        /* A case with no deed date has nothing to be early or late for: last. */
        if (!a.deedDate) return 1;
        if (!b.deedDate) return -1;
        return a.deedDate.localeCompare(b.deedDate);
      }

      function submittedAt(loan) {
        return String((loan.state.workflow && loan.state.workflow.submittedAt) || "");
      }

      function sortLoans(loans, sortKey) {
        var sorted = loans.slice();
        if (sortKey === "newest") {
          return sorted.sort(function (a, b) {
            return submittedAt(b).localeCompare(submittedAt(a));
          });
        }
        if (sortKey === "amount") {
          return sorted.sort(function (a, b) {
            return b.requestedUF - a.requestedUF;
          });
        }
        return sorted.sort(compareDeedDate);
      }

      /* Every column keeps its key, empty or not: the board never collapses a
         stage (§5.3). */
      function groupLoansByStage(loans) {
        var groups = {};
        STAGE_COLUMNS.forEach(function (column) {
          groups[column.id] = loans.filter(function (loan) {
            return loan.stage === column.id;
          });
        });
        return groups;
      }

      /* =============================================================== escaping */

      var HTML_ENTITIES = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };

      /* Every value that reaches markup goes through here — case data, copy that
         has had case data interpolated into it, and the search box's own echo. */
      function escapeHtml(value) {
        var text = value === null || value === undefined ? "" : String(value);
        return text.replace(/[&<>"']/g, function (character) {
          return HTML_ENTITIES[character];
        });
      }

      /* Copy is resolved and escaped in one move, so no call site can forget. */
      function text(key, params) {
        return escapeHtml(t(key, params));
      }

      function assign(target, source) {
        Object.keys(source || {}).forEach(function (key) {
          target[key] = source[key];
        });
        return target;
      }

      /* ============================================================ the view */

      /* The nav, left to right, is the board: one filter per kanban column,
         same order, same label. Clicking a column's name in the nav is the
         same narrowing as looking at that column. */
      var NAV_ITEMS = STAGE_COLUMNS.map(function (column) {
        return { view: column.id, labelKey: column.labelKey };
      });

      var SORT_OPTIONS = [
        { key: "deed-date", labelKey: "lender.toolbar.sort-deed-date" },
        { key: "newest", labelKey: "lender.toolbar.sort-newest" },
        { key: "amount", labelKey: "lender.toolbar.sort-amount" }
      ];

      /* The six tabs of §5.5. The hash may name any of them and nothing else. */
      var WORKSPACE_TABS = ["overview", "application", "documents", "conversation", "risk", "audit"];

      var DEFAULT_VIEW_STATE = {
        view: "pipeline",
        query: "",
        stage: "all",
        reviewType: "all",
        sort: "deed-date",
        selectedCaseId: null,
        panelMode: "drawer",
        activeTab: "overview",
        /* The one piece of drawer state that is not derivable from the case:
           whether the drafted query to the developer is on screen, waiting to be
           read and sent. Everything else the drawer shows — the signing sheet,
           the decision record, the gate — is read out of the case state. */
        draft: null,
        /* The bell on the open case: whether its tray is down, and which
           notifications have already been under the officer's eyes. Both are
           about looking, not about the case, so neither is persisted and neither
           goes in the hash. */
        /* Set for one render by "open the document": the record to unfold and
           scroll to once the documents tab is on screen. */
        focusDocumentId: null,
        /* What has been asked of the deal assistant on the open case. It is a
           reading of the case, not a change to it, so it lives with the view and
           is dropped when the case closes. */
        assistantThread: [],
        /* Whether the agent menu is down, and the last thing the assistant's own
           status line said. Both are about the panel, not the case. */
        agentMenuOpen: false,
        assistantStatus: null,
        /* Whether the assistant panel itself is up. It starts down: the tabs are
           the record and should be met first, and the assistant is a thing the
           officer reaches for rather than a third of the drawer she has to read
           past. Looking, not the case, so it is not persisted and not in the
           hash. */
        assistantOpen: false
      };

      function knownTab(tab) {
        return WORKSPACE_TABS.indexOf(tab) === -1 ? "overview" : tab;
      }

      /* Anything that is not full screen is the drawer. */
      function knownMode(mode) {
        return mode === "full" ? "full" : "drawer";
      }

      function navLabelKey(view) {
        for (var index = 0; index < NAV_ITEMS.length; index += 1) {
          if (NAV_ITEMS[index].view === view) return NAV_ITEMS[index].labelKey;
        }
        return "lender.nav.pipeline";
      }

      /* =========================================================== hash routing */

      /* `#case=<id>&mode=drawer|full&tab=overview|application|documents|conversation|risk|audit`.
         Nothing here trusts the hash: an unknown mode or tab reads as the default
         rather than reaching a renderer, and an unknown case id is dropped by
         viewStateForCaseHash, which is the only place that knows the portfolio. */
      function parseCaseHash(hash) {
        var params = new URLSearchParams(String(hash || "").replace(/^#/, ""));
        return {
          selectedCaseId: params.get("case") || null,
          panelMode: knownMode(params.get("mode")),
          activeTab: knownTab(params.get("tab"))
        };
      }

      /* No selected case is no hash at all, so a closed board leaves a clean URL. */
      function caseHash(uiState) {
        if (!uiState || !uiState.selectedCaseId) return "";
        return (
          "#case=" +
          encodeURIComponent(uiState.selectedCaseId) +
          "&mode=" +
          knownMode(uiState.panelMode) +
          "&tab=" +
          knownTab(uiState.activeTab)
        );
      }

      /* Opening a case pushes — Back should close it. Changing tab or expanding
         replaces, so Back never walks through a case tab by tab. */
      function syncCaseHistory(historyApi, locationLike, uiState, mode) {
        var method = mode === "push" ? "pushState" : "replaceState";
        historyApi[method](
          null,
          "",
          locationLike.pathname + locationLike.search + caseHash(uiState)
        );
      }

      /* The board's own filters survive a hash change; only the case selection is
         read from it, and an id no longer in the portfolio resets cleanly. */
      function viewStateForCaseHash(currentState, hash, validCaseIds) {
        var parsed = parseCaseHash(hash);
        var known = Boolean(
          parsed.selectedCaseId && validCaseIds && validCaseIds.has(parsed.selectedCaseId)
        );
        return assign(assign({}, currentState || {}), known ? parsed : {
          selectedCaseId: null,
          panelMode: "drawer",
          activeTab: "overview"
        });
      }

      /* ============================================================== rendering */

      /* ----------------------------------------------------------- the unit
       *
       * The demo prices in US dollars only — one currency, one case figure,
       * one printed amount. There is no toggle to switch on and nothing else
       * this function needs to know about the view.
       */
      function money(usd) {
        return credit.formatUSD(usd);
      }

      /* The same control, for the other switch on this bar. Both locales are
         always offered by their own name — "ES" does not become "SP" in
         English — because the label is the thing you are switching *to*. */
      function renderLanguageToggle(place) {
        var current = copy.locale();
        return (
          '<div class="money-toggle language-toggle" role="group" aria-label="' +
          text("lender.language.aria-label") +
          '" data-language-place="' +
          escapeHtml(place || "board") +
          '">' +
          copy.LOCALES.map(function (code) {
            return (
              '<button type="button" data-locale="' +
              code +
              '" aria-pressed="' +
              (current === code) +
              '" title="' +
              text("lender.language." + code + "-title") +
              '">' +
              text("lender.language." + code) +
              "</button>"
            );
          }).join("") +
          "</div>"
        );
      }

      /**
       * The one display switch, in its frame.
       *
       * The demo prices in a single currency, so the only thing left to switch
       * is the language — the border and the cluster shell stay, so the header
       * reads the same as before, just with one switch inside it rather than
       * two.
       */
      function renderControlCluster(uiState, place) {
        return '<div class="control-cluster">' + renderLanguageToggle(place) + "</div>";
      }

      function stageLabel(stage) {
        for (var index = 0; index < STAGE_COLUMNS.length; index += 1) {
          if (STAGE_COLUMNS[index].id === stage) return t(STAGE_COLUMNS[index].labelKey);
        }
        return stage;
      }

      function metricTile(labelKey, value, attention) {
        return (
          '<div class="metric' +
          (attention ? " attention" : "") +
          '"><span class="metric-label">' +
          text(labelKey) +
          '</span><strong class="metric-value">' +
          escapeHtml(value) +
          "</strong></div>"
        );
      }

      /* §5.2's three tiles. Every number is portfolioMetrics', formatted by
         FalabellaCredit; the needs-review tile is the lime one. */
      function renderMetrics(loans, now) {
        var metrics = portfolioMetrics(loans, now);
        return (
          '<section class="metrics" aria-label="' +
          text("lender.metrics-aria-label") +
          '">' +
          metricTile("lender.metric.active-origination", money(metrics.activeOriginationUF), false) +
          metricTile("lender.metric.needs-review", metrics.notificationCount, true) +
          metricTile("lender.metric.signing-soon", money(metrics.signingSoonUF), false) +
          "</section>"
        );
      }

      /* Each filter carries its own count — the same count the column it names
         shows on the board, since the nav and the board share one filter. */
      function renderNavigation(loans, view) {
        return NAV_ITEMS.map(function (item) {
          var count = filterLoans(loans, { view: item.view }).length;
          return (
            '<button type="button" data-view="' +
            item.view +
            '" class="nav-filter' +
            (item.attention ? " attention" : "") +
            '" aria-pressed="' +
            (view === item.view) +
            '"><span>' +
            (item.attention ? '<span aria-hidden="true">◆</span> ' : "") +
            text(item.labelKey) +
            "</span><span>" +
            count +
            "</span></button>"
          );
        }).join("");
      }

      function option(value, label, selected) {
        return (
          '<option value="' +
          escapeHtml(value) +
          '"' +
          (selected ? " selected" : "") +
          ">" +
          escapeHtml(label) +
          "</option>"
        );
      }

      /* §5.3's toolbar: stage, review reason, sort. Each select echoes the current
         choice back, so a re-render never silently loses a filter. */
      function renderToolbar(uiState) {
        var view = assign(assign({}, DEFAULT_VIEW_STATE), uiState || {});
        var stages = [option("all", t("lender.toolbar.all-stages"), view.stage === "all")].concat(
          STAGE_COLUMNS.map(function (column) {
            return option(column.id, t(column.labelKey), view.stage === column.id);
          })
        );
        var reasons = [option("all", t("lender.toolbar.all-reasons"), view.reviewType === "all")].concat(
          workspace.REVIEW_TYPES.map(function (type) {
            return option(type, t("review." + type), view.reviewType === type);
          })
        );
        var sorts = SORT_OPTIONS.map(function (item) {
          return option(item.key, t(item.labelKey), view.sort === item.key);
        });
        return (
          /* Each label points at its select by id rather than wrapping it: an
             explicit association survives the label being restyled or moved. */
          '<div class="board-toolbar">' +
          '<label for="stage-filter">' +
          text("lender.toolbar.stage") +
          '<select id="stage-filter">' +
          stages.join("") +
          "</select></label>" +
          '<label for="review-filter">' +
          text("lender.toolbar.reason") +
          '<select id="review-filter">' +
          reasons.join("") +
          "</select></label>" +
          '<label for="case-sort">' +
          text("lender.toolbar.sort") +
          '<select id="case-sort">' +
          sorts.join("") +
          "</select></label>" +
          "</div>"
        );
      }

      /* What underwriting is still waiting on, as a corner flag.
       *
       * It is on the card and only in Underwriting, because that is the one
       * column where it changes what the desk does next: a case whose documents
       * are all in can still be unable to move because the title or the
       * inspection is outstanding, and that fact was previously only findable by
       * opening the case. Elsewhere on the board it would be either premature or
       * history, so it is not drawn there. */
      /* "2 notifications", and "1 notification" when there is one. The count is
         the same derived number the panel and the header alert use — this only
         says it in words, so a badge never reads "1 notification(s)". */
      function notificationsPhrase(count) {
        return count === 1
          ? t("lender.needs.count-one")
          : t("lender.needs.count-many", { count: count });
      }

      function pendingFlagFor(loan) {
        if (loan.stage !== workspace.STAGES.UNDERWRITING) return null;
        var pending = workspace.pendingChecks(loan.state);
        if (!pending.length) return null;
        return {
          checks: pending,
          labelKey:
            pending.length > 1
              ? "lender.card.pending-both"
              : pending[0] === "title"
                ? "lender.card.pending-title"
                : "lender.card.pending-inspection"
        };
      }

      function renderPendingFlag(flag) {
        if (!flag) return "";
        return (
          '<span class="pending-flag" data-pending="' +
          escapeHtml(flag.checks.join(" ")) +
          '" aria-hidden="true"><span>▲</span> ' +
          text(flag.labelKey) +
          "</span>"
        );
      }

      /* §5.3's card: case id, borrower, requested amount, one-line substatus, deed
         date — plus, when the case has open work, the lime left border *and* the
         reason chip that says so in words, and in Underwriting the corner flag
         for a title or an inspection still out. */
      function renderLoanCard(loan) {
        var open = actionableReviewItems(loan.state);
        /* The count first, then what the newest one is about: a card that says
           "2 notifications · New upload" tells the officer both how much is
           waiting and what she is walking into, which "Needs review · New
           upload" never did. */
        var chip = open.length
          ? '<span class="review-reason"><span aria-hidden="true">◆</span> ' +
            text("lender.card.review-chip", {
              notifications: notificationsPhrase(open.length),
              reason: t("review." + open[0].type)
            }) +
            "</span>"
          : "";
        var deed = loan.deedDate
          ? '<span class="loan-deed">' +
            text("lender.card.deed-date", { date: credit.formatDate(loan.deedDate) }) +
            "</span>"
          : "";
        var flag = pendingFlagFor(loan);
        return (
          '<button class="loan-card' +
          (open.length ? " needs-review" : "") +
          (flag ? " has-flag" : "") +
          '" type="button" data-case-id="' +
          escapeHtml(loan.caseId) +
          /* The card is one button, so its label is the whole card: the flag is
             drawn aria-hidden and said here instead, or it would be a corner
             nobody listening to the board ever hears. */
          '" aria-label="' +
          text("lender.card.open-aria", { case: loan.caseId, borrower: loan.borrowerName }) +
          (flag ? " " + text("lender.card.pending-aria", { what: t(flag.labelKey) }) : "") +
          '">' +
          renderPendingFlag(flag) +
          '<span class="loan-case">' +
          escapeHtml(loan.caseId) +
          /* One case on this board is the demo; the rest are there so it looks
             like a desk. Say which, on the card, rather than letting somebody
             open a sample and find every control disabled (§11). */
          (loan.readonly
            ? ""
            : '<span class="live-case">' + text("lender.card.live-case") + "</span>") +
          "</span>" +
          '<span class="loan-borrower">' +
          escapeHtml(loan.borrowerName) +
          "</span>" +
          '<span class="loan-meta">' +
          escapeHtml(money(loan.requestedUF)) +
          "</span>" +
          chip +
          '<span class="loan-substatus">' +
          text(loan.substatusKey, loan.substatusParams || {}) +
          "</span>" +
          deed +
          "</button>"
        );
      }

      /* Seven columns, always. An empty stage keeps its dashed placeholder rather
         than collapsing, so the shape of the pipeline is always legible (§5.3). */
      function renderBoardColumns(groups) {
        return STAGE_COLUMNS.map(function (column) {
          var loans = (groups && groups[column.id]) || [];
          return (
            '<section class="stage-column" data-stage="' +
            column.id +
            '" aria-labelledby="stage-' +
            column.id +
            '"><h2 class="stage-heading" id="stage-' +
            column.id +
            '"><span>' +
            text(column.labelKey) +
            '</span><span class="stage-count">' +
            loans.length +
            "</span></h2>" +
            (loans.length
              ? loans.map(renderLoanCard).join("")
              : '<p class="empty-column">' + text("lender.board.empty-column") + "</p>") +
            "</section>"
          );
        }).join("");
      }

      function renderTopbar(uiState, boardAttributes) {
        return (
          '<header class="topbar"' +
          boardAttributes +
          '><button type="button" class="topbar-logo-button" id="reset-filters" aria-label="' +
          text("lender.logo-reset-aria") +
          '"><span class="topbar-wordmark">' +
          text("lender.logo-alt") +
          '</span></button><span class="portal-label">' +
          text("lender.title") +
          "</span>" +
          '<input class="global-search" id="case-search" type="search" value="' +
          escapeHtml(uiState.query) +
          '" placeholder="' +
          text("lender.search-placeholder") +
          '" aria-label="' +
          text("lender.search-label") +
          '">' +
          renderControlCluster(uiState, "board") +
          '<a class="demo-role-switch" href="borrower.html" aria-label="' +
          text("lender.switch-to-borrower-aria") +
          '">' +
          text("lender.switch-to-borrower") +
          "</a></header>"
        );
      }

      /* The whole board surface. A search that matches nothing gets the reset row
         above the columns; the columns themselves stay, empty and dashed. */
      function renderPortfolioPage(loans, uiState, now) {
        var view = assign(assign({}, DEFAULT_VIEW_STATE), uiState || {});
        var when = now || DEMO_NOW;
        var visible = sortLoans(filterLoans(loans, view, when), view.sort);
        /* While a case is open the drawer is the only live surface (§5.5). */
        var boardAttributes = view.selectedCaseId ? ' inert aria-hidden="true"' : "";
        var emptySearch =
          !visible.length && String(view.query || "").trim()
            ? '<div class="empty-search"><strong>' +
              text("lender.toolbar.no-match") +
              '</strong><button id="clear-search" type="button">' +
              text("lender.toolbar.clear-search") +
              "</button></div>"
            : "";
        return (
          renderTopbar(view, boardAttributes) +
          '<div class="portal-layout"' +
          boardAttributes +
          '><nav class="portfolio-nav" aria-label="' +
          text("lender.nav.aria-label") +
          '">' +
          renderNavigation(loans, view.view) +
          "</nav>" +
          '<main class="portal-main" id="loan-board">' +
          '<div class="page-heading"><div><span class="metric-label">' +
          text("lender.page.eyebrow") +
          '</span><h1 tabindex="-1">' +
          text(navLabelKey(view.view)) +
          "</h1></div><span>" +
          text("lender.page.matching", { count: visible.length }) +
          "</span></div>" +
          renderMetrics(loans, when) +
          renderToolbar(view) +
          emptySearch +
          '<div class="loan-board" role="group" aria-label="' +
          text("lender.board.aria-label") +
          '">' +
          renderBoardColumns(groupLoansByStage(visible)) +
          "</div></main></div>"
        );
      }

      /* ========================================================= the later seam */

      /* Spec §5.6: Carolina cannot click on behalf of the developer or of
         Javiera, so the two events that close the two open items arrive on their
         own a few seconds after the gesture that provokes them. Every delayed
         arrival goes through this one seam — no bare setTimeout in logic — so the
         suite fires them synchronously and never waits on real time.

         The shape, which Task 7 reuses on FalabellaBorrower:
           later(ms, fn)          schedule through the current scheduler
           setLater(schedule)     replace it, returning the one it displaced
           DEFAULT_LATER(ms, fn)  the setTimeout-backed default
         Every action also takes a per-call `later` in its options, so a test can
         inject one arrival without touching the page's scheduler at all. */
      var ARRIVAL_DELAY_MS = 4000;

      function DEFAULT_LATER(ms, fn) {
        return setTimeout(fn, ms);
      }

      var scheduleLater = DEFAULT_LATER;

      function later(ms, fn) {
        return scheduleLater(ms, fn);
      }

      function setLater(schedule) {
        var previous = scheduleLater;
        scheduleLater = typeof schedule === "function" ? schedule : DEFAULT_LATER;
        return previous;
      }

      /* ============================================================== the clock */

      /* Timestamps are always explicit arguments (§4.4), and the page must never
         read a real clock: the demo's instants are DEMO_NOW plus a fixed step per
         gesture, so the audit trail reads in order on every machine. */
      var ACTION_STEP_MS = 180000;

      function advanceTimestamp(timestamp, ms) {
        var parsed = Date.parse(timestamp);
        if (Number.isNaN(parsed)) return timestamp;
        return new Date(parsed + ms).toISOString();
      }

      function formatTimestamp(timestamp) {
        if (!timestamp) return t("common.empty");
        var parsed = new Date(timestamp);
        if (isNaN(parsed.getTime())) return String(timestamp);
        return new Intl.DateTimeFormat(credit.numberLocale(), {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
          timeZone: "UTC"
        }).format(parsed);
      }

      /* Three of the lender's gestures — the query to the developer, its reply,
         the reminder, the signature — are not transitions of any document, so the
         engine has no transition for them and this page appends their trail entry
         itself. The id comes from the same nextSequence, so ids stay unique and
         deterministic and nothing here reaches for a clock or a random number. */
      function recordEvent(state, entry) {
        var stamp = entry && typeof entry.timestamp === "string" ? entry.timestamp : null;
        if (!stamp || Number.isNaN(Date.parse(stamp))) return state;
        var next = workspace.normalizeState(state);
        var sequence = next.nextSequence;
        next.nextSequence = sequence + 1;
        var event = {
          id: "audit-" + sequence,
          timestamp: stamp,
          actor: entry.actor,
          action: entry.action,
          documentId: entry.documentId === undefined ? null : entry.documentId,
          details: entry.details === undefined ? "" : entry.details
        };
        if (entry.reviewItemId) event.reviewItemId = entry.reviewItemId;
        next.auditEvents.push(event);
        return next;
      }

      /* ===================================================== the case's figures */

      /* A fixture has no application behind it, so it gets no arithmetic: the
         numbers of §3.1 belong to the one interactive case and inventing them for
         a demo card would be the duplication DISENO.md §2 warns about. */
      function caseFiguresFor(loan) {
        if (!loan || !loan.caseData) return null;
        var data = loan.caseData;
        return credit.caseFigures({
          propertyUSD: data.property.valueUSD,
          ltv: data.loan.ltv,
          annualRate: data.loan.annualRate,
          years: data.loan.termYears,
          incomeUSD: data.borrower.incomeUSD
        });
      }

      function officerAuthority() {
        return t("lender.officer.authority");
      }

      /* ============================================================ small parts */

      function detailRow(labelKey, value) {
        return "<div><dt>" + text(labelKey) + "</dt><dd>" + escapeHtml(value) + "</dd></div>";
      }

      function metaRow(labelKey, value, note) {
        return (
          "<p><span>" +
          text(labelKey) +
          "</span><strong>" +
          escapeHtml(value) +
          (note ? "<small>" + escapeHtml(note) + "</small>" : "") +
          "</strong></p>"
        );
      }

      function sectionOpen(headingKey, extra) {
        return (
          '<section class="workspace-section">' +
          (extra
            ? '<div class="section-heading"><h3>' + text(headingKey) + "</h3>" + extra + "</div>"
            : "<h3>" + text(headingKey) + "</h3>")
        );
      }

      function documentLabel(loan, documentId) {
        return documentId ? t("doc." + documentId + ".name") : loan.caseId;
      }

      /* ========================================================== review items */

      /* The bell's sentence for an item's kind, and the two findings this demo
         actually knows. */
      var NOTIFICATION_BODY_KEYS = {
        "document-exception": "lender.notifications.exception",
        "new-upload": "lender.notifications.new-upload",
        "borrower-message": "lender.notifications.borrower-message",
        "deed-deadline": "lender.notifications.deed-deadline"
      };

      /**
       * What is actually wrong with this item, in one sentence.
       *
       * The queue used to print `item.summary`, which resolves to the item's own
       * type — so a card headed "Document exception" said "Document exception"
       * again underneath, in the space where the reason belonged. One source
       * now answers for both surfaces, so the bell and the queue can never
       * describe the same item two different ways.
       *
       * Only the live case gets the specific finding: a fixture's exception is a
       * shape, not a reading, and lending it Javiera's folio number would be
       * inventing evidence.
       */
      function reviewItemDetail(loan, item) {
        var bodyKey = NOTIFICATION_BODY_KEYS[item.type] || "lender.notifications.exception";
        var detailKey =
          !loan.readonly && item.type === "document-exception" && item.documentId
            ? "lender.notifications.detail." + item.documentId
            : null;
        if (detailKey && !copy.missingKeys(copy.DEFAULT_LOCALE, [detailKey]).length) {
          bodyKey = detailKey;
        }
        return t(bodyKey, { borrower: loan.borrowerName });
      }

      /* ============================================ what the desk decides here
       *
       * An open item is a question, and a question has more than one good
       * answer. This row used to offer two — "Mark resolved" and "Send reply &
       * resolve" — as two full-width buttons stacked down the rail, and both of
       * them meant *yes*. To reject a document, or to accept it with a term
       * attached, the officer had to leave the queue, find the Documents tab,
       * open the right record and use the verdict select there. The one place
       * that lists the work was the one place that could not settle it.
       *
       * So the pair of buttons becomes what it always was: one decision. A
       * select carries the outcomes, a single button commits the one chosen.
       * Two long buttons that both said yes become one short row that can say
       * no.
       *
       * The outcomes are the verdicts the case model already keeps (§3.2), not
       * a second vocabulary invented for this rail — accepting here writes the
       * same verdict, the same audit line and the same condition settlement as
       * accepting on the document record. Items with no document behind them
       * (a message, a field query) offer only the two that make sense for them.
       */
      var REVIEW_DECISIONS = [
        "reply",
        "accepted",
        "accepted-with-condition",
        "send-back",
        "resolve"
      ];

      /* The three that touch a verdict are only offered where there is a
         document to carry one, and only while it has actually arrived: there is
         no accepting or rejecting a file nobody has uploaded. Once a verdict is
         on offer, "reply" and "resolve" step aside — the decision is made on
         the document, not talked around it. Only a message or a field query,
         with no document behind it, still needs the two of them. */
      function reviewDecisionsFor(loan, item) {
        var record = item.documentId ? loan.state.documents[item.documentId] : null;
        var settleable = !!record && record.verdict !== "not-uploaded";
        if (settleable) {
          return REVIEW_DECISIONS.filter(function (decision) {
            return decision !== "reply" && decision !== "resolve";
          });
        }
        return REVIEW_DECISIONS.filter(function (decision) {
          return decision === "reply" || decision === "resolve";
        });
      }

      /* The row's only decision, for an item with no document to settle: read
         her words on the Conversation tab and reply there, then dismiss the
         notification once it is handled. No reply box and no select here —
         there is nothing to choose between, and typing an answer belongs to
         the conversation, not to the queue that pointed at it. */
      function renderChatOnlyDecision(id, disabled) {
        return (
          /* `review-queue-link`, not `review-item-open`: this one leaves the
             drawer's own record for another tab entirely, same as the queue's
             own "N awaiting your reply" link, rather than opening a document
             record the way `review-item-open` normally does — and it sits
             outside `review-decide` so the row's filled-button styling never
             paints over what has to read as a link. */
          '<button type="button" class="review-queue-link" data-assistant-action="conversation-tab">' +
          text("lender.review.reply-in-chat") +
          " →</button>" +
          '<div class="review-decide">' +
          '<button type="button" class="primary" data-review-action="decide" data-review-id="' +
          id +
          '" data-review-decision-value="resolve"' +
          disabled +
          ">" +
          text("lender.review.mark-resolved") +
          "</button></div>"
        );
      }

      /* The row's decision when a document is actually behind it: the select
         carries the verdict, the reply box carries the reason a send-back
         needs, the condition field appears only for the one outcome that asks
         for one, and one button commits whichever is on screen. */
      function renderSettleableDecision(loan, item, id, disabled) {
        return (
          '<div class="review-actions">' +
          '<label class="sr-only" for="reply-' +
          id +
          '">' +
          text("lender.review.reply-label") +
          "</label>" +
          '<textarea id="reply-' +
          id +
          '" data-review-reply="' +
          id +
          '" rows="1" placeholder="' +
          text("lender.review.reply-placeholder", { borrower: loan.borrowerName }) +
          '"' +
          disabled +
          "></textarea>" +
          "</div>" +
          /* The condition field only exists for the one outcome that requires it,
             and it is hidden until that outcome is picked rather than sitting
             there empty asking to be filled in. `hidden` and not `display:none`
             so it leaves the accessibility tree too. */
          '<div class="review-condition" data-review-condition-row="' +
          id +
          '" hidden><label class="sr-only" for="review-condition-' +
          id +
          '">' +
          text("lender.documents.override-condition-label") +
          '</label><input type="text" id="review-condition-' +
          id +
          '" data-review-condition="' +
          id +
          '" placeholder="' +
          text("lender.documents.override-condition-placeholder") +
          '"' +
          disabled +
          "></div>" +
          /* Decision and commit on one line: the select says what, the button
             does it. Both are short, so the rail no longer carries two
             full-width buttons where one row will do. */
          '<div class="review-decide">' +
          '<label class="sr-only" for="decision-' +
          id +
          '">' +
          text("lender.review.decision-label") +
          "</label>" +
          '<select id="decision-' +
          id +
          '" data-review-decision="' +
          id +
          '"' +
          disabled +
          ">" +
          reviewDecisionsFor(loan, item)
            .map(function (decision) {
              return (
                '<option value="' +
                escapeHtml(decision) +
                '">' +
                text("lender.review.decision." + decision) +
                "</option>"
              );
            })
            .join("") +
          "</select>" +
          '<button type="button" class="primary" data-review-action="decide" data-review-id="' +
          id +
          '"' +
          disabled +
          ">" +
          text("lender.review.apply") +
          "</button></div>"
        );
      }

      /* One item as one row of a list, not one card per screen: reason, document
         and date on a single line, the finding under it, and the decision on
         the lines below. Two open items should be readable without scrolling
         past the first. A read-only fixture gets the same markup with every
         control disabled and the note that says why (§5.4).
         Never her own words: the row states what the case is waiting on — the
         same sentence the header alert would give it — and nothing quoted from
         her thread. Her words, and any reply to them, live on the Conversation
         tab; a queue that also echoed her message was a second inbox reading
         the same thread the first one already owned, and it is why a message
         she had already been answered could still look like it was waiting. */
      /* A message or a deadline is never a document's verdict, whatever the
         document behind it happens to be doing — so these two always read
         from the conversation rather than borrowing whichever decision the
         document's own settleability would otherwise hand them. Everything
         else still asks `reviewDecisionsFor`, since a document-exception or a
         new upload with nothing settleable behind it (yet) has no verdict to
         offer either. */
      var CONVERSATION_ONLY_TYPES = ["borrower-message", "deed-deadline"];

      function renderReviewItem(loan, item, position, total, note) {
        var disabled = loan.readonly ? " disabled" : "";
        var id = escapeHtml(item.id);
        var chatOnly =
          CONVERSATION_ONLY_TYPES.indexOf(item.type) !== -1 ||
          reviewDecisionsFor(loan, item).indexOf("reply") !== -1;
        return (
          '<article class="review-item" data-review-item-id="' +
          id +
          '" data-review-document="' +
          escapeHtml(item.documentId || "") +
          '"><div class="review-item-heading">' +
          /* Where this one sits in the queue, so a stack of items does not read
             as one undifferentiated pile. On the same line as the reason now:
             it is an index, and an index does not need a line of its own. */
          (position && total > 1
            ? '<span class="review-item-position">' +
              text("lender.overview.queue-position", { position: position, total: total }) +
              "</span>"
            : "") +
          "<strong>" +
          text("review." + item.type) +
          '</strong><span class="review-item-where">' +
          escapeHtml(documentLabel(loan, item.documentId)) +
          " · " +
          escapeHtml(credit.formatDate(item.createdAt)) +
          "</span>" +
          /* The finding names the document; this is the way to it. Without it
             the only route to the record behind an item was the documents tab
             itself, found by leaving the queue that named the problem. */
          (item.documentId
            ? '<button type="button" class="review-item-open" data-notification-document="' +
              escapeHtml(item.documentId) +
              '">' +
              text("lender.needs.open-document", {
                document: t("doc." + item.documentId + ".name")
              }) +
              "</button>"
            : "") +
          "</div>" +
          '<p class="review-item-detail">' +
          escapeHtml(reviewItemDetail(loan, item)) +
          "</p>" +
          /* The condition this document carries, if it carries one — inside the
             row, under the finding, above the decision. It used to be a row of
             its own further down the same list, which named the document a
             second time for a term that belongs to the first mention. */
          (note || "") +
          (chatOnly
            ? renderChatOnlyDecision(id, disabled)
            : renderSettleableDecision(loan, item, id, disabled)) +
          (loan.readonly ? '<p class="readonly-note">' + text("common.readonly-loan") + "</p>" : "") +
          "</article>"
        );
      }

      /* There is no composer on this surface. Writing to her is answering
         something she asked — `Send reply & resolve` on the item that carries
         her words — or sending a document back from its own record. A blank box
         inviting the desk to open a conversation out of nothing was a second
         inbox on a page that is not an inbox. */

      /* =========================================================== the audit */

      function hasAction(events, action) {
        return events.some(function (event) {
          return event.action === action;
        });
      }

      /* Every recorded event, plus the milestones the workflow implies and any
         open item the trail has no entry for, newest first (§5.5). A milestone is
         only folded in when the trail does not already carry it, so an approval
         that really happened is not listed twice. */
      function caseAuditEvents(loan) {
        var state = loan.state;
        var events = state.auditEvents.map(function (event) {
          return assign({}, event);
        });
        state.reviewItems.forEach(function (item) {
          var linked = events.some(function (event) {
            return event.reviewItemId === item.id;
          });
          if (linked) return;
          var action =
            item.type === "borrower-message"
              ? "borrower-message-sent"
              : item.type === "new-upload"
                ? "new-upload-received"
                : item.type === "document-exception"
                  ? "document-exception-created"
                  : "deed-deadline-raised";
          events.push({
            id: "derived-" + item.id,
            timestamp: item.createdAt,
            actor: item.type === "borrower-message" ? "borrower" : "system",
            action: action,
            documentId: item.documentId,
            reviewItemId: item.id,
            details: t(item.summary)
          });
        });
        var flow = state.workflow;
        var milestones = [
          [flow.submittedAt, "borrower", "application-submitted"],
          [flow.checklistStartedAt, "system", "document-checklist-started"],
          [flow.approvedAt, "lender", "loan-approved"],
          [flow.disbursedAt, "system", "loan-disbursed"],
          [flow.terminal && flow.terminal.at, "system", "case-closed"]
        ];
        milestones.forEach(function (milestone) {
          if (!milestone[0] || hasAction(events, milestone[2])) return;
          events.push({
