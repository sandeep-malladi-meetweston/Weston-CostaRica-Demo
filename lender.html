        if (open.length) {
          open.slice(0, 2).forEach(function (item) {
            if (item.documentId) actions.push(openDocumentAction(item.documentId));
          });
          if (
            !loan.readonly &&
            open.some(function (item) {
              return item.documentId === "title-certificate";
            })
          ) {
            actions.push(
              assistantAction("developer-query", "lender.assistant.action-developer-query")
            );
          }
          return {
            text: t("lender.assistant.brief-open", { count: open.length }),
            actions: actions
          };
        }
        if (record && record.signed) {
          return { text: t("lender.assistant.brief-signed"), actions: [] };
        }
        if (record) {
          return { text: t("lender.assistant.brief-approved"), actions: [] };
        }
        if (conditions.length) {
          return {
            text: t("lender.assistant.brief-conditions", {
              count: conditions.length,
              conditions: listOfConditions(conditions)
            }),
            actions: []
          };
        }
        if (loan.readonly) {
          return { text: t("lender.assistant.brief-quiet"), actions: [] };
        }
        return {
          text: t("lender.assistant.brief-ready"),
          actions: [assistantAction("approve", "lender.assistant.action-approve")]
        };
      }

      /* Which subject a question is about. First match wins, and the list is
         ordered most specific first, so "what is wrong with the title" reads as
         the title and not as the generic "what is wrong". */
      var ASSISTANT_INTENTS = [
        { id: "title", words: ["title", "encumbrance", "folio", "registrar", "mortgage on", "another bank", "certificate"] },
        { id: "tax-folder", words: ["tax", "folder", "hacienda", "cedula", "id number", "cropped", "page 1"] },
        { id: "developer", words: ["developer", "aconcagua", "release", "query", "construction loan"] },
        { id: "guarantee", words: ["ltv", "loan-to-value", "financing terms", "standard terms"] },
        { id: "affordability", words: ["income", "dti", "payment to income", "afford", "ratio", "stress", "rate", "payment", "cap"] },
        { id: "borrower", words: ["borrower", "javiera", "she", "her", "contact", "message", "whatsapp"] },
        { id: "documents", words: ["document", "upload", "checklist", "missing", "outstanding", "how many"] },
        { id: "approval", words: ["approve", "approval", "block", "holding", "condition", "gate", "sign", "next", "should i", "recommend"] }
      ];

      function assistantIntent(question) {
        var asked = String(question || "").toLowerCase();
        for (var index = 0; index < ASSISTANT_INTENTS.length; index += 1) {
          var intent = ASSISTANT_INTENTS[index];
          for (var word = 0; word < intent.words.length; word += 1) {
            if (asked.indexOf(intent.words[word]) !== -1) return intent.id;
          }
        }
        return "unknown";
      }

      function verdictOf(loan, documentId) {
        var record = loan.state.documents[documentId];
        return record ? record.verdict : "not-uploaded";
      }

      function documentHasOpenItem(loan, documentId) {
        return workspace.openReviewItems(loan.state).some(function (item) {
          return item.documentId === documentId;
        });
      }

      /**
       * One answer, grounded in this case. Returns the sentence and the controls
       * that go with it — never an action taken.
       */
      function dealAssistantAnswer(loan, question) {
        var intent = assistantIntent(question);
        var figures = caseFiguresFor(loan);
        var open = workspace.openReviewItems(loan.state);
        var conditions = openConditionsOf(loan);

        if (intent === "title") {
          if (documentHasOpenItem(loan, "title-certificate") && !loan.readonly) {
            return {
              intent: intent,
              text: t("lender.assistant.answer-title-open"),
              actions: [
                openDocumentAction("title-certificate"),
                assistantAction("developer-query", "lender.assistant.action-developer-query")
              ]
            };
          }
          return {
            intent: intent,
            text: t("lender.assistant.answer-title-settled", {
              verdict: t("verdict." + verdictOf(loan, "title-certificate")).toLowerCase()
            }),
            actions: [openDocumentAction("title-certificate")]
          };
        }

        if (intent === "tax-folder") {
          if (documentHasOpenItem(loan, "tax-folder") && !loan.readonly) {
            return {
              intent: intent,
              text: t("lender.assistant.answer-tax-open"),
              actions: [
                openDocumentAction("tax-folder"),
                assistantAction("remind-borrower", "lender.assistant.action-remind-borrower")
              ]
            };
          }
          return {
            intent: intent,
            text: t("lender.assistant.answer-tax-settled", {
              verdict: t("verdict." + verdictOf(loan, "tax-folder")).toLowerCase()
            }),
            actions: [openDocumentAction("tax-folder")]
          };
        }

        if (intent === "developer") {
          return {
            intent: intent,
            text: t("lender.assistant.answer-developer"),
            actions: loan.readonly
              ? []
              : [assistantAction("developer-query", "lender.assistant.action-developer-query")]
          };
        }

        if (intent === "guarantee") {
          if (!figures) return noFiguresAnswer(intent);
          return {
            intent: intent,
            text: t("lender.assistant.answer-guarantee", {
              rate: credit.formatPct(figures.annualRate * 100)
            }),
            actions: [assistantAction("risk-tab", "lender.assistant.action-risk")]
          };
        }

        if (intent === "affordability") {
          if (!figures) return noFiguresAnswer(intent);
          return {
            intent: intent,
            text: t("lender.assistant.answer-affordability", {
              payment: credit.formatUSD(figures.dti.paymentUSD),
              income: credit.formatUSD(figures.incomeUSD),
              ratio: credit.formatPct(figures.dti.ratio * 100),
              cap: credit.formatPct(figures.dti.cap * 100),
              stressed: credit.formatPct(figures.stressedDti.ratio * 100)
            }),
            actions: [assistantAction("risk-tab", "lender.assistant.action-risk")]
          };
        }

        if (intent === "borrower") {
          return {
            intent: intent,
            text: t("lender.assistant.answer-borrower", { borrower: loan.borrowerName }),
            actions: []
          };
        }

        if (intent === "documents") {
          var totals = analysisFor(loan);
          var outstanding = workspace.DOCUMENT_IDS.filter(function (documentId) {
            var verdict = verdictOf(loan, documentId);
            return verdict !== "accepted" && verdict !== "accepted-with-condition";
          });
          if (!outstanding.length) {
            return {
              intent: intent,
              text: t("lender.assistant.answer-documents-complete", { total: totals.documents }),
              actions: []
            };
          }
          return {
            intent: intent,
            text: t("lender.assistant.answer-documents-open", {
              accepted: totals.accepted,
              total: totals.documents,
              outstanding: outstanding
                .map(function (documentId) {
                  return t("doc." + documentId + ".name");
                })
                .join("; ")
            }),
            actions: outstanding.slice(0, 2).map(openDocumentAction)
          };
        }

        if (intent === "approval") {
          if (open.length) {
            return {
              intent: intent,
              text: t("lender.assistant.answer-approval-items", {
                count: open.length,
                items: listOfItems(open)
              }),
              actions: open
                .slice(0, 2)
                .filter(function (item) {
                  return Boolean(item.documentId);
                })
                .map(function (item) {
                  return openDocumentAction(item.documentId);
                })
            };
          }
          if (conditions.length) {
            return {
              intent: intent,
              text: t("lender.assistant.answer-approval-conditions", {
                count: conditions.length,
                conditions: listOfConditions(conditions)
              }),
              actions: []
            };
          }
          return {
            intent: intent,
            text: t("lender.assistant.answer-approval-ready", {
              amount: money(loan.requestedUF),
              authority: officerAuthority()
            }),
            actions: loan.readonly
              ? []
              : [assistantAction("approve", "lender.assistant.action-approve")]
          };
        }

        return { intent: "unknown", text: t("lender.assistant.answer-unknown"), actions: [] };
      }

      /* A fixture has no application behind it, so it says that rather than
         producing a number it does not have (§11). */
      function noFiguresAnswer(intent) {
        return { intent: intent, text: t("lender.assistant.answer-no-figures"), actions: [] };
      }

      function renderAssistantActions(actions) {
        if (!actions || !actions.length) return "";
        return (
          '<div class="assistant-actions">' +
          actions
            .map(function (item) {
              return (
                '<button type="button"' +
                (item.documentId
                  ? ' data-notification-document="' + escapeHtml(item.documentId) + '"'
                  : ' data-assistant-action="' + escapeHtml(item.action) + '"') +
                ">" +
                escapeHtml(item.label) +
                "</button>"
              );
            })
            .join("") +
          "</div>"
        );
      }

      /**
       * The condition riding on a document, as one line inside that document's
       * row rather than a row of its own.
       *
       * C1 *is* the title certificate and C2 *is* the tax folder — the same two
       * documents the exceptions are about. Given a row each, the panel listed
       * every document twice: its name twice, its `Open document` button twice,
       * and a count of four for two things to deal with. The condition is not a
       * second piece of work, it is a term attached to the first, so it is a
       * line under the finding it belongs to.
       *
       * It is worth its line because it says something the finding does not:
       * that this document is also gating the approval, and on what terms the
       * approval will be granted. On the certificate the two are plainly
       * different — the finding is a mortgage at Folio 1,842, the condition is
       * its release in the same deed.
       */
      function conditionNoteFor(loan, documentId) {
        if (!documentId || loan.readonly) return "";
        var found = null;
        loan.state.conditions.forEach(function (condition) {
          if (condition.cleared) return;
          if (workspace.CONDITION_DOCUMENTS[condition.id] === documentId) found = condition;
        });
        if (!found) return "";
        return (
          '<p class="condition-note" data-condition-id="' +
          escapeHtml(found.id) +
          '"><span class="condition-tag">' +
          text("lender.needs.condition-label", { id: found.id.toUpperCase() }) +
          "</span>" +
          text("lender.condition." + found.id) +
          "</p>"
        );
      }

      /**
       * A condition whose document has no open item — the exception was settled
       * by hand but the document is still not accepted, so the condition stands.
       * Rare, and it still needs a row, because a condition nobody can see is a
       * condition that surprises somebody at signing. It carries the way to the
       * document and nothing else: there is no finding to restate and no reply
       * box a condition can use.
       */
      function renderConditionRow(loan, condition) {
        var documentId = workspace.CONDITION_DOCUMENTS[condition.id] || null;
        return (
          '<article class="review-item condition-item" data-condition-id="' +
          escapeHtml(condition.id) +
          '" data-review-document="' +
          escapeHtml(documentId || "") +
          '"><div class="review-item-heading"><strong>' +
          text("lender.needs.condition-label", { id: condition.id.toUpperCase() }) +
          '</strong><span class="review-item-where">' +
          escapeHtml(documentId ? t("doc." + documentId + ".name") : t("lender.condition.open")) +
          "</span></div>" +
          '<p class="review-item-detail">' +
          text("lender.condition." + condition.id) +
          "</p>" +
          (documentId
            ? '<p class="condition-clears">' +
              text("lender.needs.condition-clears-document", {
                document: t("doc." + documentId + ".name")
              }) +
              '</p><div class="review-actions"><button type="button" data-notification-document="' +
              escapeHtml(documentId) +
              '">' +
              text("lender.needs.open-document", {
                document: t("doc." + documentId + ".name")
              }) +
              "</button></div>"
            : "") +
          "</article>"
        );
      }

      /**
       * Everything holding this case, one row per thing to deal with.
       *
       * The exceptions first, worst document first — sent back before still
       * being read — then any case-level item, then the rare condition standing
       * on a document with no open exception left. Each exception is answerable
       * where it sits: reply, or mark resolved, without going anywhere. This is
       * the panel the header alert jumps to, so it carries the id and takes
       * focus; `tabindex="-1"` makes it focusable for that jump without putting
       * it in the tab order twice.
       *
       * **One row per thing, and the count counts rows.** The panel briefly
       * listed the two exceptions and then the two conditions those same two
       * documents carry — four rows, two documents, each named twice with two
       * ways in — and reported 4 when there were two things to do. The condition
       * folded into the row it belongs to, and the count fell to the number of
       * things the officer actually has to pick up.
       *
       * Cleared conditions are not here. The panel is what needs the desk, and a
       * cleared condition needs nobody; it is in the audit trail with the moment
       * it cleared, and on the approval it is granted under.
       *
       * `needsReviewCount` is what the header alert calls too, so the two can
       * never disagree.
       */
      function needsReviewRows(loan) {
        var rows = openItemsByAttention(loan).map(function (item) {
          return { kind: "item", item: item, documentId: item.documentId || null };
        });
        var spoken = {};
        rows.forEach(function (row) {
          if (row.documentId) spoken[row.documentId] = true;
        });
        /* Only the conditions nothing above has already spoken for. */
        openConditionsOf(loan).forEach(function (condition) {
          var documentId = workspace.CONDITION_DOCUMENTS[condition.id] || null;
          if (documentId && spoken[documentId]) return;
          rows.push({ kind: "condition", condition: condition, documentId: documentId });
        });
        return rows;
      }

      function needsReviewCount(loan) {
        return needsReviewRows(loan).length;
      }

      function renderNeedsReview(loan) {
        var rows = needsReviewRows(loan);
        var waiting = rows.length;
        if (!waiting) {
          return (
            '<p class="all-clear" id="needs-review-card" tabindex="-1">' +
            '<span aria-hidden="true">✓</span> ' +
            text("lender.overview.all-clear") +
            "</p>"
          );
        }
        var pendingCount = Object.keys(pendingMessageIds(loan.state)).length;
        return (
          '<section class="review-queue-card needs-review-card" id="needs-review-card"' +
          ' tabindex="-1" aria-labelledby="review-queue-title">' +
          '<div class="section-heading"><h3 id="review-queue-title">' +
          text("lender.overview.needs-review-heading") +
          '</h3><span>' +
          text("lender.overview.open-count", { count: waiting }) +
          "</span></div>" +
          /* Same open work, seen from inside her actual words rather than a
             reply box: a way into the conversation tab for the messages
             specifically, since a reason chip that says "message" is not the
             same as reading what she wrote. */
          (pendingCount
            ? '<button type="button" class="review-queue-link" data-assistant-action="conversation-tab">' +
              text("lender.conversation.pending-link", { count: pendingCount }) +
              " →</button>"
            : "") +
          '<div class="review-queue-list">' +
          rows
            .map(function (row, position) {
              return row.kind === "condition"
                ? renderConditionRow(loan, row.condition)
                : renderReviewItem(
                    loan,
                    row.item,
                    position + 1,
                    waiting,
                    conditionNoteFor(loan, row.documentId)
                  );
            })
            .join("") +
          "</div></section>"
        );
      }

      function renderDealAssistant(loan, view) {
        var thread = (view && view.assistantThread) || [];
        return (
          '<section class="assistant-card" aria-labelledby="assistant-title">' +
          '<div class="assistant-head"><div><h3 id="assistant-title">' +
          text("lender.assistant.title") +
          "</h3><span>" +
          text("lender.assistant.subtitle") +
          "</span></div>" +
          /* The rail folds itself away, back into the launcher it came from. */
          '<button type="button" class="assistant-collapse"' +
          ' data-workspace-action="toggle-assistant" aria-expanded="true"' +
          ' aria-controls="assistant-rail" aria-label="' +
          text("lender.assistant.close-aria") +
          '"><span aria-hidden="true">×</span></button>' +
          '</div><div class="assistant-body" id="assistant-body">' +
          /* The whole right side is one panel now. "What the file says" was a
             second card stacked above this one, and the two were answering the
             same question in two boxes with two headings and two scrollbars —
             the reading of the case, and then what to do about the reading. It
             is the assistant's opening section instead: same content, one
             column, one scroll. */
          renderCaseAnalysis(loan) +
          /* Then the work the card has just counted — exceptions and conditions
             in one list, answerable in place. It reads top to bottom as one
             thought: how the file stands, what is waiting, what to do about it. */
          renderNeedsReview(loan) +
          /* The standing brief was here: the count of open items, a numbered
             "Next" list, and a row of buttons onto the documents behind them.
             All three restated the queue immediately above — the same two
             exceptions, counted again, listed again, linked again — so the
             panel said one thing three ways before the officer reached the
             composer. The queue is the brief; it carries its own count and its
             own resolutions, on the items themselves. */
          thread
            .map(function (turn) {
              return (
                '<div class="assistant-turn" data-voice="' +
                escapeHtml(turn.voice) +
                '"><strong>' +
                (turn.voice === "you"
                  ? text("lender.assistant.you")
                  : text("lender.assistant.title")) +
                "</strong><p>" +
                escapeHtml(turn.text) +
                "</p>" +
                (turn.voice === "assistant" ? renderAssistantActions(turn.actions) : "") +
                "</div>"
              );
            })
            .join("") +
          '</div><form class="assistant-composer" data-case-action="ask-assistant">' +
          '<label class="sr-only" for="assistant-input">' +
          text("lender.assistant.placeholder") +
          "</label>" +
          '<textarea id="assistant-input" name="question" rows="2" maxlength="300" placeholder="' +
          text("lender.assistant.placeholder") +
          '"></textarea>' +
          '<div class="assistant-composer-actions">' +
          renderAgentPicker(loan, view) +
          '<button type="submit" class="assistant-send" aria-label="' +
          text("lender.assistant.send-aria") +
          '">' +
          text("lender.assistant.send") +
          "</button></div>" +
          /* Its own live region, beside the control it reports on: a triggered
             agent is a change to the case and should not be announced only into
             the page-level status nobody is looking at. */
          '<p class="assistant-status" role="status" aria-live="polite">' +
          escapeHtml(
            view && view.assistantStatus
              ? view.assistantStatus
              : t(
                  loan.readonly
                    ? "lender.assistant.status-readonly"
                    : "lender.assistant.status-idle"
                )
          ) +
          "</p></form></section>"
        );
      }

      /* The agent menu sits above the button that opens it, because the composer
         is at the foot of the rail and a menu below it would be off-screen. */
      function renderAgentPicker(loan, view) {
        var open = Boolean(view && view.agentMenuOpen);
        return (
          '<div class="assistant-agent-picker">' +
          '<button type="button" class="assistant-trigger" data-assistant-action="toggle-agents"' +
          ' aria-expanded="' +
          open +
          '" aria-controls="assistant-agent-menu" aria-label="' +
          text("lender.assistant.trigger-aria") +
          '"><span aria-hidden="true">✦</span> ' +
          text("lender.assistant.trigger") +
          "</button>" +
          '<div class="assistant-agent-menu" id="assistant-agent-menu" role="group" aria-label="' +
          text("lender.assistant.trigger-menu-aria") +
          '"' +
          (open ? "" : " hidden") +
          ">" +
          DEAL_AGENTS.map(function (agent) {
            /* A fixture changes nothing, so the three agents that act are
               offered and refused rather than quietly missing (§5.4). */
            var blocked = loan.readonly && !agent.reads;
            return (
              '<button type="button" data-assistant-agent="' +
              agent.id +
              '"' +
              (blocked ? " disabled" : "") +
              "><strong>" +
              text("lender.assistant.agent." + agent.id) +
              "</strong><span>" +
              text("lender.assistant.agent." + agent.id + "-note") +
              "</span></button>"
            );
          }).join("") +
          "</div></div>"
        );
      }

      /* ======================================================== the drawer itself */

      function workspaceChips(loan, open) {
        var chips = ['<span>' + escapeHtml(stageLabel(loan.stage)) + "</span>"];
        chips.push("<span>" + escapeHtml(money(loan.requestedUF)) + "</span>");
        if (loan.deedDate) {
          chips.push(
            "<span>" +
              text("lender.card.deed-date", { date: credit.formatDate(loan.deedDate) }) +
              "</span>"
          );
        }
        /* No `Needs review` chip. The alert button is on the same header line,
           says the same number, and unlike a chip it goes somewhere — two of
           them side by side was the count twice and the way in once. The chip
           on the *board* card stays: out there the case is a tile among thirty
           and there is no header to put a button in. */
        return '<div class="workspace-chips">' + chips.join("") + "</div>";
      }

      /* §5.5: a modal dialog labelled by its own heading, over a backdrop, with a
         real tablist. The focus trap, the body scroll lock, the Escape key and the
         return of focus to the card that opened it are init()'s side of the same
         contract. */
      function renderWorkspace(loan, uiState) {
        if (!loan) return "";
        var view = assign(assign({}, DEFAULT_VIEW_STATE), uiState || {});
        var tab = knownTab(view.activeTab);
        var full = knownMode(view.panelMode) === "full";
        var assistantOpen = Boolean(view.assistantOpen);
        var open = workspace.openReviewItems(loan.state);
        var conversationPendingCount = Object.keys(pendingMessageIds(loan.state)).length;
        var body =
          tab === "application"
            ? renderApplicationTab(loan)
            : tab === "documents"
              ? renderDocumentsTab(loan)
              : tab === "conversation"
                ? renderConversationTab(loan)
                : tab === "risk"
                  ? renderRiskTab(loan)
                  : tab === "audit"
                    ? renderAuditTab(loan)
                    : renderOverviewTab(loan, view);

        return (
          '<div class="workspace-backdrop" data-workspace-action="close"></div>' +
          '<aside class="loan-workspace' +
          (full ? " full-screen" : "") +
          '" id="case-workspace" role="dialog" aria-modal="true" aria-labelledby="workspace-title">' +
          /* The header, the tabs and the panel are one column; the rail is its
             sibling rather than its child, so the assistant runs the full height
             of the drawer instead of starting below the chips. */
          '<div class="workspace-main">' +
          '<header class="workspace-header"><div>' +
          (full
            ? '<button type="button" class="back-board" data-workspace-action="close">' +
              text("common.back-to-board") +
              "</button>"
            : "") +
          '<span class="metric-label">' +
          text("lender.workspace.eyebrow", { case: loan.caseId }) +
          '</span><h2 id="workspace-title">' +
          escapeHtml(loan.address) +
          "</h2><p>" +
          text("lender.workspace.borrower-line", {
            borrower: loan.borrowerName
          }) +
          "</p>" +
          (loan.readonly
            ? '<p class="readonly-note">' + text("common.readonly-loan") + "</p>"
            : "") +
          workspaceChips(loan, open) +
          '</div><div class="workspace-actions">' +
          /* The alert first, because it is the only control here with something
             to say rather than only somewhere to go, and it is about this case.
             The drive link sits right beside it — another way into this case's
             own record, not the whole portal's. Then the display switches,
             which are about the whole portal. Then expand and close, in the
             corner, where a close button belongs. The cluster used to lead,
             which put the least-touched control nearest the title and the
             loudest one buried in the middle. */
          renderNeedsReviewAlert(loan) +
          renderWorkspaceDriveLink(loan) +
          renderControlCluster(view, "case") +
          (full
            ? ""
            : '<button type="button" data-workspace-action="expand" aria-label="' +
              text("lender.workspace.expand-aria") +
              '"><span aria-hidden="true">↗</span></button>') +
          '<button type="button" data-workspace-action="close" aria-label="' +
          text("lender.workspace.close-aria") +
          '"><span aria-hidden="true">×</span></button>' +
          "</div></header>" +
          '<div class="workspace-tabs" role="tablist" aria-label="' +
          text("lender.tabs.aria-label") +
          '">' +
          WORKSPACE_TABS.map(function (name) {
            /* Said twice, once for the eye and once for the ear: the bubble is
               `aria-hidden` because a screen reader announcing "two" right
               after "Conversation, tab" reads as a count of tabs, not of
               messages — the sr-only phrase after it says what the two
               actually are (§9, never colour or a lone digit alone). */
            var badge =
              name === "conversation" && conversationPendingCount
                ? '<span class="tab-badge" aria-hidden="true">' +
                  conversationPendingCount +
                  "</span>" +
                  '<span class="sr-only">, ' +
                  text("lender.conversation.pending-link", { count: conversationPendingCount }) +
                  "</span>"
                : "";
            return (
              '<button id="tab-' +
              name +
              '" type="button" role="tab" data-workspace-tab="' +
              name +
              '" aria-selected="' +
              (tab === name) +
              '" tabindex="' +
              (tab === name ? "0" : "-1") +
              '" aria-controls="workspace-panel">' +
              text("lender.tab." + name) +
              badge +
              "</button>"
            );
          }).join("") +
          "</div>" +
          /* The rail carries the verdict on the file, beside whatever tab the
             officer is reading rather than behind one of them. The WhatsApp
             thread itself lives one tab over, in Conversation, rather than in
             the rail: it is a record to read start to finish, not a fact to
             glance at beside whichever other tab is open. The sample notice
             that used to sit on top of the record is gone too; it is a fact
             about the case, so it is in the bell with the rest. */
          '<div class="workspace-body">' +
          '<div class="workspace-panel" id="workspace-panel" tabindex="0" role="tabpanel" aria-labelledby="tab-' +
          tab +
          '">' +
          body +
          "</div></div></div>" +
          /* The rail is a panel the officer opens, not a column she reads past.
             It floats over the bottom-right corner of the drawer and starts
             collapsed behind the launcher below it. */
          '<div class="workspace-rail" id="assistant-rail"' +
          (assistantOpen ? "" : " hidden") +
          ">" +
          renderDealAssistant(loan, view) +
          "</div>" +
          renderAssistantLauncher(loan, view) +
          "</aside>"
        );
      }

      /* The collapsed assistant: a mark in the corner, with the count of what is
         waiting on it so the officer knows there is something inside before she
         opens it. Once the rail is up the rail carries its own collapse control,
         so the launcher is not on screen to sit on top of it.
         Rendered whether the rail is open or not, `hidden` rather than left
         out — the toggle handler flips both elements' `hidden` in place, with
         no re-render, so folding the assistant away and back never throws out
         a half-typed question or the file underneath it (§toggle-assistant). */
      function renderAssistantLauncher(loan, view) {
        return (
          '<button type="button" class="assistant-launcher"' +
          (view && view.assistantOpen ? " hidden" : "") +
          ' data-workspace-action="toggle-assistant" aria-expanded="false"' +
          ' aria-controls="assistant-rail" aria-label="' +
          text("lender.assistant.open-aria") +
          '"><span class="assistant-launcher-mark" aria-hidden="true">✦</span>' +
          '<span class="assistant-launcher-label">' +
          text("lender.assistant.title") +
          "</span>" +
          "</button>"
        );
      }

      /* ============================================================ the keyboard */

      var WORKSPACE_FOCUSABLE =
        'button:not([disabled]):not([tabindex="-1"]),a[href]:not([tabindex="-1"]),' +
        'input:not([disabled]):not([tabindex="-1"]),select:not([disabled]):not([tabindex="-1"]),' +
        'textarea:not([disabled]):not([tabindex="-1"]),[tabindex]:not([tabindex="-1"])';

      /* Tab and Shift+Tab wrap inside the dialog, and focus that has escaped it is
         pulled back in. The active element is an argument rather than a global, so
         the trap is testable without a browser. Returns true when it moved focus. */
      function trapFocus(event, container, activeElement) {
        if (!event || event.key !== "Tab" || !container) return false;
        var controls = [].slice.call(container.querySelectorAll(WORKSPACE_FOCUSABLE)).filter(
          function (control) {
            return !control.hidden;
          }
        );
        if (!controls.length) return false;
        var first = controls[0];
        var last = controls[controls.length - 1];
        var outside = controls.indexOf(activeElement) === -1;
        var target = null;
        if (event.shiftKey && (activeElement === first || outside)) target = last;
        else if (!event.shiftKey && (activeElement === last || outside)) target = first;
        if (!target) return false;
        event.preventDefault();
        target.focus();
        return true;
      }

      var TAB_KEYS = ["ArrowLeft", "ArrowRight", "Home", "End"];

      /* Escape closes; Tab is trapped; the arrows, Home and End move between tabs
         when the key came from one (§9). The whole context is injected. */
      function handleWorkspaceKeydown(event, workspaceContext) {
        var ctx = workspaceContext || {};
        if (!ctx.isOpen || !ctx.container) return;
        if (event.key === "Escape") {
          event.preventDefault();
          if (typeof ctx.close === "function") ctx.close();
          return;
        }
        if (trapFocus(event, ctx.container, ctx.activeElement)) return;
        var current = event.target && event.target.closest ? event.target.closest('[role="tab"]') : null;
        if (!current || TAB_KEYS.indexOf(event.key) === -1) return;
        event.preventDefault();
        var tabs = [].slice.call(ctx.container.querySelectorAll('[role="tab"]'));
        var index = tabs.indexOf(current);
        var next =
          event.key === "Home"
            ? 0
            : event.key === "End"
              ? tabs.length - 1
              : event.key === "ArrowRight"
                ? (index + 1) % tabs.length
                : (index - 1 + tabs.length) % tabs.length;
        if (tabs[next]) tabs[next].click();
      }

      /* ============================================================= the actions */

      /* Every action is pure over (state, options) and reports the same shape:
         the new state, whether anything happened, and the announcement the live
         region should read. Nothing here resolves a real clock or writes to the
         DOM, so the suite drives the whole of §5.6 synchronously. */
      function outcome(previous, next, key, params) {
        return {
          state: next,
          changed: next !== previous,
          announcement: { key: key, params: params || null }
        };
      }

      function actionTimestamp(options) {
        var stamp = options && options.timestamp;
        return typeof stamp === "string" && !Number.isNaN(Date.parse(stamp)) ? stamp : DEMO_NOW;
      }

      function arrivalTimestamp(options, base) {
        var stamp = options && options.arrivalTimestamp;
        return typeof stamp === "string" && !Number.isNaN(Date.parse(stamp))
          ? stamp
          : advanceTimestamp(base, ARRIVAL_DELAY_MS);
      }

      /* One at a time, by id: an arrival closes the items about its own document
         and never touches unrelated open work (§4.2). */
      /* The document work this arrival answers, closed one item at a time.
         Matching on the document alone was not enough: her message is filed
         against the document she is asking about, so an arrival about that same
         document used to close her message too — unread, un-replied, and stamped
         as though a human had handled it (§4.2). Only document work is settled
         by a document; a message is settled by an answer. */
      function resolveItemsForDocument(state, documentId, timestamp) {
        var next = state;
        workspace.openReviewItems(state).forEach(function (item) {
          if (item.documentId !== documentId) return;
          if (!workspace.isDocumentWork(item)) return;
          next = workspace.resolveReviewItem(next, item.id, timestamp);
        });
        return next;
      }

      /* The mirror image of `resolveItemsForDocument`, for the notification's
         other half: a message or a deadline, never a verdict, so answering it
         is exactly what the Conversation tab's own send button is for. Case-wide
         rather than one document — the tab is one thread, not one per
         document, and an unprompted send already picks whichever document
         still has open work over any other by the same logic (see
         `conversationDocumentId`); scoping the resolve to one document only
         would leave the others it did not happen to land on stuck open. Sending
         settles every one of them: a notification a message already answered
         has nothing left to hold it open, and the Deal Assistant queue would
         otherwise keep asking for a reply that has already gone out (§ the
         Deal Assistant is notifications only). */
      function resolveConversationOnlyItems(state, timestamp) {
        var next = state;
        workspace.openReviewItems(state).forEach(function (item) {
          if (CONVERSATION_ONLY_TYPES.indexOf(item.type) === -1) return;
          next = workspace.resolveReviewItem(next, item.id, timestamp);
        });
        return next;
      }

      /* The seam and the callback, in one place: schedule `apply` and hand its
         outcome to whoever asked. `readState` lets the page feed the callback the
         state as it is when the event lands, so two arrivals in flight at once
         cannot overwrite each other; a test that omits it gets the state the
         action itself produced. */
      function scheduleArrival(options, base, apply) {
        var schedule = options && typeof options.later === "function" ? options.later : later;
        var read = options && typeof options.readState === "function" ? options.readState : null;
        return schedule(ARRIVAL_DELAY_MS, function () {
          var current = read ? read() : base;
          var result = apply(current);
          if (options && typeof options.onArrival === "function") options.onArrival(result);
          return result;
        });
      }

      function commitReply(state, reviewItemId, replyText, options) {
        var stamp = actionTimestamp(options);
        var body = String(replyText === null || replyText === undefined ? "" : replyText).trim();
        if (!body) return outcome(state, state, "lender.review.blank-reply");
        var item = null;
        workspace.openReviewItems(state).forEach(function (candidate) {
          if (candidate.id === reviewItemId) item = candidate;
        });
        var next = workspace.replyAndResolve(state, reviewItemId, body, stamp);
        if (next === state) return outcome(state, state, "lender.review.blank-reply");
        var replied = outcome(state, next, "lender.review.reply-announcement", {
          borrower: (options && options.borrowerName) || FALLBACK_CASE.borrower.fullName
        });
        /* `options.storage` is the bridge: given one, the reply also goes onto it so
           her WhatsApp thread shows it within a second (§7). Omitted — which is how
           the suite drives most of §5.6 — the reply stays on this surface. */
        if (options && options.storage !== undefined) {
          replied.bridged = bridgeSend(options.storage, {
            from: BRIDGE_ROLE,
            text: body,
            timestamp: stamp,
            documentId: item ? item.documentId : null
          }).ok;
        }
        return replied;
      }

      /**
       * A message from the desk straight to her thread, outside any review item.
       * The officer should be able to say "I'll come back to you today" without
       * first finding a queue entry to hang it on — that is a click and a
       * concept she does not need. It files against the document the case is
       * actually about, so the document record and the conversation agree.
       */
      function commitConversationMessage(state, text, options) {
        var stamp = actionTimestamp(options);
        var body = String(text === null || text === undefined ? "" : text).trim();
        if (!body) return outcome(state, state, "lender.conversation.blank");
        var documentId = (options && options.documentId) || conversationDocumentId(state);
        var next = workspace.sendLenderMessage(state, documentId, body, stamp);
        if (next === state) return outcome(state, state, "lender.conversation.blank");
        next = resolveConversationOnlyItems(next, stamp);
        var sent = outcome(state, next, "lender.conversation.sent");
        if (options && options.storage !== undefined) {
          sent.bridged = bridgeSend(options.storage, {
            from: BRIDGE_ROLE,
            text: body,
            timestamp: stamp,
            documentId: documentId
          }).ok;
        }
        return sent;
      }

      /* Which document an unprompted message belongs to: whatever still has open
         work, else the last document anyone spoke about, else the first. The
         officer is talking about the thing that needs attention. */
      function conversationDocumentId(state) {
        var open = workspace.openReviewItems(state);
        for (var index = 0; index < open.length; index++) {
          if (open[index].documentId) return open[index].documentId;
        }
        var latest = null;
        var newest = "";
        workspace.DOCUMENT_IDS.forEach(function (documentId) {
          var record = state.documents[documentId];
          if (!record) return;
          record.messages.forEach(function (message) {
            if (message.timestamp >= newest) {
              newest = message.timestamp;
              latest = documentId;
            }
          });
        });
        return latest || workspace.DOCUMENT_IDS[0];
      }

      function commitManualResolution(state, reviewItemId, options) {
        var stamp = actionTimestamp(options);
        var item = null;
        workspace.openReviewItems(state).forEach(function (candidate) {
          if (candidate.id === reviewItemId) item = candidate;
        });
        var next = workspace.resolveReviewItem(state, reviewItemId, stamp);
        if (next === state) return outcome(state, state, "lender.review.blank-reply");
        return outcome(state, next, "lender.review.resolved-announcement", {
          reason: t("review." + item.type)
        });
      }

      /**
       * The queue's one decision, routed to the model function that already
       * knows how to make it.
       *
       * Nothing new happens here. Accepting from the queue is the same
       * `commitVerdictOverride` the document record calls, sending back is the
       * same `commitDocumentRequest`, replying is the same `commitReply`. The
       * value of the select is a route, not a second implementation — which is
       * why accepting an item leaves the same audit line, settles the same
       * conditions and refuses on the same grounds wherever it is done from.
       *
       * `send-back` reads the reply box as the reason, because a rejection the
       * borrower is never told about is not a request (§3.2). The same box, the
       * same words: what the desk types is what she reads, whichever way the
       * decision goes.
       */
      function commitReviewDecision(state, reviewItemId, decision, text, condition, options) {
        var item = null;
        workspace.openReviewItems(state).forEach(function (candidate) {
          if (candidate.id === reviewItemId) item = candidate;
        });
        if (!item) return outcome(state, state, "lender.review.blank-reply");

        if (decision === "resolve") return commitManualResolution(state, reviewItemId, options);
        if (decision === "reply") return commitReply(state, reviewItemId, text, options);

        /* Everything below writes a verdict, and a verdict needs a document. */
        if (!item.documentId) return outcome(state, state, "lender.review.decision-refused");

        if (decision === "send-back") {
          return commitDocumentRequest(state, item.documentId, text, options);
        }
        if (decision === "accepted" || decision === "accepted-with-condition") {
          var settled = commitVerdictOverride(state, item.documentId, decision, condition, options);
          /* Accepting the document does not answer her — a `borrower-message`
             is closed only by a reply (§workspace isDocumentWork), so an
             exception item the verdict already resolved leaves nothing to
             answer, but a question attached to a document that turns out to be
             fine still needs the words in this box sent to her, not dropped
             the moment "accepted" is picked. commitReply is a no-op if the
             item closed with the verdict, so this never double-answers it. */
          var words = String(text === null || text === undefined ? "" : text).trim();
          if (!words) return settled;
          var answered = commitReply(settled.state, reviewItemId, words, options);
          return answered.changed
            ? outcome(state, answered.state, answered.announcement.key, answered.announcement.params)
            : settled;
        }
        return outcome(state, state, "lender.review.decision-refused");
      }

      /* ------------------------------------------- the officer's own decision
       *
       * `setVerdict` already stamps the change into the audit trail as the
       * lender's and pushes the new verdict onto the document's history, so an
       * override is a normal recorded decision rather than an edit of the
       * record. It refuses a no-op and refuses `accepted-with-condition` with no
       * condition; both refusals are announced, because a control that silently
       * does nothing is worse than one that says why (§9).
       */
      function commitVerdictOverride(state, documentId, verdict, condition, options) {
        var stamp = actionTimestamp(options);
        var record = state.documents[documentId];
        if (!record || record.verdict === "not-uploaded") {
          return outcome(state, state, "lender.status.override-refused");
        }
        var wording = String(condition === null || condition === undefined ? "" : condition).trim();
        if (verdict === "accepted-with-condition" && !wording) {
          return outcome(state, state, "lender.status.override-needs-condition");
        }
        var next = workspace.setVerdict(state, documentId, verdict, { condition: wording }, stamp);
        if (next === state) return outcome(state, state, "lender.status.override-unchanged");
        /* Settling a document by hand answers whatever was open on it: the desk
           has just said what it thinks, so it is no longer waiting on itself. */
        next = resolveItemsForDocument(next, documentId, stamp);
        /* And the condition that document answers moves with it. The officer's
           own decision is a settlement like any other: accepting the title
           certificate here clears the release condition exactly as the
           developer's reply would, so the gate, the brief and the analysis card
           all read the case she has just made rather than the one she found. */
        next = workspace.settleConditionsFor(next, documentId, stamp);
        var applied = outcome(state, next, "lender.status.override-applied", {
          document: t("doc." + documentId + ".name"),
          verdict: t("verdict." + verdict)
        });
        /* Closing something on this side is not closed for her until her own
           portal says so too: without this her checklist kept showing whatever
           it showed before the desk ever decided, on a document the desk had
           already settled. The same words either way — what the notice reads
           in the audit trail is what her thread reads over the bridge. */
        if (options && options.storage !== undefined) {
          var notice = t("lender.conversation.verdict-notice", {
            document: t("doc." + documentId + ".name"),
            verdict: t("verdict." + verdict)
          });
          if (verdict === "accepted-with-condition" && wording) notice += " " + wording;
          applied.bridged = bridgeSend(options.storage, {
            from: BRIDGE_ROLE,
            text: notice,
            timestamp: stamp,
            documentId: documentId,
            verdict: verdict,
            condition: wording || null
          }).ok;
        }
        return applied;
      }

      /**
       * Send it back to her. One gesture, two halves that must not come apart:
       * the document goes to `rejected`, and she is told why in the thread her
       * portal shows. A rejection she is never told about is not a request, so
       * the reason is required rather than optional.
       */
      function commitDocumentRequest(state, documentId, reason, options) {
        var stamp = actionTimestamp(options);
        var record = state.documents[documentId];
        if (!record || record.verdict === "not-uploaded") {
          return outcome(state, state, "lender.status.override-refused");
        }
        var body = String(reason === null || reason === undefined ? "" : reason).trim();
        if (!body) return outcome(state, state, "lender.status.request-needs-reason");

        var next = workspace.setVerdict(state, documentId, "rejected", null, stamp);
        next = workspace.sendLenderMessage(next, documentId, body, stamp);
        if (next === state) return outcome(state, state, "lender.status.override-unchanged");
        /* Sending it back re-opens whatever that document had cleared. A
           condition that stayed green over a document the desk has just
           rejected would read as approvable, and it is not. */
        next = workspace.settleConditionsFor(next, documentId, stamp);
        var sent = outcome(state, next, "lender.status.request-sent", {
          document: t("doc." + documentId + ".name")
        });
        if (options && options.storage !== undefined) {
          sent.bridged = bridgeSend(options.storage, {
            from: BRIDGE_ROLE,
            text: body,
            timestamp: stamp,
            documentId: documentId
          }).ok;
        }
        return sent;
      }

      /* The developer's answer. Document 9 closes **accepted with a condition** —
         the fifth verdict, not green — the condition text is the one the deed
         inherits, and c1 clears (§3.2, §5.6). */
      function developerReplyArrives(state, timestamp) {
        var next = workspace.setVerdict(
          state,
          "title-certificate",
          "accepted-with-condition",
          { condition: t("lender.condition.c1") },
          timestamp
        );
        next = recordEvent(next, {
          timestamp: timestamp,
          actor: "third-party",
          action: "developer-reply-received",
          documentId: "title-certificate",
          details: t("lender.email.reply-received")
        });
        /* c1 clears because the certificate is now settled, not because this
           particular route says so — same rule as the officer's override. */
        next = workspace.settleConditionsFor(next, "title-certificate", timestamp);
        next = resolveItemsForDocument(next, "title-certificate", timestamp);
        return outcome(state, next, "lender.email.reply-received");
      }

      function requestDeveloperConfirmation(state, options) {
        var stamp = actionTimestamp(options);
        var arrival = arrivalTimestamp(options, stamp);
        var next = recordEvent(state, {
          timestamp: stamp,
          actor: "lender",
          action: "developer-query-sent",
          documentId: "title-certificate",
          details: t("lender.email.subject", {
            case: (options && options.caseId) || FALLBACK_CASE.caseId
          })
        });
        scheduleArrival(options, next, function (current) {
          return developerReplyArrives(current, arrival);
        });
        return outcome(state, next, "lender.email.sent-announcement");
      }

      /* Her upload, from her own portal: document 5 accepted, its exception
         closed, c2 clear. The trail records the borrower, not the lender (§5.6). */
      function borrowerUploadArrives(state, timestamp) {
        var next = workspace.registerUpload(
          state,
          "tax-folder",
          { filename: t("borrower.file.tax-folder"), verdict: "accepted" },
          timestamp
        );
        next = resolveItemsForDocument(next, "tax-folder", timestamp);
        next = workspace.settleConditionsFor(next, "tax-folder", timestamp);
        return outcome(state, next, "lender.reminder.upload-received");
      }

      function remindBorrower(state, options) {
        var stamp = actionTimestamp(options);
        var arrival = arrivalTimestamp(options, stamp);
        var next = recordEvent(state, {
          timestamp: stamp,
          actor: "lender",
          action: "borrower-reminder-sent",
          documentId: "tax-folder",
          details: t("lender.reminder.sent")
        });
        scheduleArrival(options, next, function (current) {
          return borrowerUploadArrives(current, arrival);
        });
        return outcome(state, next, "lender.reminder.sent");
      }

      /* Within her delegated authority: it says so and does nothing else (§5.6). */
      function escalate(state) {
        return outcome(state, state, "lender.action.escalate-response", {
          authority: officerAuthority()
        });
      }

      /* Re-ordering a service moves the one field the case tracks for a third
         party (the inspection) back to pending, on the trail — the title and
         the appraisal are governed elsewhere on the case and are not touched
         (§ workspace.reorderInspection). */
      function reorderServices(state, options) {
        var stamp = actionTimestamp(options);
        var next = workspace.reorderInspection(state, stamp);
        return outcome(state, next, "lender.assistant.agent.reorder-ran");
      }

      /* The gate. `approve` refuses unless both gating conditions are cleared, and
         that is read from the conditions themselves — skip the developer query and
         approval is genuinely impossible (§3.4). */
      function approveWithConditions(state, options) {
        var stamp = actionTimestamp(options);
        var next = workspace.approve(
          state,
          { conditions: options && options.conditions },
          stamp
        );
        if (next === state) {
          var refusal = outcome(state, state, "lender.action.approve-blocked");
          refusal.allowed = false;
          return refusal;
        }
        var allowed = outcome(state, next, "lender.decision.outcome");
        allowed.allowed = true;
        return allowed;
      }

      /* The two decisions taken by hand. Each refuses without words and says so
         in the live region rather than quietly doing nothing, and each refuses a
         case that already has an outcome — the way back from a decision is the
         reset, not a second decision written over the first. */
      function declineCase(state, reason, options) {
        var stamp = actionTimestamp(options);
        var caseId = (options && options.caseId) || CASE_ID;
        if (!String(reason || "").trim()) {
          var blank = outcome(state, state, "lender.decision.reason-required");
          blank.allowed = false;
          return blank;
        }
        var next = workspace.decline(state, { reason: reason }, stamp);
        if (next === state) {
          var refused = outcome(state, state, "lender.decision.decided-already", { case: caseId });
          refused.allowed = false;
          return refused;
        }
        var declined = outcome(state, next, "lender.decision.declined-announcement", { case: caseId });
        declined.allowed = true;
        return declined;
      }

      function overrideApproval(state, reason, options) {
        var stamp = actionTimestamp(options);
        var caseId = (options && options.caseId) || CASE_ID;
        if (!String(reason || "").trim()) {
          var missing = outcome(state, state, "lender.decision.reason-required");
          missing.allowed = false;
          return missing;
        }
        var next = workspace.approve(
          state,
          { override: true, reason: reason, conditions: options && options.conditions },
          stamp
        );
        if (next === state) {
          var blocked = outcome(state, state, "lender.decision.decided-already", { case: caseId });
          blocked.allowed = false;
          return blocked;
        }
        var carried = outcome(state, next, "lender.decision.override-announcement", { case: caseId });
        carried.allowed = true;
        return carried;
      }

      function signApproval(state, options) {
        var stamp = actionTimestamp(options);
        var pending = decisionRecord(state, options && options.loan);
        if (!pending || pending.signed) {
          var refused = outcome(state, state, "lender.action.approve-blocked");
          refused.record = null;
          return refused;
        }
        /* Through the engine, not as a bare trail entry: the signature is the
           milestone that carries the case from Approved into Waiting to close,
           so the board has to be able to see it. */
        var next = workspace.recordSignature(
          state,
          { details: pending.conditions.join("; ") },
          stamp
        );
        if (next === state) {
          var unchanged = outcome(state, state, "lender.action.approve-blocked");
          unchanged.record = null;
          return unchanged;
        }
        var signed = outcome(state, next, "lender.decision.announcement", {
          case: pending.caseId
        });
        signed.record = decisionRecord(next, options && options.loan);
        return signed;
      }

      /* Everything back to the state the case arrived in (§5.6). The trail resets
         with it: an opening state that remembers being reset is not the opening
         state. Each live case resets to its own opening state, not the
         primary case's. */
      function resetCase(options) {
        var data = (options && options.caseData) || FALLBACK_CASE;
        var opening = data.openingState();
        return outcome(null, opening, "lender.status.reset");
      }

      /* ================================================================== init */

      /* The board and the drawer. The board is the five nav views, the search box,
         the three selects and the cards; the drawer is the five tabs, the review
         queue, §5.6's gestures and the two events that arrive on their own. Every
         state change is announced into the live region. */
      /* The shell's own strings — title, lang, the skip link — sit outside every
         render function, so a language change refreshes them from here. */
      function applyShellCopy() {
        document.title = t("lender.page-title");
        if (document.documentElement) document.documentElement.lang = copy.locale();
        [].slice.call(document.querySelectorAll("[data-copy]")).forEach(function (node) {
          node.textContent = t(node.getAttribute("data-copy"));
        });
      }

      function init() {
        /* Whatever the other surface was last read in, before anything prints. */
        loadLocale();
        applyShellCopy();
        var root = document.getElementById("lender-app");
        var status = document.getElementById("lender-status");
        var historyApi = globalThis.history;
        var locationLike = globalThis.location || { pathname: "", search: "", hash: "" };
        /* Whatever the borrower page left in this tab's session storage, or the
           built-in fixture — so the board is complete either way (§7). Every
           live case keeps its own slot: the primary case's storage is shared
           with the borrower page, the second live case's is this tab's alone. */
        var liveStates = {};
        var primaryOpened = null;
        LIVE_CASES.forEach(function (data) {
          var opened = loadCase(caseStorage(), data);
          liveStates[data.caseId] = opened.state;
          if (data.caseId === CASE_ID) primaryOpened = opened;
        });

        if (pendingCaseReset(bridgeStorage(), caseStorage())) {
          var initialReset = applyCaseReset(bridgeStorage(), caseStorage());
          if (initialReset && initialReset.changed) liveStates[CASE_ID] = initialReset.state;
        }

        var viewState = assign(assign({}, DEFAULT_VIEW_STATE), parseCaseHash(locationLike.hash));

        function loans() {
          return buildPortfolio(liveStates);
        }

        function caseIds(list) {
          var ids = new Set();
          list.forEach(function (loan) {
            ids.add(loan.caseId);
          });
          return ids;
        }

        var actionClock = DEMO_NOW;
        var trigger = { caseId: null, windowY: 0, boardX: 0 };
        var panelScroll = 0;

        /* Every gesture takes the next instant of the demo's own clock: no page
           code reads a real one, so two runs of the demo produce the same trail. */
        function nextInstant() {
          actionClock = advanceTimestamp(actionClock, ACTION_STEP_MS);
          return actionClock;
        }

        function announce(key, params) {
          if (status) status.textContent = t(key, params);
        }

        /* Storage refused: keep working in memory and say so once, into the same
           role="status" region every other change is announced into (§7). */
        function announceViewOnly() {
          var notice = viewOnlyAnnouncement();
          if (notice) announce(notice.key, notice.params);
        }

        /* Every change to a live case is written back to its own key, so
           switching to the borrower view in this tab hands over the primary
           case as it now stands. */
        function persist(caseId) {
          if (!saveCase(caseStorage(), liveStates[caseId], liveCaseData(caseId))) announceViewOnly();
        }

        /* The actions report `{ key, params }` rather than English. */
        function announceOutcome(result) {
          if (result && result.announcement) {
            announce(result.announcement.key, result.announcement.params);
          }
        }

        function announceFilters(list) {
          announce("lender.status.filtered", {
            count: filterLoans(list, viewState, DEMO_NOW).length
          });
        }

        function syncHash(mode) {
          if (historyApi) syncCaseHistory(historyApi, locationLike, viewState, mode);
        }

        function selectedLoan(list) {
          var found = null;
          list.forEach(function (loan) {
            if (loan.caseId === viewState.selectedCaseId) found = loan;
          });
          return found;
        }

        function panel() {
          return document.getElementById("workspace-panel");
        }

        /* A re-render replaces the panel, so where it was scrolled to is kept
           across a resolve, a tab change or an arriving event. */
        function rememberScroll() {
          var current = panel();
          if (current) panelScroll = current.scrollTop || 0;
        }

        function render() {
          var list = loans();
          var loan = selectedLoan(list);
          if (root) {
            root.innerHTML =
              renderPortfolioPage(list, viewState, DEMO_NOW) + renderWorkspace(loan, viewState);
          }
          /* Body scroll is locked while the dialog is up (§5.5); the board itself
             is already inert and hidden from assistive technology. */
          if (document.body) document.body.classList.toggle("workspace-open", Boolean(loan));
          var container = document.getElementById("case-workspace");
          if (container) {
            var current = panel();
            if (current) current.scrollTop = panelScroll;
            /* Focus enters the dialog once, and is not stolen back on every
               re-render from wherever the user has moved it. */
            if (!container.contains(document.activeElement)) {
              var tab = document.getElementById("tab-" + knownTab(viewState.activeTab));
              if (tab) tab.focus();
            }
          }
          bind(list);
          /* "Open the document" finishes here, one render later: the record is
             unfolded, brought into view and given the focus, so the comparison
             and the override are what the officer is looking at. */
          if (viewState.focusDocumentId && root) {
            var wanted = root.querySelector(
              'details[data-document-id="' + viewState.focusDocumentId + '"]'
            );
            viewState.focusDocumentId = null;
            if (wanted) {
              wanted.open = true;
              if (wanted.scrollIntoView) wanted.scrollIntoView({ block: "start" });
              var summary = wanted.querySelector("summary");
              if (summary && summary.focus) summary.focus();
            }
          }
          return list;
        }

        /* Switching tabs — or anything else that is purely about the drawer —
           does not touch the board underneath: nothing a tab shows was ever
           drawn from the board's own count, card or filter state. Rebuilding
           the board's roughly one thousand nodes anyway, just to swap which
           tab's markup the drawer prints, is where a tab click ends up looking
           like the page reloading. This replaces only the two top-level nodes
           `renderWorkspace` produces — same scroll and focus handling as
           `render()` itself, just aimed at a narrower target — and leaves the
           board's nodes, and the listeners already on them, standing. */
        function renderWorkspaceOnly() {
          var list = loans();
          var loan = selectedLoan(list);
          if (root) {
            var oldBackdrop = root.querySelector(".workspace-backdrop");
            if (oldBackdrop) oldBackdrop.remove();
            var oldAside = document.getElementById("case-workspace");
            if (oldAside) oldAside.remove();
            var html = renderWorkspace(loan, viewState);
            if (html) {
              var wrapper = document.createElement("div");
              wrapper.innerHTML = html;
              while (wrapper.firstChild) root.appendChild(wrapper.firstChild);
            }
          }
          if (document.body) document.body.classList.toggle("workspace-open", Boolean(loan));
          var container = document.getElementById("case-workspace");
          if (container) {
            var current = panel();
            if (current) current.scrollTop = panelScroll;
            if (!container.contains(document.activeElement)) {
              var tab = document.getElementById("tab-" + knownTab(viewState.activeTab));
              if (tab) tab.focus();
            }
          }
          bindWorkspace(list);
          if (viewState.focusDocumentId && root) {
            var wanted = root.querySelector(
              'details[data-document-id="' + viewState.focusDocumentId + '"]'
            );
            viewState.focusDocumentId = null;
            if (wanted) {
              wanted.open = true;
              if (wanted.scrollIntoView) wanted.scrollIntoView({ block: "start" });
              var summary = wanted.querySelector("summary");
              if (summary && summary.focus) summary.focus();
            }
          }
          return list;
        }

        /* The markup is rebuilt whole on every change, so the listeners are bound
           to the fresh nodes each time rather than delegated from a stale root. */
        function bind(list) {
          if (!root) return;
          root.querySelectorAll("[data-view]").forEach(function (button) {
            button.addEventListener("click", function () {
              viewState.view = button.getAttribute("data-view");
              render();
              announceFilters(list);
            });
          });
          var search = root.querySelector("#case-search");
          if (search) {
            search.addEventListener("input", function (event) {
              viewState.query = event.target.value;
              render();
              var refreshed = root.querySelector("#case-search");
              if (refreshed) refreshed.focus();
              announceFilters(list);
            });
          }
          [
            ["#stage-filter", "stage"],
            ["#review-filter", "reviewType"],
            ["#case-sort", "sort"]
          ].forEach(function (pair) {
            var select = root.querySelector(pair[0]);
            if (!select) return;
            select.addEventListener("change", function (event) {
              viewState[pair[1]] = event.target.value;
              render();
              announceFilters(list);
            });
          });
          var reset = root.querySelector("#clear-search");
          if (reset) {
            reset.addEventListener("click", function () {
              viewState.query = "";
              render();
              var refreshed = root.querySelector("#case-search");
              if (refreshed) refreshed.focus();
              announceFilters(list);
            });
          }
          /* The logo as "clear every filter": the nav is one button per stage
             now, with nothing left to click back to the whole board (§ nav
             simplification), and the toolbar's three selects plus the search
             box are three more places a filter can be left standing. One
             control that always returns to the unfiltered board beats asking
             the officer to remember which of the four she set. */
          var resetFilters = root.querySelector("#reset-filters");
          if (resetFilters) {
            resetFilters.addEventListener("click", function () {
              viewState.view = DEFAULT_VIEW_STATE.view;
              viewState.stage = DEFAULT_VIEW_STATE.stage;
              viewState.reviewType = DEFAULT_VIEW_STATE.reviewType;
              viewState.query = DEFAULT_VIEW_STATE.query;
              render();
              var refreshed = root.querySelector("#reset-filters");
              if (refreshed) refreshed.focus();
              announceFilters(list);
            });
          }
          root.querySelectorAll("[data-case-id]").forEach(function (card) {
            card.addEventListener("click", function () {
              openCase(card.getAttribute("data-case-id"));
            });
          });
          /* Both copies of the toggle, board and case header, write one field.
             Focus is returned to the button that was pressed — in the copy it
             was pressed in — so the keyboard does not lose its place. */
          /* Language. Written to session storage before the re-render, so the
             borrower page opens in whatever this one is being read in. */
          root.querySelectorAll("[data-locale]").forEach(function (button) {
            button.addEventListener("click", function () {
              var next = button.getAttribute("data-locale");
              if (next === copy.locale()) return;
              var place = button.parentNode
                ? button.parentNode.getAttribute("data-language-place")
                : null;
              rememberScroll();
              saveLocale(next);
              applyShellCopy();
              render();
              var again = root.querySelector(
                '[data-language-place="' + place + '"] [data-locale="' + next + '"]'
              );
              if (again) again.focus();
              announce("lender.status.language");
            });
          });
          bindWorkspace(list);
        }

        /* The drawer's own controls: close, expand, the five tabs, the review
           item's two resolutions, and §5.6's gestures. */
        function bindWorkspace(list) {
          var loan = selectedLoan(list);
          if (!root || !loan) return;
          root.querySelectorAll('[data-workspace-action="close"]').forEach(function (button) {
            button.addEventListener("click", closeCase);
          });
          var expand = root.querySelector('[data-workspace-action="expand"]');
          if (expand) {
            expand.addEventListener("click", function () {
              rememberScroll();
              viewState.panelMode = "full";
              syncHash();
              render();
            });
          }
          /* The alert takes you to the work rather than opening a copy of it.
             It scrolls the rail so the panel is at the top of the officer's
             view, rings it for a beat so the eye finishes the journey, and puts
             focus on the panel — a jump a keyboard user cannot follow is not a
             jump. Nothing about the case changes, so there is no re-render and
             no state to write: this control only moves the view. */
          /* The assistant folds down into its launcher and comes back up from
             it. Nothing about the case changes, so the panel is shown or hidden
             and the launcher relabelled in place — both elements are always on
             the page now (§renderAssistantLauncher), so the toggle is a plain
             `hidden` flip rather than a re-render that would throw away a
             half-typed question, reset whichever tab was open, and rebuild the
             board underneath for a change the board never had anything to do
             with. */
          root.querySelectorAll('[data-workspace-action="toggle-assistant"]').forEach(
            function (button) {
              button.addEventListener("click", function () {
                viewState.assistantOpen = !viewState.assistantOpen;
                var rail = document.getElementById("assistant-rail");
                var launcher = root.querySelector(".assistant-launcher");
                if (rail) rail.hidden = !viewState.assistantOpen;
                if (launcher) launcher.hidden = viewState.assistantOpen;
                /* Focus lands on whichever control the toggle turned into: the
                   rail's own collapse when it opens, the launcher when it
                   folds away. The other one is now hidden, so it is named
                   rather than found by the shared attribute. */
                var again = root.querySelector(
                  viewState.assistantOpen ? ".assistant-collapse" : ".assistant-launcher"
                );
                if (again) again.focus();
                announce(
                  viewState.assistantOpen
                    ? "lender.status.assistant-opened"
                    : "lender.status.assistant-closed"
                );
              });
            }
          );
          /* Two things point here now — the header alert, and the handoff at the
             foot of each document record — so it is bound as a set rather than
             as the one button it started as. A handoff carries the document it
             came from, and lands on that document's own row instead of the top
             of the panel: coming from the tax folder and being dropped at the
             head of a list you then have to search is not an answer to "where do
             I reply to this?". */
          root.querySelectorAll('[data-workspace-action="needs-review"]').forEach(function (button) {
            var wantedDocument = button.getAttribute("data-needs-document");
            button.addEventListener("click", function () {
              /* The work it points at is inside the assistant, so the button
                 opens the assistant before it goes looking for it. */
              if (!viewState.assistantOpen) {
                viewState.assistantOpen = true;
                render();
              }
              var panel = document.getElementById("needs-review-card");
              if (!panel) return;
              /* The row for that document if there is one, the panel otherwise —
                 a jump that lands on nothing is worse than no jump. */
              var target =
                (wantedDocument &&
                  panel.querySelector('[data-review-document="' + wantedDocument + '"]')) ||
                panel;
              var body = document.getElementById("assistant-body");
              if (body && typeof target.offsetTop === "number") {
                body.scrollTop = Math.max(0, target.offsetTop - body.offsetTop - 8);
              }
              if (target.scrollIntoView) target.scrollIntoView({ block: "nearest" });
              target.classList.remove("landed");
              /* Reading a layout property between the two flushes the class
                 change, so the animation restarts on a second press. */
              void target.offsetWidth;
              target.classList.add("landed");
              /* A row is not focusable of itself; the reply box in it is the
                 thing the officer came for, so focus goes there when there is
                 one and to the row otherwise. */
              var reply = target === panel ? null : target.querySelector("textarea:not([disabled])");
              if (reply && reply.focus) {
                reply.focus();
              } else {
                if (target !== panel && !target.hasAttribute("tabindex")) {
                  target.setAttribute("tabindex", "-1");
                }
                target.focus();
              }
              announce(
                wantedDocument
                  ? "lender.status.needs-review-document"
                  : "lender.status.needs-review-opened",
                wantedDocument
                  ? { document: t("doc." + wantedDocument + ".name") }
                  : { notifications: notificationsPhrase(needsReviewCount(loan)) }
              );
            });
          });
          /* Every line with a document behind it, and every failing line in the
             analysis card, lands on that document. */
          root.querySelectorAll("[data-notification-document]").forEach(function (button) {
            button.addEventListener("click", function () {
              followToDocument(button.getAttribute("data-notification-document"));
            });
          });
          root.querySelectorAll("[data-workspace-tab]").forEach(function (button) {
            button.addEventListener("click", function () {
              viewState.activeTab = knownTab(button.getAttribute("data-workspace-tab"));
