              /* A new tab starts at its own top. */
              panelScroll = 0;
              syncHash();
              /* The board plays no part in which tab is open, so only the
                 drawer needs to move (§renderWorkspaceOnly) — it focuses the
                 new tab itself once its markup is in. */
              renderWorkspaceOnly();
            });
          });
          /* The condition field follows the select: it appears for the one
             outcome that requires it and goes away again, so the row is never
             carrying a box that has nothing to do with the decision on screen.
             Shown on change rather than on commit, because a field you are told
             about only after being refused is a field you were never offered. */
          root.querySelectorAll("[data-review-decision]").forEach(function (picker) {
            picker.addEventListener("change", function () {
              var id = picker.getAttribute("data-review-decision");
              var row = root.querySelector('[data-review-condition-row="' + id + '"]');
              if (!row) return;
              row.hidden = picker.value !== "accepted-with-condition";
              if (!row.hidden) {
                var field = row.querySelector("[data-review-condition]");
                if (field) field.focus();
              }
            });
          });
          /* One button, whatever the decision. It reads the select, the reply
             box and the condition field at the moment of the click, so what is
             committed is what is on screen. The two refusals that would
             otherwise be silent — no words where words are required — are
             caught here so focus lands in the box that is missing them; every
             other refusal belongs to the model and is announced by it. */
          root.querySelectorAll('[data-review-action="decide"]').forEach(function (button) {
            button.addEventListener("click", function () {
              var id = button.getAttribute("data-review-id");
              var picker = root.querySelector('[data-review-decision="' + id + '"]');
              /* The chat-only row carries its one decision on the button
                 itself — there is no select to read it from. */
              var decision =
                button.getAttribute("data-review-decision-value") || (picker ? picker.value : "reply");
              var box = root.querySelector('[data-review-reply="' + id + '"]');
              var body = box ? box.value : "";
              var wording = root.querySelector('[data-review-condition="' + id + '"]');
              var needsWords = decision === "reply" || decision === "send-back";
              if (needsWords && !String(body).trim()) {
                announce(
                  decision === "send-back"
                    ? "lender.status.request-needs-reason"
                    : "lender.review.blank-reply"
                );
                if (box) box.focus();
                return;
              }
              if (decision === "accepted-with-condition" && !String(wording ? wording.value : "").trim()) {
                announce("lender.status.override-needs-condition");
                if (wording) wording.focus();
                return;
              }
              apply(
                loan.caseId,
                commitReviewDecision(liveStates[loan.caseId], id, decision, body, wording ? wording.value : "", {
                  timestamp: nextInstant(),
                  borrowerName: loan.borrowerName,
                  /* Words sent to the primary live case reach her thread over
                     the bridge; the second live case and every fixture stay on
                     this surface, because there is no borrower page behind
                     them. */
                  storage: loan.caseId === CASE_ID ? bridgeStorage() : undefined
                })
              );
            });
          });
          /* The officer overruling the assistant, and the officer sending a
             document back. Both read their fields at the moment of the click,
             so whatever is on screen is what is committed. */
          root.querySelectorAll('[data-document-action="override"]').forEach(function (button) {
            button.addEventListener("click", function () {
              var documentId = button.getAttribute("data-document-id");
              var picked = root.querySelector('[data-override-verdict="' + documentId + '"]');
              var wording = root.querySelector('[data-override-condition="' + documentId + '"]');
              apply(
                loan.caseId,
                commitVerdictOverride(
                  liveStates[loan.caseId],
                  documentId,
                  picked ? picked.value : "",
                  wording ? wording.value : "",
                  {
                    timestamp: nextInstant(),
                    storage: loan.caseId === CASE_ID ? bridgeStorage() : undefined
                  }
                )
              );
            });
          });
          root.querySelectorAll('[data-document-action="request-again"]').forEach(function (button) {
            button.addEventListener("click", function () {
              var documentId = button.getAttribute("data-document-id");
              var box = root.querySelector('[data-request-reason="' + documentId + '"]');
              var reason = box ? box.value : "";
              if (!String(reason).trim()) {
                announce("lender.status.request-needs-reason");
                if (box) box.focus();
                return;
              }
              apply(
                loan.caseId,
                commitDocumentRequest(liveStates[loan.caseId], documentId, reason, {
                  timestamp: nextInstant(),
                  storage: loan.caseId === CASE_ID ? bridgeStorage() : undefined
                })
              );
            });
          });
          root.querySelectorAll("button[data-case-action]").forEach(function (button) {
            button.addEventListener("click", function () {
              runCaseAction(button.getAttribute("data-case-action"), loan);
            });
          });
          /* Asking the deal assistant. The question and its answer are appended
             together — the answer is decided by the case, not awaited from
             anywhere, so there is nothing to wait for and no pending state. */
          root.querySelectorAll('form[data-case-action="ask-assistant"]').forEach(function (form) {
            form.addEventListener("submit", function (event) {
              event.preventDefault();
              var field = form.querySelector("#assistant-input");
              var question = field ? field.value : "";
              if (!String(question).trim()) {
                announce("lender.assistant.blank");
                if (field) field.focus();
                return;
              }
              if (field) field.value = "";
              var answer = dealAssistantAnswer(loan, question);
              viewState.assistantThread = (viewState.assistantThread || []).concat([
                { voice: "you", text: question },
                { voice: "assistant", text: answer.text, actions: answer.actions }
              ]);
              viewState.agentMenuOpen = false;
              viewState.assistantStatus = null;
              rememberScroll();
              render();
              /* The newest exchange, and the field ready for the next one. */
              var body = document.getElementById("assistant-body");
              if (body) body.scrollTop = body.scrollHeight;
              var again = document.getElementById("assistant-input");
              if (again) again.focus();
              announce("lender.assistant.asked");
            });
          });
          /* The conversation tab's own composer: the same `commitConversationMessage`
             that already exists for "I'll come back to you today" without a queue
             entry to hang it on (§conversationDocumentId), now with a place on
             screen to type it from. Blank text and a read-only case both refuse
             inside the commit itself, so this only has to read the field and hand
             it over. */
          root.querySelectorAll('form[data-case-action="send-conversation-message"]').forEach(function (form) {
            form.addEventListener("submit", function (event) {
              event.preventDefault();
              var field = form.querySelector("#conversation-composer-input");
              var text = field ? field.value : "";
              var result = commitConversationMessage(liveStates[loan.caseId], text, {
                timestamp: nextInstant(),
                storage: loan.caseId === CASE_ID ? bridgeStorage() : undefined
              });
              if (result.changed && field) field.value = "";
              apply(loan.caseId, result);
              var again = document.getElementById("conversation-composer-input");
              if (again) again.focus();
              if (result.changed) {
                var body = document.querySelector(".wa-body");
                if (body) body.scrollTop = body.scrollHeight;
              }
            });
          });
          /* The agent menu, and the agents in it. Triggering one writes the
             exchange, then runs the case's own transition — so what the
             assistant says it did and what the audit trail records are the same
             event, not two descriptions of one. */
          var trigger = root.querySelector('[data-assistant-action="toggle-agents"]');
          if (trigger) {
            trigger.addEventListener("click", function () {
              rememberScroll();
              viewState.agentMenuOpen = !viewState.agentMenuOpen;
              render();
              var again = root.querySelector('[data-assistant-action="toggle-agents"]');
              if (again) again.focus();
            });
          }
          root.querySelectorAll("[data-assistant-agent]").forEach(function (button) {
            button.addEventListener("click", function () {
              var result = dealAgentRun(loan, button.getAttribute("data-assistant-agent"));
              if (!result) return;
              var name = t("lender.assistant.agent." + result.agent.id);
              viewState.assistantThread = (viewState.assistantThread || []).concat([
                { voice: "you", text: t("lender.assistant.you-trigger", { agent: name }) },
                { voice: "assistant", text: result.text, actions: [] }
              ]);
              viewState.agentMenuOpen = false;
              viewState.assistantStatus = t("lender.assistant.status-ran", {
                agent: name,
                case: loan.caseId
              });
              rememberScroll();
              /* A reading agent only writes the exchange; an acting one hands
                 over to runCaseAction, which re-renders and announces on its
                 own terms. */
              if (result.action) {
                runCaseAction(result.action, loan);
              } else {
                render();
              }
              var body = document.getElementById("assistant-body");
              if (body) body.scrollTop = body.scrollHeight;
            });
          });
          /* The controls an answer offers are the case's own, reached from here
             rather than reimplemented here. */
          root.querySelectorAll("[data-assistant-action]").forEach(function (button) {
            button.addEventListener("click", function () {
              var action = button.getAttribute("data-assistant-action");
              if (action === "toggle-agents") return;
              /* "risk-tab", "conversation-tab" and any other `<tab>-tab`
                 action just switch to that real workspace tab — one rule
                 rather than one more `if` per tab a link is ever added for. */
              var tabMatch = /^(.+)-tab$/.exec(action || "");
              if (tabMatch && WORKSPACE_TABS.indexOf(tabMatch[1]) !== -1) {
                viewState.activeTab = tabMatch[1];
                panelScroll = 0;
                syncHash();
                render();
                return;
              }
              runCaseAction(action, loan);
            });
          });
        }

        /* One place where an action's outcome becomes the new live state, a
           re-render and an announcement. An action that changed nothing still
           announces — that is how a refusal is heard. `caseId` says which live
           case the result belongs to, so two cases can be mid-gesture at once
           without one's outcome landing on the other. */
        function apply(caseId, result) {
          if (!result) return;
          rememberScroll();
          if (result.changed) {
            liveStates[caseId] = result.state;
            panelScroll = 0;
            persist(caseId);
          }
          render();
          announceOutcome(result);
          /* The change stands on this surface either way; it may not have reached
             the other tab. */
          if (result.bridged === false) announceViewOnly();
        }

        /* An arriving event lands here, possibly seconds after the click that
           provoked it, and reads the state as it is at that moment — of
           whichever case scheduled it. */
        function readStateFor(caseId) {
          return function () {
            return liveStates[caseId];
          };
        }

        /* A box that has just appeared and is the only thing to do next takes
           the caret, so the keyboard route into it is not a hunt through the
           panel for it. */
        function focusDecisionReason() {
          var box = root.querySelector("[data-decision-reason]");
          if (box && typeof box.focus === "function") box.focus();
        }

        function runCaseAction(action, loan) {
          var caseId = loan.caseId;
          var state = liveStates[caseId];
          /* An arrival scheduled now must land on this case, whichever one is
             open by the time it fires. */
          function applyHere(result) {
            apply(caseId, result);
          }
          if (action === "developer-query") {
            viewState.draft = "developer-query";
            render();
            return;
          }
          if (action === "send-query") {
            viewState.draft = null;
            apply(
              caseId,
              requestDeveloperConfirmation(state, {
                timestamp: nextInstant(),
                caseId: caseId,
                readState: readStateFor(caseId),
                onArrival: applyHere
              })
            );
            return;
          }
          if (action === "remind-borrower") {
            apply(
              caseId,
              remindBorrower(state, {
                timestamp: nextInstant(),
                readState: readStateFor(caseId),
                onArrival: applyHere
              })
            );
            return;
          }
          if (action === "escalate") {
            apply(caseId, escalate(state));
            return;
          }
          if (action === "reorder-service") {
            apply(caseId, reorderServices(state, { timestamp: nextInstant() }));
            return;
          }
          if (action === "approve") {
            apply(caseId, approveWithConditions(state, { timestamp: nextInstant() }));
            return;
          }
          if (action === "sign") {
            apply(caseId, signApproval(state, { timestamp: nextInstant(), loan: loan }));
            return;
          }
          /* The two hand-taken decisions open their reason box first: the click
             that commits is the second one, on words the officer can read back
             before they go on the record. */
          if (action === "decline" || action === "override") {
            viewState.draft = action;
            render();
            focusDecisionReason();
            return;
          }
          if (action === "cancel-decision") {
            viewState.draft = null;
            render();
            return;
          }
          if (action === "confirm-decline" || action === "confirm-override") {
            var kind = action === "confirm-decline" ? "decline" : "override";
            var box = root.querySelector('[data-decision-reason="' + kind + '"]');
            var reason = box ? box.value : "";
            if (!String(reason).trim()) {
              announce("lender.decision.reason-required");
              if (box) box.focus();
              return;
            }
            var settled =
              kind === "decline"
                ? declineCase(state, reason, { timestamp: nextInstant(), caseId: caseId })
                : overrideApproval(state, reason, {
                    timestamp: nextInstant(),
                    caseId: caseId
                  });
            if (settled.changed) viewState.draft = null;
            apply(caseId, settled);
            return;
          }
          if (action === "reset") {
            viewState.draft = null;
            actionClock = DEMO_NOW;
            apply(caseId, resetCase({ caseData: liveCaseData(caseId) }));
          }
        }

        /* From a notification, or from a failing line in the analysis card, to
           the record it is about: the documents tab, that document unfolded, at
           the checks that were run on it. */
        function followToDocument(documentId) {
          if (!documentId) return;
          viewState.activeTab = "documents";
          viewState.focusDocumentId = documentId;
          panelScroll = 0;
          syncHash();
          render();
          announce("lender.status.notification-followed", {
            document: t("doc." + documentId + ".name")
          });
        }

        function openCase(caseId) {
          trigger = {
            caseId: caseId,
            windowY: globalThis.scrollY || 0,
            boardX: (root && root.querySelector(".loan-board") ? root.querySelector(".loan-board").scrollLeft : 0) || 0
          };
          viewState = assign(assign({}, viewState), {
            selectedCaseId: caseId,
            panelMode: "drawer",
            activeTab: "overview",
            draft: null,
            /* A new case brings its own bell: nothing on it has been read. */
            focusDocumentId: null,
            assistantThread: [],
            agentMenuOpen: false,
            assistantStatus: null,
            /* Every case starts with the assistant folded away. */
            assistantOpen: false
          });
          panelScroll = 0;
          /* Opening pushes, so Back closes the case rather than leaving the page. */
          syncHash("push");
          render();
          announce("lender.status.case-opened", { case: caseId });
        }

        /* Closing puts the board back exactly as it was and returns focus to the
           card that opened the case (§5.5). */
        function closeCase() {
          viewState = assign(assign({}, viewState), {
            selectedCaseId: null,
            panelMode: "drawer",
            activeTab: "overview",
            draft: null,
            focusDocumentId: null,
            assistantThread: [],
            agentMenuOpen: false,
            assistantStatus: null,
            /* Every case starts with the assistant folded away. */
            assistantOpen: false
          });
          syncHash();
          render();
          restoreBoard();
          announce("lender.status.case-closed");
        }

        function restoreBoard() {
          if (!root) return;
          var board = root.querySelector(".loan-board");
          if (board) board.scrollLeft = trigger.boardX;
          if (globalThis.scrollTo) globalThis.scrollTo(0, trigger.windowY);
          var card =
            root.querySelector('[data-case-id="' + trigger.caseId + '"]') ||
            root.querySelector(".page-heading h1");
          if (card) card.focus();
        }

        /* Escape closes, Tab is trapped inside the dialog, and the arrows, Home
           and End move between tabs (§9). */
        if (document.addEventListener) {
          document.addEventListener("keydown", function (event) {
            handleWorkspaceKeydown(event, {
              isOpen: Boolean(viewState.selectedCaseId),
              container: document.getElementById("case-workspace"),
              activeElement: document.activeElement,
              close: closeCase
            });
          });
        }

        /* Back, Forward and a hand-edited hash all land here. */
        function applyHash() {
          viewState = viewStateForCaseHash(viewState, locationLike.hash, caseIds(loans()));
          render();
        }

        /* A hash naming a case that is not in the portfolio is cleaned up before
           the first paint, so a stale bookmark opens a plain board. */
        if (viewState.selectedCaseId && !caseIds(loans()).has(viewState.selectedCaseId)) {
          viewState = assign(assign({}, viewState), {
            selectedCaseId: null,
            panelMode: "drawer",
            activeTab: "overview"
          });
          syncHash();
        }

        /* The borrower tab wrote to the bridge. Absorb what is new and re-render, so
           her message reaches the board within a second (§7). The bridge only
           ever carries the primary case's conversation — the second live case
           has no borrower page to write it. */
        function onStorage(event) {
          if (!event) return;
          if (event.key === CASE_RESET_KEY) {
            if (pendingCaseReset(bridgeStorage(), caseStorage())) {
              apply(CASE_ID, applyCaseReset(bridgeStorage(), caseStorage()));
            }
            return;
          }
          if (event.key !== MESSAGE_BRIDGE_KEY) return;
          apply(
            CASE_ID,
            bridgeAbsorb(liveStates[CASE_ID], {
              storage: bridgeStorage(),
              /* Stamped when this desk received it. */
              receivedAt: nextInstant()
            })
          );
        }

        if (globalThis.addEventListener) {
          globalThis.addEventListener("hashchange", applyHash);
          globalThis.addEventListener("popstate", applyHash);
          globalThis.addEventListener("storage", onStorage);
        }

        var backlog = absorbBacklog(liveStates[CASE_ID], primaryOpened.source, bridgeStorage());
        if (backlog.changed) {
          liveStates[CASE_ID] = backlog.state;
          persist(CASE_ID);
        }

        /* `?case=` from the borrower's role-switch link, and `&take=1` with it. The
           hash wins where both name a case: it is the more specific address. */
        var fromQuery = viewState.selectedCaseId
          ? { viewState: viewState, announcement: null }
          : applyCaseQuery(viewState, locationLike.search, caseIds(loans()));
        viewState = fromQuery.viewState;
        if (fromQuery.announcement) syncHash("push");

        var rendered = render();
        if (fromQuery.announcement) {
          announce(fromQuery.announcement.key, fromQuery.announcement.params);
        } else {
          announce("lender.status.board-ready", { count: rendered.length });
        }
        return rendered;
      }

      globalThis.FalabellaLender = {
        DEMO_NOW: DEMO_NOW,
        CASE_ID: CASE_ID,
        CASE_STORAGE_KEY: CASE_STORAGE_KEY,
        MESSAGE_BRIDGE_KEY: MESSAGE_BRIDGE_KEY,
        CASE_RESET_KEY: CASE_RESET_KEY,
        RESET_APPLIED_KEY: RESET_APPLIED_KEY,
        BRIDGE_LIMIT: BRIDGE_LIMIT,
        BRIDGE_ROLE: BRIDGE_ROLE,
        STAGE_COLUMNS: STAGE_COLUMNS,
        PIPELINE_STAGES: PIPELINE_STAGES,
        NAV_ITEMS: NAV_ITEMS,
        SORT_OPTIONS: SORT_OPTIONS,
        WORKSPACE_TABS: WORKSPACE_TABS,
        DEFAULT_VIEW_STATE: DEFAULT_VIEW_STATE,
        FALLBACK_CASE: FALLBACK_CASE,
        SECOND_CASE: SECOND_CASE,
        LIVE_CASES: LIVE_CASES,
        FIXTURE_LOANS: FIXTURE_LOANS,

        fallbackCaseState: fallbackCaseState,
        secondCaseState: secondCaseState,
        createInteractiveLoan: createInteractiveLoan,
        buildPortfolio: buildPortfolio,
        portfolioMetrics: portfolioMetrics,
        filterLoans: filterLoans,
        sortLoans: sortLoans,
        groupLoansByStage: groupLoansByStage,

        escapeHtml: escapeHtml,
        stageLabel: stageLabel,
        money: money,
        renderMetrics: renderMetrics,
        renderNavigation: renderNavigation,
        renderToolbar: renderToolbar,
        renderLoanCard: renderLoanCard,
        renderBoardColumns: renderBoardColumns,
        renderPortfolioPage: renderPortfolioPage,

        parseCaseHash: parseCaseHash,
        caseHash: caseHash,
        syncCaseHistory: syncCaseHistory,
        viewStateForCaseHash: viewStateForCaseHash,

        /* ---------------------------------------------------------- the bridge */
        loadCase: loadCase,
        saveCase: saveCase,
        bridgeRead: bridgeRead,
        bridgeSend: bridgeSend,
        bridgeAbsorb: bridgeAbsorb,
        bridgeClear: bridgeClear,
        absorbBacklog: absorbBacklog,
        parseCaseQuery: parseCaseQuery,
        applyCaseQuery: applyCaseQuery,
        viewOnlyAnnouncement: viewOnlyAnnouncement,
        resetViewOnlyNotice: resetViewOnlyNotice,

        documentsProgress: documentsProgress,
        daysUntilDeed: daysUntilDeed,
        isSigningSoon: isSigningSoon,

        /* ------------------------------------------------- the case workspace */
        ARRIVAL_DELAY_MS: ARRIVAL_DELAY_MS,
        ACTION_STEP_MS: ACTION_STEP_MS,
        CHECK_FIELDS: CHECK_FIELDS,

        renderWorkspace: renderWorkspace,
        analysisFor: analysisFor,
        renderCaseAnalysis: renderCaseAnalysis,
        ASSISTANT_INTENTS: ASSISTANT_INTENTS,
