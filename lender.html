            id: "workflow-" + milestone[2],
            timestamp: milestone[0],
            actor: milestone[1],
            action: milestone[2],
            documentId: null,
            details: ""
          });
        });
        return events.sort(function (a, b) {
          return String(b.timestamp).localeCompare(String(a.timestamp));
        });
      }

      /* An entry's second line: the copy key if the demo wrote the entry, the
         stored text if a person or another system did. */
      function auditDetail(event) {
        if (event.detailsKey) return t(event.detailsKey);
        return event.details || "";
      }

      function renderAuditTab(loan) {
        var events = caseAuditEvents(loan);
        return (
          sectionOpen("lender.audit.heading") +
          (events.length
            ? '<ol class="audit-list">' +
              events
                .map(function (event) {
                  return (
                    '<li class="audit-' +
                    escapeHtml(event.actor) +
                    '"><span class="audit-marker" aria-hidden="true"></span><div><strong>' +
                    text("audit." + event.action) +
                    "</strong>" +
                    (auditDetail(event) ? "<p>" + escapeHtml(auditDetail(event)) + "</p>" : "") +
                    "<span>" +
                    text("lender.actor." + event.actor) +
                    (event.documentId ? " · " + text("doc." + event.documentId + ".name") : "") +
                    ' · <time datetime="' +
                    escapeHtml(event.timestamp) +
                    '">' +
                    escapeHtml(formatTimestamp(event.timestamp)) +
                    "</time></span></div></li>"
                  );
                })
                .join("") +
              "</ol>"
            : "<p>" + text("lender.audit.empty") + "</p>") +
          "</section>"
        );
      }

      /* ======================================================= the application */

      function renderApplicationTab(loan) {
        /* A fixture has no application record. It shows what the board already
           knows about it and says plainly that it is a demo case, rather than
           inventing an ID number, an income and a phone number (§5.4). */
        if (!loan.caseData) {
          return (
            sectionOpen("lender.overview.application-card") +
            '<p class="readonly-note">' +
            text("common.readonly-note") +
            '</p><dl class="application-record">' +
            detailRow("lender.application.address", loan.address) +
            detailRow("lender.application.name", loan.borrowerName) +
            detailRow("lender.application.loan-amount", money(loan.requestedUF)) +
            detailRow(
              "lender.overview.snapshot-deed-date",
              loan.deedDate ? credit.formatDate(loan.deedDate) : t("common.empty")
            ) +
            "</dl></section>"
          );
        }
        var data = loan.caseData;
        var figures = caseFiguresFor(loan);
        return (
          sectionOpen("lender.application.property-heading") +
          '<dl class="application-record">' +
          detailRow("lender.application.address", data.property.address) +
          detailRow("lender.application.province", data.property.province) +
          detailRow("lender.application.canton", data.property.canton) +
          detailRow("lender.application.district", data.property.district) +
          detailRow(
            "lender.application.address-verified",
            data.property.addressVerified
              ? t("lender.application.address-verified-yes")
              : t("lender.application.address-verified-no")
          ) +
          detailRow("lender.application.project", data.property.project) +
          detailRow("lender.application.property-type", t("borrower.sim.house")) +
          detailRow("lender.application.property-condition", t("borrower.sim.condition-new")) +
          detailRow("lender.application.property-value", money(figures.propertyUSD)) +
          detailRow("lender.application.tax-roll", data.property.taxRoll) +
          "</dl></section>" +
          sectionOpen("lender.application.loan-heading") +
          '<dl class="application-record">' +
          detailRow("lender.application.loan-amount", money(figures.loanUSD)) +
          detailRow("lender.application.down-payment", money(figures.downPaymentUSD)) +
          detailRow(
            "lender.application.term",
            figures.termYears + " " + t("borrower.sim.years")
          ) +
          detailRow("lender.application.rate", credit.formatPct(figures.annualRate * 100)) +
          detailRow("lender.application.financing", credit.formatPct(figures.ltv * 100)) +
          detailRow(
            "lender.overview.snapshot-deed-date",
            credit.formatDate(data.loan.deedTargetDate)
          ) +
          "</dl></section>" +
          sectionOpen("lender.application.borrower-heading") +
          '<dl class="application-record">' +
          detailRow("lender.application.name", data.borrower.fullName) +
          detailRow("lender.application.id-number", data.borrower.idNumber) +
          detailRow("lender.application.date-of-birth", credit.formatDate(data.borrower.dateOfBirth)) +
          detailRow("lender.application.income", credit.formatUSD(figures.incomeUSD)) +
          detailRow("lender.application.phone", data.borrower.phone) +
          detailRow("lender.application.email", data.borrower.email) +
          detailRow("lender.application.submitted", formatTimestamp(data.submittedAt)) +
          "</dl>" +
          /* Said once, about the block it applies to (§5.5). */
          '<p class="readonly-note">' +
          text("common.demo-data-note") +
          "</p></section>"
        );
      }

      /* ========================================================= the documents */

      var CHECK_FIELDS = {
        "national-id": ["full-name", "rut", "date-of-birth", "validity"],
        payslips: ["stated-income", "periods", "employer", "payment-to-income"],
        "employment-tenure": ["tenure", "contract-type", "employer"],
        "pension-contributions": ["months", "continuity", "file-source"],
        "tax-folder": ["taxpayer-rut", "purpose", "periods", "issue-date"],
        "down-payment-proof": ["amount-required", "ownership", "source-of-funds"],
        "purchase-promise": ["signature-date", "price", "buyer", "condition"],
        "first-home-affidavit": ["signature", "previous-subsidy", "debtors-registry"],
        "title-certificate": ["encumbrances", "owner", "tax-roll", "validity"]
      };

      /* A check is done or it is not. There is no third state.
       *
       * A document still being read used to put its rows in `in-progress`,
       * which said the work had started without saying whether any of it had
       * landed — and a row nobody can act on is worth exactly as much as one
       * that has not been run. Those rows now read `Waiting`, the same as a
       * document that has not arrived, because from the desk's side they are
       * the same fact: this check has not produced an answer yet. */
      function checkStatusFor(verdict) {
        if (workspace.READY_VERDICTS.indexOf(verdict) !== -1) return "verified";
        if (verdict === "rejected") return "missing";
        return "waiting";
      }

      function check(documentId, field, status, stated, found) {
        return {
          key: documentId + "-" + field,
          labelKey: "lender.check." + documentId + "." + field,
          status: status,
          stated: stated === undefined ? null : stated,
          found: found === undefined ? null : found
        };
      }

      /**
       * The checks the review ran on one document. Two documents are special
       * because the demo turns on them: the title certificate carries the
       * field-by-field comparison of §5.5 with the encumbrance row mismatched,
       * and the tax folder names the one field that is missing. Everything else
       * takes its status from the verdict. A read-only fixture gets the generic
       * treatment: the comparison is evidence about this case, not decoration.
       */
      function reviewChecksFor(loan, documentId, record) {
        var verdict = record && record.verdict ? record.verdict : "not-uploaded";
        var status = checkStatusFor(verdict);
        var live = Boolean(loan && !loan.readonly) && verdict !== "not-uploaded";

        if (documentId === "title-certificate" && live) {
          /* The encumbrance row keeps its comparison whatever happens — the
             registrar found what it found, and that evidence does not go away.
             What changes is what the row *is*: a mismatch while the document is
             unsettled, a note once the desk carries it under the release
             condition, and verified once the desk accepts it outright. Frozen
             at "mismatch" it survived the officer's own override, so the card
             went on counting a field she had already decided against the file
             and no override could ever have made it stop. */
          var encumbrances =
            verdict === "accepted"
              ? "verified"
              : verdict === "accepted-with-condition"
                ? "note"
                : "mismatch";
          return [
            check(
              documentId,
              "encumbrances",
              encumbrances,
              t("lender.documents.encumbrance-stated"),
              t("lender.documents.encumbrance-found")
            ),
            check(
              documentId,
              "owner",
              "verified",
              t("lender.documents.owner-stated"),
              t("lender.documents.owner-found")
            ),
            check(
              documentId,
              "tax-roll",
              "verified",
              t("lender.documents.tax-roll-value"),
              t("lender.documents.tax-roll-value")
            ),
            check(
              documentId,
              "validity",
              "verified",
              t("lender.documents.validity-stated"),
              t("lender.documents.validity-found")
            )
          ];
        }

        if (documentId === "tax-folder" && live && verdict === "rejected") {
          return CHECK_FIELDS[documentId].map(function (field) {
            return check(documentId, field, field === "taxpayer-rut" ? "missing" : "verified");
          });
        }

        return (CHECK_FIELDS[documentId] || []).map(function (field) {
          return check(documentId, field, status);
        });
      }

      var CHECK_GLYPHS = {
        verified: "✓",
        mismatch: "⚠",
        missing: "✕",
        waiting: "·",
        note: "·"
      };

      /* Never colour alone: every row carries its status as a word and a glyph,
         and as a data attribute for the tests and for CSS (§2, §9). */
      function renderReviewChecks(checks) {
        return (
          '<ul class="review-checks">' +
          checks
            .map(function (item) {
              var comparison =
                item.stated === null && item.found === null
                  ? ""
                  : '<div class="comparison"><p><span>' +
                    text("lender.documents.comparison-stated") +
                    "</span><strong>" +
                    escapeHtml(item.stated) +
                    "</strong></p><p><span>" +
                    text("lender.documents.comparison-found") +
                    "</span><strong>" +
                    escapeHtml(item.found) +
                    "</strong></p></div>";
              return (
                '<li data-check-status="' +
                escapeHtml(item.status) +
                '"><div><strong>' +
                text(item.labelKey) +
                '</strong><span><span aria-hidden="true">' +
                CHECK_GLYPHS[item.status] +
                "</span> " +
                text("lender.check.status." + item.status) +
                "</span></div>" +
                comparison +
                "</li>"
              );
            })
            .join("") +
          "</ul>"
        );
      }

      /* Where the file came from. The borrower's own re-upload of page 1 from her
         portal is the only arrival that is not the WhatsApp thread, exactly as in
         the Spanish demo's document table. */
      function documentChannel(documentId, record) {
        var accepted = record && workspace.READY_VERDICTS.indexOf(record.verdict) !== -1;
        return documentId === "tax-folder" && accepted
          ? "lender.documents.channel-portal"
          : "lender.documents.channel-whatsapp";
      }

      function renderDocumentMessages(loan, record) {
        if (!record.messages.length) return "<p>" + text("lender.documents.no-messages") + "</p>";
        return record.messages
          .map(function (message) {
            return (
              '<article class="record-message ' +
              escapeHtml(message.author) +
              '"><strong>' +
              escapeHtml(
                message.author === "lender" ? t("lender.team.name") : loan.borrowerName
              ) +
              "</strong><p>" +
              escapeHtml(message.text) +
              '</p><time datetime="' +
              escapeHtml(message.timestamp) +
              '">' +
              escapeHtml(formatTimestamp(message.timestamp)) +
              "</time></article>"
            );
          })
          .join("");
      }


      function renderDocumentHistory(record) {
        if (!record.history.length) return "<p>" + text("lender.documents.no-history") + "</p>";
        return record.history
          .map(function (entry) {
            return (
              '<div class="history-row"><strong>' +
              escapeHtml(entry.filename || t("lender.documents.no-file")) +
              "</strong><span>" +
              text("verdict." + entry.verdict) +
              " · " +
              escapeHtml(formatTimestamp(entry.timestamp)) +
              "</span></div>"
            );
          })
          .join("");
      }

      /**
       * A facsimile of page 1 of the document, the same one the borrower portal
       * shows her: letterhead, title, the fields as the document prints them,
       * and ruled lines standing in for the body nobody needs to read. Which
       * fields, and which row is wrong while the document is still wrong, come
       * from the shared module — the desk and the borrower must not be looking
       * at two different pages.
       *
       * The row that is wrong is ringed and carries a glyph as well as the
       * colour, because colour alone is not a status (§9).
       */
      function renderScanPage(documentId, record) {
        var rows = workspace.scanRowsFor(documentId);
        /* Nothing has arrived, so there is no page to show. */
        if (!rows || !record || record.verdict === "not-uploaded") return "";
        var override = workspace.scanOverrideFor(documentId, record.verdict);
        var base = "borrower.scan." + documentId + ".";

        return (
          '<figure class="scan">' +
          '<div class="scan-page">' +
          '<div class="scan-org">' +
          text(base + "org") +
          "</div>" +
          '<div class="scan-title">' +
          text(base + "title") +
          "</div>" +
          rows
            .map(function (field) {
              var flagged = Boolean(override && override.field === field);
              var suffix = flagged && override.valueSuffix ? override.valueSuffix : "";
              return (
                '<div class="scan-row' +
                (flagged ? " mismatch" : "") +
                '">' +
                '<span class="scan-key">' +
                text(base + "row-" + field) +
                "</span>" +
                '<span class="scan-value">' +
                text(base + "value-" + field + suffix) +
                "</span>" +
                (flagged
                  ? '<span class="scan-mark" aria-hidden="true">' + CHECK_GLYPHS.mismatch + "</span>"
                  : "") +
                "</div>"
              );
            })
            .join("") +
          '<div class="scan-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>' +
          '<figcaption class="scan-stamp">' +
          text("borrower.drawer.scan-stamp") +
          "</figcaption>" +
          "</div></figure>"
        );
      }

      /* ------------------------------------------------- the officer overrules
       *
       * Everything above this block is what the assistant decided. This is where
       * a person disagrees with it. Two gestures, because they are two different
       * intentions: settle the document myself, or send it back to her.
       *
       * An override is not a correction of the record — the previous verdict
       * stays in the upload history and the change is stamped into the audit
       * trail as the lender's, so the trail always shows who decided what and
       * when (§5.5). Nothing here is available on a fixture, and nothing here is
       * available on a document that never arrived: there is no decision to
       * overrule until something has been decided.
       */
      var OVERRIDE_VERDICTS = ["accepted", "accepted-with-condition", "under-review", "rejected"];

      function renderOfficerDecision(loan, documentId, record) {
        if (loan.readonly || record.verdict === "not-uploaded") return "";
        var suffix = escapeHtml(documentId);
        return (
          '<h4>' +
          text("lender.documents.override-heading") +
          "</h4>" +
          '<div class="officer-decision" data-officer-document="' +
          suffix +
          '">' +
          '<div class="officer-row"><label for="verdict-' +
          suffix +
          '">' +
          text("lender.documents.override-label") +
          "</label>" +
          '<select id="verdict-' +
          suffix +
          '" data-override-verdict="' +
          suffix +
          '">' +
          OVERRIDE_VERDICTS.map(function (verdict) {
            return (
              '<option value="' +
              escapeHtml(verdict) +
              '"' +
              (record.verdict === verdict ? " selected" : "") +
              ">" +
              text("verdict." + verdict) +
              "</option>"
            );
          }).join("") +
          "</select></div>" +
          /* The fifth verdict is the one that carries words, and it is refused
             without them: "accepted with a condition" and no condition is not a
             decision anybody can act on (§3.2). */
          '<div class="officer-row"><label for="condition-' +
          suffix +
          '">' +
          text("lender.documents.override-condition-label") +
          "</label>" +
          '<input type="text" id="condition-' +
          suffix +
          '" data-override-condition="' +
          suffix +
          '" value="' +
          escapeHtml(record.condition || "") +
          '" placeholder="' +
          text("lender.documents.override-condition-placeholder") +
          '"></div>' +
          '<div class="review-actions"><button type="button" data-document-action="override" data-document-id="' +
          suffix +
          '">' +
          text("lender.documents.override-apply") +
          "</button></div>" +
          /* Sending it back is its own gesture: it sets the document rejected
             *and* tells her why, in one move, because a rejection she is never
             told about is not a request. */
          '<div class="officer-row officer-request"><label for="request-' +
          suffix +
          '">' +
          text("lender.documents.request-label") +
          "</label>" +
          '<textarea id="request-' +
          suffix +
          '" data-request-reason="' +
          suffix +
          '" rows="2" placeholder="' +
          text("lender.documents.request-placeholder") +
          '"></textarea></div>' +
          '<div class="review-actions"><button type="button" data-document-action="request-again" data-document-id="' +
          suffix +
          '">' +
          text("lender.documents.request-again") +
          "</button></div>" +
          "</div>"
        );
      }

      /**
       * The way from a document to the place it is answered.
       *
       * Reading a record and acting on it are two different jobs, and this build
       * put them on two different surfaces on purpose: the record is for looking
       * at the evidence, the Needs review panel is where every gesture that
       * changes the case lives, so there is one inventory of work rather than a
       * set of controls under each of nine documents. That split only works if
       * the record *says* so. Stripped of its controls and given nothing in
       * their place, the record read as a dead end — the conversation with the
       * borrower sitting there with no way to add to it.
       *
       * So: one line saying what is outstanding on this document, and one button
       * that goes to the row that carries it. Not a second set of controls — the
       * duplication this whole rail exists to remove — a signpost.
       *
       * A document with nothing outstanding gets the quiet line and no button,
       * because a button that lands on nothing is worse than no button.
       */
      function renderDocumentHandoff(loan, documentId, record) {
        if (loan.readonly) return "";
        var item = null;
        workspace.openReviewItems(loan.state).forEach(function (candidate) {
          if (!item && candidate.documentId === documentId) item = candidate;
        });
        var condition = null;
        loan.state.conditions.forEach(function (candidate) {
          if (candidate.cleared) return;
          if (workspace.CONDITION_DOCUMENTS[candidate.id] === documentId) condition = candidate;
        });
        if (!item && !condition) {
          return (
            '<p class="document-handoff-quiet">' +
            text(
              workspace.READY_VERDICTS.indexOf(record.verdict) !== -1
                ? "lender.documents.handoff-settled"
                : "lender.documents.handoff-none"
            ) +
            "</p>"
          );
        }
        return (
          '<div class="document-handoff"><p>' +
          /* The finding itself, not a sentence pointing at one — the same
             line Notifications prints for this item, so the record does not
             make her go looking for what it could have just said. */
          (item ? escapeHtml(reviewItemDetail(loan, item)) : text("lender.documents.handoff-condition")) +
          '</p><button type="button" class="primary" data-workspace-action="needs-review"' +
          ' data-needs-document="' +
          escapeHtml(documentId) +
          '">' +
          text(item ? "lender.documents.handoff-action" : "lender.documents.handoff-action-condition") +
          "</button></div>"
        );
      }

      function renderDocumentRecord(loan, documentId) {
        var record = loan.state.documents[documentId];
        var checks = reviewChecksFor(loan, documentId, record);
        var compared = checks.some(function (item) {
          return item.stated !== null || item.found !== null;
        });
        /* A fixture case is somebody else's paperwork and carries none of its
           own, so it gets the record without the facsimile (§11). */
        var scan = loan.readonly ? "" : renderScanPage(documentId, record);
        return (
          '<details class="document-record" name="case-documents" data-document-id="' +
          documentId +
          '"><summary class="document-summary"><span class="document-title"><strong>' +
          text("doc." + documentId + ".name") +
          "</strong><small>" +
          (record.currentFilename
            ? escapeHtml(record.currentFilename)
            : text("lender.documents.no-file")) +
          '</small></span><span class="verdict ' +
          escapeHtml(record.verdict) +
          '">' +
          text("verdict." + record.verdict) +
          '</span><span class="document-chevron" aria-hidden="true">⌄</span></summary>' +
          '<div class="document-record-body"><p><span>' +
          text("lender.documents.channel-label") +
          "</span> " +
          text(documentChannel(documentId, record)) +
          "</p>" +
          (record.condition ? "<p><strong>" + escapeHtml(record.condition) + "</strong></p>" : "") +
          /* The page first, then what was made of it: a finding with no
             document behind it asks the desk to take the system's word for it.
             Nothing to show when nothing has arrived. */
          (scan ? "<h4>" + text("lender.documents.page-heading") + "</h4>" + scan : "") +
          "<h4>" +
          text("lender.documents.checks-heading") +
          "</h4>" +
          (compared ? "<p>" + text("lender.documents.comparison-heading") + "</p>" : "") +
          renderReviewChecks(checks) +
          (documentId === "title-certificate" && compared
            ? "<p>" +
              text("lender.documents.folio") +
              "</p><p>" +
              text("lender.documents.encumbrance-note") +
              "</p>"
            : "") +
          /* The officer's own decision was here — a verdict picker, a condition
             box and a send-it-back note, under every document. It said a third
             time what the conditions list and the needs-review queue already
             say, and it asked the officer to settle a document in the one place
             she had gone to read it. The two gestures live where the work is
             counted: resolve and reply on the review item in the assistant.
             What was missing after that move was any *sign* of it — the record
             simply had no controls and no explanation, which reads as a dead
             end rather than as work that lives elsewhere. The handoff below
             says where the gestures are and takes you to them. */
          "<h4>" +
          text("lender.documents.conversation-heading") +
          "</h4>" +
          renderDocumentMessages(loan, record) +
          renderDocumentHandoff(loan, documentId, record) +
          "<h4>" +
          text("lender.documents.history-heading") +
          "</h4>" +
          renderDocumentHistory(record) +
          "</div></details>"
        );
      }

      /* Worst first, not checklist order. The two documents this case turns on
         were the fifth and the ninth of nine, so the tab opened on six accepted
         records and the officer scrolled past all of them to reach the work.
         Sent back comes first, then still under review, then not yet arrived,
         then the settled ones in the order the checklist asks for them. */
      function renderDocumentsTab(loan) {
        return (
          sectionOpen("lender.documents.heading") +
          '<div class="document-records">' +
          documentsByAttention(loan)
            .map(function (documentId) {
              return renderDocumentRecord(loan, documentId);
            })
            .join("") +
          "</div></section>"
        );
      }

      /* ======================================================= the conversation
       *
       * Every message the case carries, in the one order she read them in.
       * `record.messages` is filed one document at a time — that is what lets a
       * reply from the desk land back on the document it was about — so this is
       * the only place that puts them back together as the single thread her
       * phone shows. It reads, never writes anything of its own: the messages
       * come from the same records the Documents tab and the review queue
       * already carry, so answering from here, from a document, or from a
       * queued item are three doors onto the same room, not three rooms.
       */
      /* A message she is still waiting to hear back on: the one a still-open
         `borrower-message` review item was raised from. The same fact the
         Notifications queue already reads off `openReviewItems` — this is
         the same open work, seen from inside the thread instead of the
         queue. */
      function pendingMessageIds(state) {
        var ids = {};
        workspace.openReviewItems(state).forEach(function (item) {
          if (item.type === "borrower-message" && item.messageId) ids[item.messageId] = true;
        });
        return ids;
      }

      function caseConversation(loan) {
        var pending = pendingMessageIds(loan.state);
        var all = [];
        workspace.DOCUMENT_IDS.forEach(function (documentId) {
          var record = loan.state.documents[documentId];
          if (!record) return;
          record.messages.forEach(function (message, index) {
            all.push({
              id: message.id,
              author: message.author,
              text: message.text,
              timestamp: message.timestamp,
              documentId: documentId,
              order: index,
              pending: Boolean(pending[message.id])
            });
          });
        });
        /* Sort is not guaranteed stable across every engine this might run in
           (§documentsByAttention), so two messages filed in the same minute
           keep the order they were pushed onto their own document in. */
        all.sort(function (a, b) {
          if (a.timestamp !== b.timestamp) return a.timestamp < b.timestamp ? -1 : 1;
          return a.order - b.order;
        });
        /* Still open moves to the end, in the order it arrived relative to
           the other messages still open — the thread's own version of a
           queue that never lets an unanswered question scroll out of sight.
           History that is already settled keeps its place, chronological
           among itself. */
        var settled = all.filter(function (message) {
          return !message.pending;
        });
        var open = all.filter(function (message) {
          return message.pending;
        });
        return settled.concat(open);
      }

      function renderConversationBubble(loan, message) {
        return (
          '<article class="wa-bubble ' +
          escapeHtml(message.author) +
          '" data-pending="' +
          (message.pending ? "true" : "false") +
          '"><span class="wa-bubble-author"><span>' +
          escapeHtml(t("lender.actor." + message.author)) +
          '</span><span class="wa-bubble-doc">' +
          escapeHtml(documentLabel(loan, message.documentId)) +
          "</span></span><p>" +
          escapeHtml(message.text) +
          '</p><time datetime="' +
          escapeHtml(message.timestamp) +
          '">' +
          escapeHtml(formatTimestamp(message.timestamp)) +
          "</time>" +
          (message.pending
            ? '<span class="wa-pending-tag"><span aria-hidden="true">●</span> ' +
              text("lender.conversation.pending") +
              "</span>"
            : "") +
          "</article>"
        );
      }

      function renderConversationTab(loan) {
        var thread = caseConversation(loan);
        var disabled = loan.readonly ? " disabled" : "";
        return (
          sectionOpen("lender.conversation.heading") +
          '<div class="wa-thread" aria-label="' +
          text("lender.conversation.aria-label", { borrower: loan.borrowerName }) +
          '">' +
          '<div class="wa-head"><span class="wa-avatar" aria-hidden="true">' +
          escapeHtml(loan.borrowerName.slice(0, 1)) +
          "</span><div><strong>" +
          escapeHtml(loan.borrowerName) +
          "</strong><small>" +
          text("lender.conversation.subtitle") +
          "</small></div></div>" +
          '<div class="wa-body">' +
          (thread.length
            ? '<span class="wa-day">' +
              text("lender.conversation.today") +
              "</span>" +
              thread
                .map(function (message) {
                  return renderConversationBubble(loan, message);
                })
                .join("")
            : '<p class="wa-empty">' + text("lender.conversation.empty") + "</p>") +
          "</div>" +
          (loan.readonly
            ? '<p class="readonly-note wa-composer">' + text("lender.conversation.readonly") + "</p>"
            : '<form class="wa-composer" data-case-action="send-conversation-message">' +
              '<label class="sr-only" for="conversation-composer-input">' +
              text("lender.conversation.placeholder", { borrower: loan.borrowerName }) +
              "</label>" +
              '<input type="text" id="conversation-composer-input" name="message" autocomplete="off" placeholder="' +
              text("lender.conversation.placeholder", { borrower: loan.borrowerName }) +
              '"' +
              disabled +
              '><button type="submit"' +
              disabled +
              ">" +
              text("lender.conversation.send") +
              "</button></form>") +
          "</div></section>"
        );
      }

      /* ============================================================== the risk */

      function riskBar(ratio, cap, overCap) {
        var share = cap > 0 ? (ratio / cap) * 100 : 0;
        var width = Math.min(100, Math.round(share * 10) / 10);
        return (
          '<div class="risk-bar"><span class="risk-bar-fill' +
          (overCap ? " over-cap" : "") +
          '" style="width:' +
          width +
          '%"></span></div>'
        );
      }

      function renderRiskTab(loan) {
        var figures = caseFiguresFor(loan);
        /* Written-down policy is the same for every case; the arithmetic is not
           (§11). A fixture therefore gets the policy and nothing else. */
        if (!figures) {
          return (
            sectionOpen("risk.policy-heading") +
            '<p class="readonly-note">' +
            text("common.readonly-note") +
            "</p>" +
            renderPolicyList(null) +
            "</section>"
          );
        }
        var ratio = credit.formatPct(figures.dti.ratio * 100);
        var cap = credit.formatPct(figures.dti.cap * 100);
        var stressed = credit.formatPct(figures.stressedDti.ratio * 100);

        return (
          sectionOpen("risk.summary-heading") +
          '<div class="record-card">' +
          metaRow("risk.summary-loan", money(figures.loanUSD)) +
          metaRow("risk.summary-property", money(figures.propertyUSD)) +
          metaRow("risk.summary-down-payment", money(figures.downPaymentUSD)) +
          metaRow("risk.summary-term", figures.termYears + " " + t("borrower.sim.years")) +
          metaRow("risk.summary-rate", credit.formatPct(figures.annualRate * 100)) +
          metaRow("risk.summary-payment", money(figures.paymentUSD)) +
          metaRow("risk.summary-income", credit.formatUSD(figures.incomeUSD)) +
          "</div></section>" +

          sectionOpen("risk.pti-heading") +
          riskBar(figures.dti.ratio, figures.dti.cap, figures.dti.overCap) +
          '<div class="risk-row"><strong>' +
          text("risk.pti-value", { ratio: ratio }) +
          "</strong><span>" +
          text("risk.pti-cap", { cap: cap }) +
          "</span></div>" +
          "<p><strong>" +
          (figures.dti.overCap
            ? '<span class="over-cap-label">' + text("risk.stress-over-cap", { cap: cap }) + "</span>"
            : '<span aria-hidden="true">✓</span> ' + text("risk.pti-under-cap")) +
          '</strong></p><p class="risk-note">' +
          text("risk.pti-explainer", {
            payment: credit.formatUSD(figures.dti.paymentUSD),
            ratio: ratio,
            income: credit.formatUSD(figures.incomeUSD),
            cap: cap
          }) +
          "</p></section>" +

          sectionOpen("risk.stress-heading") +
          riskBar(figures.stressedDti.ratio, figures.stressedDti.cap, figures.stressedDti.overCap) +
          '<div class="risk-row"><strong>' +
          text("risk.pti-value", { ratio: stressed }) +
          "</strong><span>" +
          text("risk.pti-cap", { cap: cap }) +
          "</span></div>" +
          /* Over the cap is said, in words, beside the bar (§3.1). */
          '<p><strong class="over-cap-label"><span aria-hidden="true">⚠</span> ' +
          text("risk.stress-over-cap", { cap: cap }) +
          '</strong></p><p class="risk-note">' +
          text("risk.stress-explainer", {
            payment: credit.formatUSD(figures.stressedDti.paymentUSD),
            ratio: stressed,
            cap: cap
          }) +
          "</p></section>" +

          sectionOpen("risk.policy-heading") +
          renderPolicyList(figures) +
          "</section>"
        );
      }

      /* The policy cap that is stated but not carried as a FalabellaCredit
         constant: new homes up to $150,000 (see risk.policy.property-cap). */
      var POLICY_PROPERTY_CAP_USD = 150000;

      /* The policy, point by point. The three rules that are arithmetic are
         checked here, against the case's own figures; tenure, contributions,
         the appraisal and the authority are written down, not computed (§11). */
      var POLICY_POINTS = [
        { id: "payment-to-income", checkId: "payment-to-income" },
        { id: "financing", checkId: "financing" },
        { id: "property-cap", checkId: "property-cap" },
        { id: "employment", checkId: null },
        { id: "appraisal", checkId: null },
        { id: "authority", checkId: null }
      ];

      function policyChecksFor(figures) {
        if (!figures) return null;
        return {
          "payment-to-income": !figures.dti.overCap,
          financing: figures.ltv <= credit.LTV + 1e-9,
          "property-cap": figures.propertyUSD <= POLICY_PROPERTY_CAP_USD
        };
      }

      function renderPolicyList(figures) {
        var checks = policyChecksFor(figures);
        return (
          '<ul class="policy-list">' +
          POLICY_POINTS.map(function (point) {
            var found = checks && point.checkId ? checks[point.checkId] : null;
            var glyph = found === null ? "·" : found ? "✓" : "✕";
            return (
              '<li data-policy="' +
              point.id +
              '"><span><span aria-hidden="true">' +
              glyph +
              "</span> " +
              text(
                "risk.policy." + point.id,
                point.id === "authority" ? { authority: officerAuthority() } : null
              ) +
              "</span></li>"
            );
          }).join("") +
          "</ul>"
        );
      }

      /* =========================================================== the actions */

      function actionButton(action, labelKey, disabled, primary) {
        return (
          '<button type="button" data-case-action="' +
          action +
          '"' +
          (primary ? ' class="primary"' : "") +
          (disabled ? " disabled" : "") +
          ">" +
          text(labelKey) +
          "</button>"
        );
      }

      /* §5.6's four gestures plus the reset. The approve control is disabled
         until readyToApprove(state) — derived from the two cleared conditions,
         never from a timer — and says so in words when it is (§3.4). */
      function renderActionBar(loan) {
        var readonly = Boolean(loan.readonly);
        var ready = workspace.readyToApprove(loan.state);
        var approved = Boolean(loan.state.workflow.approvedAt);
        var blocked = readonly || !ready || approved;
        return (
          sectionOpen("lender.decision.heading") +
          '<div class="action-bar">' +
          actionButton(
            "developer-query",
            "lender.action.request-developer-confirmation",
            readonly,
            false
          ) +
          actionButton("remind-borrower", "lender.action.remind-borrower", readonly, false) +
          actionButton("escalate", "lender.action.escalate", readonly, false) +
          actionButton("approve", "lender.action.approve", blocked, !blocked) +
          actionButton("reset", "lender.action.reset", readonly, false) +
          "</div>" +
          (readonly
            ? '<p class="readonly-note">' + text("common.readonly-loan") + "</p>"
            : !ready && !approved
              ? '<p class="readonly-note">' + text("lender.action.approve-blocked") + "</p>"
              : "") +
          "</section>"
        );
      }

      /* The drafted query, read before it is sent. Carolina reviews it; sending
         it is a second, deliberate click (§5.6). */
      function renderDeveloperQuery(loan) {
        return (
          '<section class="workspace-section"><div class="email-draft"><h3>' +
          text("lender.email.heading") +
          "</h3><p><span>" +
          text("lender.email.to-label") +
          "</span> <strong>" +
          text("lender.email.to") +
          "</strong></p><p><span>" +
          text("lender.email.subject-label") +
          "</span> <strong>" +
          text("lender.email.subject", { case: loan.caseId }) +
          "</strong></p><pre>" +
          text("lender.email.body", {
            case: loan.caseId,
            officer: t("lender.officer.name"),
            role: t("lender.officer.role")
          }) +
          '</pre><div class="action-bar">' +
          actionButton("send-query", "lender.email.send", false, true) +
          "</div></div></section>"
        );
      }

      /* ============================================= the decision and its record */

      function decisionRecord(state, source) {
        var normalized = workspace.normalizeState(state);
        if (!normalized.workflow.approvedAt && !normalized.workflow.declinedAt) return null;
        var declined = Boolean(normalized.workflow.declinedAt);
        var signature = null;
        normalized.auditEvents.forEach(function (event) {
          if (event.action === "approval-signed") signature = event;
        });
        var loanLike = source || FALLBACK_CASE;
        return {
          caseId: loanLike.caseId,
          borrowerName: loanLike.borrowerName || (loanLike.borrower && loanLike.borrower.fullName),
          requestedUF: loanLike.requestedUF || (loanLike.loan && loanLike.loan.requestedUF),
          officer: t("lender.officer.name"),
          role: t("lender.officer.role"),
          authority: officerAuthority(),
          approvedAt: normalized.workflow.approvedAt,
          declinedAt: normalized.workflow.declinedAt,
          outcome: declined ? "declined" : "approved",
          overridden: normalized.workflow.overridden === true,
          reason: normalized.workflow.decisionReason || "",
          /* A decline is final when it is taken; there is no second signature
             to wait for, so it reads as signed from the moment it exists. */
          timestamp: declined ? normalized.workflow.declinedAt : signature ? signature.timestamp : null,
          signed: declined || Boolean(signature),
          conditions: normalized.workflow.approvedConditions.slice()
        };
      }

      function conditionList(ids) {
        return (
          '<ul class="condition-list">' +
          ids
            .map(function (conditionId) {
              return (
                '<li data-condition-id="' +
                escapeHtml(conditionId) +
                '"><span>' +
                text("lender.condition." + conditionId) +
                "</span></li>"
              );
            })
            .join("") +
          "</ul>"
        );
      }

      function renderSigningSheet(loan) {
        var record = decisionRecord(loan.state, loan);
        /* Nothing is signed onto a case that was declined. */
        if (!record || record.outcome === "declined") return "";
        return (
          '<section class="workspace-section"><div class="signing-sheet"><h3>' +
          text("lender.signing.heading") +
          '</h3><dl class="application-record">' +
          detailRow("lender.signing.case", record.caseId) +
          detailRow("lender.signing.borrower", record.borrowerName) +
          detailRow("lender.signing.amount", money(record.requestedUF)) +
          detailRow("lender.signing.officer", record.officer + " · " + record.role) +
          detailRow("lender.signing.authority", record.authority) +
          "</dl><h4>" +
          text("lender.signing.conditions") +
          "</h4>" +
          conditionList(record.conditions) +
          '<div class="action-bar">' +
          actionButton("sign", "lender.signing.confirm", false, true) +
          "</div></div></section>"
        );
      }

      function renderDecisionRecord(loan) {
        var record = decisionRecord(loan.state, loan);
        if (!record || !record.signed) return "";
        if (record.outcome === "declined") {
          return (
            '<section class="workspace-section"><div class="decision-record decision-declined"><h3>' +
            text("lender.decision.heading") +
            "</h3><p><strong>" +
            text("lender.decision.declined-outcome") +
            "</strong></p><p>" +
            text("lender.decision.case", { case: record.caseId }) +
            "</p><p>" +
            text("lender.decision.declined-by", { officer: record.officer, role: record.role }) +
            "</p><p>" +
            text("lender.decision.declined-timestamp", {
              timestamp: formatTimestamp(record.timestamp)
            }) +
            '</p><p class="decision-reason">' +
            text("lender.decision.reason", { reason: record.reason }) +
            "</p></div></section>"
          );
        }
        return (
          '<section class="workspace-section"><div class="decision-record"><h3>' +
          text("lender.decision.heading") +
          "</h3><p><strong>" +
          text(record.overridden ? "lender.decision.override-badge" : "lender.decision.outcome") +
          "</strong></p>" +
          (record.overridden
            ? "<p>" +
              text("lender.decision.override-note", {
                officer: record.officer,
                role: record.role,
                authority: record.authority
              }) +
              '</p><p class="decision-reason">' +
              text("lender.decision.reason", { reason: record.reason }) +
              "</p>"
            : "") +
          "<p>" +
          text("lender.decision.case", { case: record.caseId }) +
          "</p><p>" +
          text("lender.decision.signed-by", { officer: record.officer, role: record.role }) +
          "</p><p>" +
          text("lender.decision.authority", { authority: record.authority }) +
          "</p><p>" +
          text("lender.decision.timestamp", { timestamp: formatTimestamp(record.timestamp) }) +
          "</p><h4>" +
          text("lender.decision.conditions-heading") +
          "</h4>" +
          conditionList(record.conditions) +
          "</div></section>"
        );
      }

      /* ==================================================== the officer's decision
       *
       * The three ways a case can end on this desk, in one place: approve
       * inside the gate, decline, or override the gate by hand.
       *
       * The gate itself does not move. `readyToApprove` is derived from the
       * cleared conditions and stays derived — an override does not pretend the
       * conditions cleared, it says in writing that the officer carried the case
       * without them, and the record afterwards says so too. That is the whole
       * point of having the control: an exception that is visible is an
       * exception the trail can be read for later, and one taken by editing
       * state is not.
       *
       * Both the decline and the override ask for words before they will
       * commit, for the same reason the send-back does: a decision nobody wrote
       * a reason for is a decision nobody can review.
       */
      function decisionStateLine(loan, record, ready) {
        if (record && record.outcome === "declined") {
          return text("lender.decision.state-declined", { case: loan.caseId });
        }
        if (record) {
          return text(record.signed ? "lender.decision.state-signed" : "lender.decision.state-approved", {
            case: loan.caseId
          });
        }
        if (ready) return text("lender.decision.state-ready", { case: loan.caseId });
        return "";
      }

      /* The reason box and the two buttons that close it, shared by the decline
         and the override because they ask the same thing in the same shape. */
      function renderDecisionDraft(loan, kind) {
        var heading =
          kind === "decline" ? "lender.decision.decline-heading" : "lender.decision.override-heading";
        var intro =
          kind === "decline" ? "lender.decision.decline-intro" : "lender.decision.override-intro";
        var confirm =
          kind === "decline" ? "lender.decision.decline-confirm" : "lender.decision.override-confirm";
        return (
          '<div class="decision-draft" data-decision-draft="' +
          kind +
          '"><h4>' +
          text(heading, { case: loan.caseId }) +
          "</h4><p>" +
          text(intro, { authority: officerAuthority() }) +
          '</p><label for="decision-reason">' +
          text("lender.decision.reason-label") +
          '</label><textarea id="decision-reason" data-decision-reason="' +
          kind +
          '" rows="3" placeholder="' +
          text("lender.decision.reason-placeholder") +
          '"></textarea><div class="action-bar">' +
          actionButton(
            kind === "decline" ? "confirm-decline" : "confirm-override",
            confirm,
            false,
            true
          ) +
          actionButton("cancel-decision", "lender.decision.cancel", false, false) +
          "</div></div>"
        );
      }

      function renderDecisionPanel(loan, uiState) {
        /* A fixture has no desk behind it and nothing to decide: eleven of the
           twelve cases on this board are read-only illustrations, and offering
           each of them a dead Decline button would say the opposite. The panel
           belongs to the live case. */
        if (loan.readonly) return "";
        var view = assign(assign({}, DEFAULT_VIEW_STATE), uiState || {});
        var record = decisionRecord(loan.state, loan);
        var ready = workspace.readyToApprove(loan.state);
        var decided = Boolean(record);
        var draft = view.draft === "decline" ? view.draft : null;
        var stateLine = decisionStateLine(loan, record, ready);
        return (
          '<section class="workspace-section"><div class="decision-panel"><h3>' +
          text("lender.decision.panel-heading") +
          "</h3>" +
          (stateLine ? '<p class="decision-state">' + stateLine + "</p>" : "") +
          (decided
            ? ""
            : '<div class="action-bar">' +
              actionButton("approve", "lender.action.approve", !ready, ready) +
              actionButton("decline", "lender.action.decline", false, false) +
              /* Manual override is not a second reason box beside the one
                 Decline already opens — the conditions it would carry have
                 one home, Notifications, with the document behind each one
                 and the reply that clears it. So this button goes there
                 rather than opening a form of its own. */
              '<button type="button" data-workspace-action="needs-review">' +
              text("lender.action.override") +
              "</button>" +
              "</div>" +
              (ready ? "" : '<p class="readonly-note">' + text("lender.action.approve-blocked") + "</p>")) +
          (draft && !decided ? renderDecisionDraft(loan, draft) : "") +
          "</div></section>"
        );
      }

      /* ========================================================== the overview */

      /* "What needs me?" — the open work first, one item at a time, then whatever
         the case is waiting on, then the snapshot, the conditions and the last
         three events with a route into the full trail (§5.5). */
      function renderOverviewTab(loan, uiState) {
        var view = assign(assign({}, DEFAULT_VIEW_STATE), uiState || {});
        var figures = caseFiguresFor(loan);
        var progress = documentsProgress(loan.state);
        var recent = caseAuditEvents(loan).slice(0, 3);
        var record = decisionRecord(loan.state, loan);

        return (
          /* Needs review is not here. It lived at the top of this tab and again,
             item by item, in the card in the rail — so the officer met the same
             two exceptions twice before reaching anything she had come to the
             overview to read. It has one home now, the rail, where it sits under
             the card that counts it and above the assistant that advises on it.
             The overview is the record: the decision, the snapshot, the
             documents, the conditions, the activity. */
          (view.draft === "developer-query" ? renderDeveloperQuery(loan) : "") +
          (record && !record.signed ? renderSigningSheet(loan) : "") +
          renderDecisionRecord(loan) +
          renderDecisionPanel(loan, view) +
          sectionOpen("lender.overview.snapshot-heading") +
          '<dl class="snapshot-grid">' +
          detailRow("lender.overview.snapshot-requested", money(loan.requestedUF)) +
          detailRow(
            "lender.overview.snapshot-deed-date",
            loan.deedDate ? credit.formatDate(loan.deedDate) : t("common.empty")
          ) +
          "<div><dt>" +
          text("lender.overview.snapshot-documents") +
          "</dt><dd>" +
          text("lender.overview.snapshot-documents-value", progress) +
          "</dd></div>" +
          detailRow(
            "lender.overview.snapshot-dti",
            figures ? credit.formatPct(figures.dti.ratio * 100) : t("common.empty")
          ) +
          "</dl></section>" +
          '<section class="workspace-grid"><div class="record-card"><h3>' +
          text("lender.overview.application-card") +
          "</h3>" +
          metaRow("lender.application.name", loan.borrowerName) +
          metaRow("lender.application.address", loan.address) +
          metaRow("lender.toolbar.stage", stageLabel(loan.stage)) +
          '</div><div class="record-card"><h3>' +
          text("lender.overview.documents-card") +
          "</h3>" +
          /* Same order as the Documents tab, for the same reason: the two that
             need something come first. */
          documentsByAttention(loan)
            .map(function (documentId) {
              return metaRow(
                "doc." + documentId + ".name",
                t("verdict." + loan.state.documents[documentId].verdict)
              );
            })
            .join("") +
          "</div></section>" +
          /* Conditions are not here either. They are part of what is holding
             this case, which is the one question the rail answers — and
             answering it half here and half there meant the two halves never
             appeared on screen together. All three sit in the Needs review
             panel now: the open ones saying what will clear them, the cleared
             ones with the date they cleared on. */
          sectionOpen(
            "lender.overview.activity-heading",
            '<button type="button" data-workspace-tab="audit">' +
              text("lender.overview.view-audit") +
              "</button>"
          ) +
          (recent.length
            ? recent
                .map(function (event) {
                  return (
                    '<div class="activity-row"><span>' +
                    text("audit." + event.action) +
                    '</span><time datetime="' +
                    escapeHtml(event.timestamp) +
                    '">' +
                    escapeHtml(formatTimestamp(event.timestamp)) +
                    "</time></div>"
                  );
                })
                .join("")
            : "<p>" + text("lender.overview.no-activity") + "</p>") +
          "</section>"
        );
      }

      /* ===================================================== what needs the desk
       *
       * One inventory of open work, and one pointer to it.
       *
       * There used to be four tellings of the same fact inside this drawer: a
       * `Needs review` chip in the header, a bell whose tray listed every item
       * in full, the analysis card's own list of them, and the queue itself. An
       * officer had to check all four to be sure she had seen everything, which
       * is the opposite of what any of them were for. What is left is a count on
       * the card, a panel that carries the work, and — in the header, where the
       * bell was — a button that says how much is waiting and takes you there.
       *
       * It is *per case*: nothing waits on a portfolio, it waits on a file, so
       * the button lives in the case header and appears only with a case open.
       * And it is *derived*, never accumulated: it is a fact about the state, so
       * nothing is pushed, nothing is stored, and settling an item removes it
       * without anyone dismissing it. There is no unread count and nothing to
       * mark as seen — the work is either open or it is not, and "seen" was a
       * third state that meant nothing to the file.
       */

      /* Worst first. An officer opening a file wants the document that was sent
         back before the one still being read, and either before the six that are
         fine — so this order is the default everywhere a document or an item is
         listed, rather than the fixed checklist order that buried both. */
      var VERDICT_ATTENTION = {
        rejected: 0,
        "under-review": 1,
        "not-uploaded": 2,
        "accepted-with-condition": 3,
        accepted: 4
      };

      function verdictAttention(verdict) {
        var rank = VERDICT_ATTENTION[verdict];
        return rank === undefined ? 5 : rank;
      }

      /* `sort` is not guaranteed stable across every engine this might run in,
         so the checklist position is carried as the tie-break: two accepted
         documents keep the order the checklist put them in. */
      function documentsByAttention(loan) {
        return workspace.DOCUMENT_IDS.map(function (documentId, index) {
          var record = loan.state.documents[documentId];
          return {
            id: documentId,
            rank: verdictAttention(record ? record.verdict : "not-uploaded"),
            index: index
          };
        })
          .sort(function (a, b) {
            return a.rank - b.rank || a.index - b.index;
          })
          .map(function (entry) {
            return entry.id;
          });
      }

      /* The same order for the queue: an item on a document that was sent back
         comes before one on a document still under review. An item with no
         document of its own — the deed deadline — sorts on its own age, after
         the document work. Her messages are not in this list at all
         (§actionableReviewItems): they are answered, not decided. */
      function openItemsByAttention(loan) {
        return actionableReviewItems(loan.state)
          .map(function (item, index) {
            var record = item.documentId ? loan.state.documents[item.documentId] : null;
            return {
              item: item,
              rank: record ? verdictAttention(record.verdict) : 6,
              index: index
            };
          })
          .sort(function (a, b) {
            return a.rank - b.rank || a.index - b.index;
          })
          .map(function (entry) {
            return entry.item;
          });
      }

      /**
       * The pointer, in the case header. Absent when the case is clear: a button
       * reading "nothing is waiting" is a control that does nothing, and the
       * panel says it better in the one place that is always on screen.
       */
      function renderNeedsReviewAlert(loan) {
        var waiting = needsReviewCount(loan);
        if (!waiting) return "";
        return (
          '<button type="button" class="needs-alert" data-workspace-action="needs-review"' +
          ' aria-label="' +
          text("lender.needs.alert-aria", { notifications: notificationsPhrase(waiting) }) +
          '"><span aria-hidden="true">⚠</span>' +
          text("lender.needs.alert") +
          '<span class="needs-count" aria-hidden="true">' +
          waiting +
          "</span></button>"
        );
      }

      /* The case's own folder, right beside the alert it sits next to — a
         fixture has no folder to link to, so nothing renders for the ten
         read-only cases. */
      function renderWorkspaceDriveLink(loan) {
        if (!loan.driveUrl) return "";
        return (
          '<a class="workspace-drive-link" href="' +
          escapeHtml(loan.driveUrl) +
          '" target="_blank" rel="noopener noreferrer" aria-label="' +
          text("lender.workspace.drive-aria", { case: loan.caseId }) +
          '"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M1.5 3.5A1 1 0 0 1 2.5 2.5h3.4a1 1 0 0 1 .8.4l1 1.1h4.8a1 1 0 0 1 1 1v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></a>'
        );
      }

      /* ============================================== what the file says, in short
       *
       * The one card that answers "should I be worried about this application?"
       * without reading five tabs: what is holding up on the left of the ledger,
       * what is not on the right. It sits in the rail beside the record, above
       * the thread, so the summary and the evidence are on screen together.
       *
       * Every line is read out of the case. Nothing here is written down twice.
       */
      /**
       * The document arithmetic, in the three states an officer actually asks
       * about: how many arrived, how many of those are accepted, and how many
       * are still being looked at. They add up on sight — uploaded = accepted +
       * needs review — which is the whole point. The card used to report
       * "8 of 9 settled" beside "7 documents accepted" and leave her to work out
       * both what "settled" meant and how many had even been sent.
       */
      function analysisFor(loan) {
        var documents = workspace.DOCUMENT_IDS;
        var accepted = 0;
        var uploaded = 0;
        var failedChecks = 0;
        var passedChecks = 0;
        documents.forEach(function (documentId) {
          var record = loan.state.documents[documentId];
          if (record.verdict === "accepted" || record.verdict === "accepted-with-condition") {
            accepted += 1;
          }
          if (record.verdict !== "not-uploaded") uploaded += 1;
          reviewChecksFor(loan, documentId, record).forEach(function (item) {
            if (item.status === "verified") passedChecks += 1;
            if (item.status === "mismatch" || item.status === "missing") failedChecks += 1;
          });
        });
        return {
          documents: documents.length,
          uploaded: uploaded,
          accepted: accepted,
          /* Arrived, and not yet accepted: under review or sent back. */
          needsReview: uploaded - accepted,
          missing: documents.length - uploaded,
          passedChecks: passedChecks,
          totalChecks: passedChecks + failedChecks,
          failedChecks: failedChecks
        };
      }

      function analysisLine(label) {
        return "<li>" + label + "</li>";
      }

      /**
       * The card counts; the queue underneath it names. It used to do both —
       * every open item was repeated here as a clickable destination, directly
       * above the queue that already carried the same two items with their
       * reasons and their reply boxes. One card, one job: how the file stands,
       * in numbers that add up. The way *in* to a document is the queue item
       * itself, which is a foot away and can also answer it.
       */
      function renderCaseAnalysis(loan) {
        var totals = analysisFor(loan);
        /* Arithmetic needs an application behind it, and the condition gate is
           the live case's own narrative. A fixture has neither, so it reports
           the part of the card it genuinely knows — its documents, its checks
           and its open work — and stays silent on the rest rather than
           announcing that it is a fixture (§11). */
        var figures = caseFiguresFor(loan);
        var openConditions = openConditionsOf(loan);
        var holding = [];
        var failing = [];

        /* The three document lines are one sentence split across the two
           halves of the card: of the nine, this many are accepted, this many are
           still being looked at, and this many never arrived. Each is stated
           against the same total so nothing has to be deduced, and a count of
           zero is simply absent rather than a line saying nothing happened. */
        if (totals.accepted) {
          holding.push(
            analysisLine(
              text("lender.analysis.documents-accepted", {
                count: totals.accepted,
                total: totals.documents
              })
            )
          );
        }
        if (totals.needsReview) {
          failing.push(
            analysisLine(
              text("lender.analysis.documents-review", {
                count: totals.needsReview,
                total: totals.documents
              })
            )
          );
        }
        if (totals.missing) {
          failing.push(
            analysisLine(text("lender.analysis.documents-missing", { count: totals.missing }))
          );
        }
        if (totals.totalChecks) {
          holding.push(
            analysisLine(
              text("lender.analysis.checks-passed", {
                count: totals.passedChecks,
                total: totals.totalChecks
              })
            )
          );
        }
        if (figures) {
          var ratio = credit.formatPct(figures.dti.ratio * 100);
          var cap = credit.formatPct(figures.dti.cap * 100);
          var affordability = analysisLine(
            text(
              figures.dti.overCap
                ? "lender.analysis.affordability-over"
                : "lender.analysis.affordability-ok",
              { ratio: ratio, cap: cap }
            )
          );
          (figures.dti.overCap ? failing : holding).push(affordability);
          /* The stressed ratio is not here. This card answers "what is true of
             this file"; a rate rise that has not happened is a scenario, and it
             read as a defect the officer had to go and disprove. It keeps its
             own section on the Risk tab, where a scenario is the point. */
        }
        /* Each condition tracks one document, so while documents are waiting the
           two counts are the same two documents said twice — "2 waiting on
           review" over "2 conditions still to clear" is one fact wearing a
           second hat. The condition line therefore appears only when it says
           something the document line does not: conditions still standing on
           documents that are no longer flagged as waiting. `gate-open` always
           appears, because a gate that has opened is news the document counts
           cannot give. */
        if (openConditions.length && !totals.needsReview) {
          failing.push(
            analysisLine(text("lender.analysis.gate-blocked", { count: openConditions.length }))
          );
        } else if (!openConditions.length && !loan.readonly) {
          holding.push(analysisLine(text("lender.analysis.gate-open")));
        }
        /* Said plainly now, whenever there is one. It used to be suppressed
           while open items were listed here, on the grounds that the items said
           it better — but the items have gone back to the queue, and a count of
           failed checks is not the same fact as a count of open items anyway. */
        if (totals.failedChecks) {
          failing.push(
            analysisLine(text("lender.analysis.checks-failed", { count: totals.failedChecks }))
          );
        }

        return (
          '<section class="analysis-card" aria-labelledby="analysis-title">' +
          '<h3 id="analysis-title">' +
          text("lender.analysis.title") +
          '</h3><p class="analysis-sub">' +
          text("lender.analysis.subtitle", {
            uploaded: totals.uploaded,
            total: totals.documents
          }) +
          "</p>" +
          '<div class="analysis-group bad"><h4>' +
          text("lender.analysis.wrong-heading") +
          "</h4>" +
          (failing.length
            ? '<ul class="analysis-list">' + failing.join("") + "</ul>"
            : '<p class="analysis-empty">' + text("lender.analysis.none-wrong") + "</p>") +
          '</div><div class="analysis-group good"><h4>' +
          text("lender.analysis.correct-heading") +
          "</h4>" +
          (holding.length
            ? '<ul class="analysis-list">' + holding.join("") + "</ul>"
            : '<p class="analysis-empty">' + text("lender.analysis.none-holding") + "</p>") +
          "</div></section>"
        );
      }

      /* ======================================================= the deal assistant
       *
       * A reader of one case, sitting under the analysis card. It is **not** a
       * language model and does not pretend to be: every answer is a written
       * sentence from the copy layer with this case's own numbers interpolated
       * into it, chosen by what the question is about and by what the state says
       * about that thing. The same question therefore always gets the same
       * answer, which is what makes the demo repeatable and what lets the panel
       * be trusted at all — an assistant that might be guessing is worse than no
       * assistant. The subtitle says as much on the surface.
       *
       * It answers; it never acts. Where an answer has a next step, it offers
       * the control that already exists elsewhere on the case and routes to it.
       */

      /* The open items as one readable clause: "Document exception on the title
         certificate, and Document exception on the tax folder". */
      function listOfItems(items) {
        return items
          .map(function (item) {
            return item.documentId
              ? t("lender.analysis.open-item", {
                  reason: t("review." + item.type),
                  document: t("doc." + item.documentId + ".name")
                })
              : t("review." + item.type);
          })
          .join("; ");
      }

      /**
       * The conditions still holding this case — which, since the appraisal was
       * dropped, is simply the conditions not yet cleared. There were briefly
       * two functions here, one counting every open condition and one counting
       * the subset that gated approval, because the appraisal was open forever
       * and gated nothing; the header could then say 4 while the panel said 5.
       * Every condition gates now, so one function answers it everywhere and
       * nothing can disagree with anything.
       */
      function openConditionsOf(loan) {
        if (loan.readonly) return [];
        return loan.state.conditions.filter(function (condition) {
          return !condition.cleared;
        });
      }

      function listOfConditions(conditions) {
        return conditions
          .map(function (condition) {
            return t("lender.condition." + condition.id);
          })
          .join(" ");
      }

      function assistantAction(action, labelKey, params) {
        return { action: action, label: t(labelKey, params) };
      }

      function openDocumentAction(documentId) {
        return {
          documentId: documentId,
          label: t("lender.assistant.action-open-document", {
            document: t("doc." + documentId + ".name")
          })
        };
      }

      /* What to do, in order, derived the same way everything else here is. The
         brief says what is in the way; this says which end to pick it up by. */
      function dealAssistantNextSteps(loan) {
        var steps = [];
        var open = actionableReviewItems(loan.state);
        var record = decisionRecord(loan.state, loan);
        var outstanding = workspace.DOCUMENT_IDS.filter(function (documentId) {
          return verdictOf(loan, documentId) === "not-uploaded";
        });

        /* One step for the queue, not one step per item. The queue is directly
           above this list with every item named, its reason under it and its
           reply box beside it; repeating them here made the rail state the same
           two exceptions a third time. What this list is for is the *order* —
           items, then the documents still to collect, then the conditions, then
           approve, then sign — and the order needs one line per stage. */
        if (open.length) {
          steps.push(t("lender.assistant.next-settle", { count: open.length }));
        }
        if (outstanding.length) {
          steps.push(
            t("lender.assistant.next-collect", {
              names: outstanding
                .map(function (documentId) {
                  return t("doc." + documentId + ".name");
                })
                .join(", ")
            })
          );
        }
        var conditions = openConditionsOf(loan);
        /* And no separate condition step while the items are open. Each
           condition clears with the document its item is about, so "settle the
           2 items" and "clear the 2 conditions" are one instruction written
           twice — and the second one cannot be followed on its own. It appears
           when the items are gone and a condition is somehow still standing. */
        if (conditions.length && !open.length) {
          steps.push(t("lender.assistant.next-conditions", { count: conditions.length }));
        }
        if (record && !record.signed) {
          steps.push(t("lender.assistant.next-sign"));
        } else if (!record && !loan.readonly && !conditions.length && !open.length) {
          steps.push(t("lender.assistant.next-approve"));
        }
        if (!steps.length) steps.push(t("lender.assistant.next-none"));
        return steps;
      }

      /**
       * The agents the composer can start.
       *
       * Each `action` is a transition the case already has, so triggering one
       * moves the file and lands in the audit trail — none of them is a message
       * claiming an agent "has been triggered". `reads` marks the one that only
       * looks, which is therefore the only one a read-only fixture will run.
       *
       * `reorder-service` is the same rule applied to a service rather than a
       * document: it only ever moves the one field the case tracks for a
       * third party (the inspection), and its own response says so instead of
       * claiming the title or the appraisal moved with it. The appraisal
       * still gets no agent of its own that *orders* it fresh — it is ordered
       * on approval, so doing that now would contradict the file being read —
       * but re-ordering an inspection that already came back is a real
       * transition, which is what this one runs.
       *
       * "Ask the developer" is still how the case gets its release query
       * drafted — the assistant offers it as a button on a title answer
       * rather than here, so the menu stays the four the desk actually asked
       * for.
       */
      var DEAL_AGENTS = [
        { id: "follow-up", action: "remind-borrower" },
        { id: "scan", action: null, reads: true },
        { id: "escalate", action: "escalate" },
        { id: "reorder", action: "reorder-service" }
      ];

      function dealAgent(agentId) {
        var found = null;
        DEAL_AGENTS.forEach(function (agent) {
          if (agent.id === agentId) found = agent;
        });
        return found;
      }

      /* What the scan finds, which is only ever what is on the case. */
      function dealAgentScan(loan) {
        var findings = [];
        var outstanding = workspace.DOCUMENT_IDS.filter(function (documentId) {
          var verdict = verdictOf(loan, documentId);
          return verdict !== "accepted" && verdict !== "accepted-with-condition";
        });
        var open = actionableReviewItems(loan.state);
        var conditions = openConditionsOf(loan);
        var messages = 0;
        workspace.DOCUMENT_IDS.forEach(function (documentId) {
          var record = loan.state.documents[documentId];
          if (!record) return;
          record.messages.forEach(function (message) {
            if (message.author === "borrower") messages += 1;
          });
        });

        if (outstanding.length) {
          findings.push(
            t("lender.assistant.scan-documents", {
              count: outstanding.length,
              names: outstanding
                .map(function (documentId) {
                  return t("doc." + documentId + ".name");
                })
                .join(", ")
            })
          );
        }
        if (open.length) {
          findings.push(
            t("lender.assistant.scan-items", { count: open.length, items: listOfItems(open) })
          );
        }
        if (conditions.length) {
          findings.push(t("lender.assistant.scan-conditions", { count: conditions.length }));
        }
        if (messages) {
          findings.push(
            t("lender.assistant.scan-messages", {
              count: messages,
              borrower: loan.borrowerName
            })
          );
        }
        if (!findings.length) {
          return t("lender.assistant.agent.scan-ran-clear", {
            total: workspace.DOCUMENT_IDS.length
          });
        }
        return t("lender.assistant.agent.scan-ran", { findings: findings.join("; ") });
      }

      /**
       * Running one agent: what it says, and the case action it then runs.
       * Escalation has no sentence of its own — the case answers that one, and
       * its answer is already written down as `lender.action.escalate-response`.
       */
      function dealAgentRun(loan, agentId) {
        var agent = dealAgent(agentId);
        if (!agent) return null;
        if (agent.id === "scan") {
          return { agent: agent, text: dealAgentScan(loan), action: null };
        }
        if (agent.id === "escalate") {
          return {
            agent: agent,
            text: t("lender.action.escalate-response", { authority: officerAuthority() }),
            action: "escalate"
          };
        }
        if (agent.id === "follow-up") {
          return {
            agent: agent,
            text: t("lender.assistant.agent.follow-up-ran", { borrower: loan.borrowerName }),
            action: "remind-borrower"
          };
        }
        return {
          agent: agent,
          text: t("lender.assistant.agent.reorder-ran"),
          action: "reorder-service"
        };
      }

      /* What is in the way, right now, with the controls that would move it. */
      function dealAssistantBrief(loan) {
        var open = actionableReviewItems(loan.state);
        var conditions = openConditionsOf(loan);
        var record = decisionRecord(loan.state, loan);
        var actions = [];
